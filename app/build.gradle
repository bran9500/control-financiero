plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ktrsis.controlfinanciero'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktrsis.controlfinanciero'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
