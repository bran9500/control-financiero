plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ktrsis.controlfinanciero'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktrsis.controlfinanciero'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '3.16'
        // Solo procesadores de teléfono (el lector de texto trae librerías para cada uno)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lectura de texto en capturas de pantalla (modelo incluido en la app, funciona sin internet)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
