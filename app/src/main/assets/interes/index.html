<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interés compuesto</title>
<style>
  :root{
    --bg:#12161C; --surface:#1B2129; --surface-raised:#232A35; --line:#2A313B;
    --ink:#E8E6E0; --ink-dim:#8B93A0; --ink-faint:#5B6472; --good:#6FA98A; --warn:#C4693B; --blue:#3987e5;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 110px 14px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px 2px;gap:10px;}
  .page-title{font-family:var(--serif);font-size:26px;margin:0;}
  .sub{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0 0;}
  .icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn svg{width:20px;height:20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .card-title{font-family:var(--serif);font-size:17px;margin:0 0 10px 0;}
  .muted{font-size:13px;color:var(--ink-dim);line-height:1.55;margin:0;}
  .faint{font-size:12px;color:var(--ink-faint);}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-width:0;}
  .stat .n{font-family:var(--mono);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat .t{font-size:11px;color:var(--ink-faint);margin-top:3px;}
  .progress{height:8px;border-radius:4px;background:var(--surface-raised);overflow:hidden;margin:10px 0 6px 0;}
  .progress span{display:block;height:100%;background:var(--good);border-radius:4px;}
  .btn{background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);padding:12px 16px;border-radius:12px;font-size:15px;cursor:pointer;font-family:var(--sans);}
  .btn-solid{background:var(--good);border-color:var(--good);color:#0E1A14;font-weight:600;}
  .btn-warn{border-color:var(--warn);color:var(--warn);}
  .btn-block{width:100%;display:block;text-align:center;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
  .chip{white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:var(--sans);}
  .chip.active{border-color:var(--good);color:var(--ink);}
  .next{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:6px 0 14px 0;}
  .next .v{font-family:var(--mono);font-size:17px;}
  .next .l{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .next .arrow{color:var(--ink-faint);}
  label.f{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:5px;}
  input[type=number], input[type=text], input[type=date]{width:100%;background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:15px;font-family:var(--sans);}
  .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13px;}
  th{font-weight:500;color:var(--ink-faint);text-align:right;padding:4px 6px 6px 6px;font-size:11px;position:sticky;top:0;background:var(--surface);z-index:1;}
  th:first-child, td:first-child{text-align:left;}
  td{padding:9px 6px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--surface-raised);vertical-align:middle;}
  td:first-child{border-radius:10px 0 0 10px;}
  td:last-child{border-radius:0 10px 10px 0;}
  td.n{color:var(--ink-faint);font-size:12px;width:26px;}
  td.fin{font-weight:600;}
  td .pc{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
  td .pc.cust{color:var(--blue);}
  td .g{color:var(--good);} td .rd{color:var(--warn);}
  td.dt{text-align:center;font-size:11px;color:var(--ink-faint);width:44px;}
  .bdg{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-bottom:2px;}
  .bdg.w{background:rgba(111,169,138,.18);color:var(--good);}
  .bdg.l{background:rgba(196,105,59,.18);color:var(--warn);}
  .bdg.a{background:rgba(57,135,229,.18);color:var(--blue);}
  tr.todo td{background:transparent;color:var(--ink-faint);}
  tr.todo td.fin{font-weight:400;}
  tr.cur td{background:rgba(111,169,138,.12);color:var(--ink);}
  tr.loss td.fin{color:var(--warn);}
  .tbl-wrap{max-height:520px;overflow:auto;}
  .miles{display:flex;flex-wrap:wrap;gap:6px;}
  .mile{background:var(--surface-raised);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--ink-dim);}
  .mile b{color:var(--ink);font-family:var(--mono);font-weight:500;}
  .mile.ok{color:var(--good);}
  .seg{display:flex;background:var(--surface-raised);border-radius:10px;padding:3px;gap:3px;}
  .seg button{flex:1;padding:6px;border-radius:8px;border:none;background:none;color:var(--ink-dim);font-size:12px;cursor:pointer;}
  .seg button.active{background:var(--surface);color:var(--ink);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;}
  .sheet{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;padding:20px 16px 26px 16px;width:100%;max-width:560px;border:1px solid var(--line);}
  #toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:#2C3440;color:var(--ink);font-size:13px;padding:10px 15px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center;z-index:20;}
  #toast.show{opacity:1;}
  svg.chart text{font-family:var(--sans);font-size:10px;fill:var(--ink-faint);}
</style>
<script src="../theme.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet-root"></div>
<div id="toast"></div>
<script>
// ============================================================
//  INTERÉS COMPUESTO — igual que tu Excel "A por 100 victorias":
//  cada victoria suma un % al saldo; la siguiente arranca con el saldo final.
// ============================================================
const KEY = 'interes-data';
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}`; }
function money(n){ const a = Math.abs(n); const s = a >= 100000 ? Math.round(a).toLocaleString('en-US') : a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (n < 0 ? '-$' : '$') + s; }
function short(n){ const a=Math.abs(n); if(a>=1e6) return '$'+(n/1e6).toFixed(a>=1e7?1:2)+'M'; if(a>=1e4) return '$'+(n/1e3).toFixed(1)+'k'; return money(n); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); }
function native(fn){ return window.Android && typeof Android[fn] === 'function'; }
function cm(n){ const a = Math.abs(n); if(a >= 1e6) return '$' + (a/1e6).toFixed(a >= 1e8 ? 0 : 2) + 'M'; if(a >= 1e5) return '$' + (a/1e3).toFixed(1) + 'k'; if(a >= 1e3) return '$' + Math.round(a).toLocaleString('en-US'); return '$' + a.toFixed(2); }
function fmtPct(v){ return (Math.round(v * 100) / 100).toString() + '%'; }
function r2(n){ return Math.round(n * 100) / 100; }

function defaultPlan(){ return { id: 'p' + Date.now(), name: 'A por 100 victorias', start: 50, pct: 9, goal: 100, events: [] }; }
let st = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if(d && d.plans && d.plans.length) return d; }catch(e){}
  const p = defaultPlan(); return { plans:[p], cur:p.id };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){ toast('No se pudo guardar'); } }
function plan(){ return st.plans.find(p => p.id === st.cur) || st.plans[0]; }

// ---- cálculo (como el Excel: USD × % = INT. COMP.; USD + INT = USD F.; la siguiente fila arranca con USD F.) ----
function compute(p){
  const rate = p.pct / 100;
  const rows = [];               // filas reales (victorias y pérdidas)
  let bal = p.start, wins = 0;
  for(const e of p.events){
    const usd = bal;
    let fin, pc;
    if(e.amt != null){ fin = Math.max(0, usd - e.amt); pc = usd ? (fin / usd - 1) * 100 : 0; }   // pérdida en $ (versión anterior)
    else { pc = e.pct != null ? e.pct : p.pct; fin = Math.max(0, usd * (1 + pc / 100)); }
    const int = fin - usd;
    const counts = e.t === 'W';
    if(counts) wins++;
    rows.push({ kind: counts ? 'W' : (int < 0 ? 'L' : 'A'), n: counts ? wins : null, usd, pct: pc, int, fin, d:e.d, custom: e.pct != null && e.pct !== p.pct });
    bal = fin;
  }
  // filas que faltan, proyectadas desde el saldo real
  const proj = []; let b = bal;
  for(let n = wins + 1; n <= p.goal; n++){ const int = b * rate, fin = b + int; proj.push({ kind:'P', n, usd:b, pct:p.pct, int, fin }); b = fin; }
  // plan original sin pérdidas (la meta del Excel)
  let ideal = p.start; const idealCurve = [p.start];
  for(let n = 1; n <= p.goal; n++){ ideal = ideal * (1 + rate); idealCurve.push(ideal); }
  const losses = rows.filter(r => r.int < 0);
  return { rows, proj, bal, wins, finalProj: proj.length ? proj[proj.length-1].fin : bal, ideal, idealCurve, lossTotal: losses.reduce((s,r) => s - r.int, 0), lossCount: losses.length, offPlan: rows.some(r => r.kind !== 'W' || r.custom) };
}

// ---- acciones ----
function win(){ const p = plan(); const c = compute(p); if(c.wins >= p.goal){ toast('¡Ya llegaste a la meta! Crea un plan nuevo o súbele la meta.'); return; } p.events.push({ t:'W', d: today(), pct: p.pct }); save(); render(); toast(`Victoria #${c.wins + 1} ✓  →  ${money(compute(p).bal)}`); }
function undo(){ const p = plan(); if(!p.events.length) return; const e = p.events.pop(); save(); render(); toast(e.t === 'W' ? 'Victoria deshecha' : 'Resultado deshecho'); }
let rs = { dir:'win', counts:true };
function openResult(){
  const c = compute(plan());
  rs = { dir:'win', counts:true, base:c.bal };
  document.getElementById('sheet-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <p class="card-title">Otro resultado</p>
    <p class="muted" style="margin-bottom:12px;">Para cuando paras antes o el mercado está difícil. Entraste con <b style="color:var(--ink);">${money(c.bal)}</b>. Llena <b style="color:var(--ink);">uno</b> de los tres y yo calculo los otros.</p>
    <div class="seg" style="margin-bottom:12px;padding:4px;">
      <button id="rs-win" class="active" onclick="setDir('win')" style="padding:9px;font-size:14px;">Gané</button>
      <button id="rs-loss" onclick="setDir('loss')" style="padding:9px;font-size:14px;">Perdí</button>
    </div>
    <div class="fields">
      <div><label class="f">%</label><input type="number" id="rs-pct" inputmode="decimal" step="0.01" min="0" placeholder="0" oninput="rsFrom('pct')"></div>
      <div><label class="f" id="rs-amt-l">Gané $</label><input type="number" id="rs-amt" inputmode="decimal" step="0.01" min="0" placeholder="0.00" oninput="rsFrom('amt')"></div>
      <div><label class="f">Quedé en $</label><input type="number" id="rs-fin" inputmode="decimal" step="0.01" min="0" placeholder="${c.bal.toFixed(2)}" oninput="rsFrom('fin')"></div>
    </div>
    <label id="rs-count-wrap" style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink-dim);">
      <input type="checkbox" id="rs-count" checked style="width:20px;height:20px;accent-color:#6FA98A;"> Contarla como victoria (avanza el #)
    </label>
    <p id="rs-prev" class="num" style="margin:12px 0 0 0;font-size:15px;min-height:20px;"></p>
    <div class="row" style="margin-top:14px;"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn btn-solid" id="rs-save" onclick="saveResult()">Guardar</button></div>
  </div></div>`;
}
function setDir(d){
  rs.dir = d;
  document.getElementById('rs-win').classList.toggle('active', d === 'win');
  document.getElementById('rs-loss').classList.toggle('active', d === 'loss');
  document.getElementById('rs-amt-l').textContent = d === 'win' ? 'Gané $' : 'Perdí $';
  document.getElementById('rs-count-wrap').style.display = d === 'win' ? 'flex' : 'none';
  const save = document.getElementById('rs-save'); save.className = 'btn ' + (d === 'win' ? 'btn-solid' : 'btn-warn');
  rsFrom(rs.last || 'pct');
}
function rsFrom(src){
  rs.last = src;
  const base = rs.base, sign = rs.dir === 'win' ? 1 : -1;
  const P = document.getElementById('rs-pct'), A = document.getElementById('rs-amt'), F = document.getElementById('rs-fin');
  let fin = null;
  if(src === 'pct'){ const v = parseFloat(P.value); if(v >= 0){ fin = base * (1 + sign * v / 100); A.value = (Math.abs(fin - base)).toFixed(2); F.value = fin.toFixed(2); } }
  if(src === 'amt'){ const v = parseFloat(A.value); if(v >= 0){ fin = base + sign * v; P.value = base ? +(v / base * 100).toFixed(2) : 0; F.value = fin.toFixed(2); } }
  if(src === 'fin'){ const v = parseFloat(F.value); if(v >= 0){ fin = v; const d = fin >= base ? 'win' : 'loss'; if(d !== rs.dir){ rs.dir = d; setDir(d); return; } P.value = base ? +(Math.abs(fin / base - 1) * 100).toFixed(2) : 0; A.value = Math.abs(fin - base).toFixed(2); } }
  rs.fin = fin;
  const prev = document.getElementById('rs-prev');
  if(fin == null || isNaN(fin)){ prev.textContent = ''; return; }
  if(fin < 0){ prev.innerHTML = '<span style="color:var(--warn);">No puedes perder más de lo que tienes</span>'; rs.fin = null; return; }
  const d = fin - base, pc = base ? d / base * 100 : 0;
  prev.innerHTML = `${money(base)} → <b>${money(fin)}</b> <span style="color:${d >= 0 ? 'var(--good)' : 'var(--warn)'};">(${d >= 0 ? '+' : '−'}${money(Math.abs(d)).replace('-','')}, ${d >= 0 ? '+' : '−'}${Math.abs(pc).toFixed(2)}%)</span>`;
}
function saveResult(){
  if(rs.fin == null || isNaN(rs.fin)){ toast('Pon el %, el monto o en cuánto quedaste'); return; }
  const p = plan(), c = compute(p);
  if(Math.abs(rs.fin - rs.base) < 0.005){ toast('Quedaste igual: no hay nada que registrar'); return; }
  const pct = rs.base ? (rs.fin / rs.base - 1) * 100 : 0;
  const counts = rs.dir === 'win' && document.getElementById('rs-count').checked;
  if(counts && c.wins >= p.goal){ toast('Ya llegaste a la meta. Súbele la meta para contar más victorias.'); return; }
  p.events.push({ t: counts ? 'W' : 'R', d: today(), pct });
  save(); closeSheet(); render();
  toast(counts ? `Victoria #${c.wins + 1} (${pct.toFixed(2)}%) → ${money(rs.fin)}` : `Guardado: quedaste en ${money(rs.fin)}`);
}
function closeSheet(){ document.getElementById('sheet-root').innerHTML = ''; }
function openSettings(isNew){
  const p = isNew ? { name:'', start:50, pct:9, goal:100 } : plan();
  document.getElementById('sheet-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <p class="card-title">${isNew ? 'Plan nuevo' : 'Editar plan'}</p>
    <label class="f">Nombre</label>
    <input type="text" id="s-name" value="${esc(p.name)}" placeholder="Ej: A por 100 victorias" style="margin-bottom:10px;">
    <div class="fields">
      <div><label class="f">Capital inicial</label><input type="number" id="s-start" inputmode="decimal" step="0.01" value="${p.start}"></div>
      <div><label class="f">% por victoria</label><input type="number" id="s-pct" inputmode="decimal" step="0.1" value="${p.pct}"></div>
      <div><label class="f">Meta (victorias)</label><input type="number" id="s-goal" inputmode="numeric" step="1" value="${p.goal}"></div>
    </div>
    <p class="faint" style="margin:10px 0 0 0;" id="s-preview"></p>
    <div class="row" style="margin-top:14px;"><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn btn-solid" onclick="saveSettings(${isNew?'true':'false'})">${isNew ? 'Crear' : 'Guardar'}</button></div>
    ${!isNew && st.plans.length > 1 ? `<button class="btn btn-block btn-warn" style="margin-top:10px;" onclick="deletePlan()">Borrar este plan</button>` : ''}
    ${!isNew && p.events.length ? `<button class="btn btn-block" style="margin-top:10px;" onclick="resetPlan()">Empezar de cero (borrar victorias)</button>` : ''}
  </div></div>`;
  const upd = () => {
    const s = parseFloat(document.getElementById('s-start').value) || 0, pc = parseFloat(document.getElementById('s-pct').value) || 0, g = parseInt(document.getElementById('s-goal').value) || 0;
    document.getElementById('s-preview').textContent = s > 0 && g > 0 ? `Con ${money(s)} y ${pc}% por victoria, en ${g} victorias llegarías a ${money(s * Math.pow(1 + pc/100, g))}.` : '';
  };
  ['s-start','s-pct','s-goal'].forEach(id => document.getElementById(id).addEventListener('input', upd)); upd();
}
function saveSettings(isNew){
  const name = document.getElementById('s-name').value.trim() || 'Mi plan';
  const start = parseFloat(document.getElementById('s-start').value), pct = parseFloat(document.getElementById('s-pct').value), goal = parseInt(document.getElementById('s-goal').value);
  if(!(start > 0) || !(pct > 0) || !(goal > 0)){ toast('Revisa los valores: deben ser mayores que 0'); return; }
  if(goal > 1000){ toast('La meta máxima es 1,000 victorias'); return; }
  if(isNew){ const p = { id:'p'+Date.now(), name, start, pct, goal, events:[] }; st.plans.push(p); st.cur = p.id; }
  else { Object.assign(plan(), { name, start, pct, goal }); }
  save(); closeSheet(); render();
}
function deletePlan(){ if(!confirm('¿Borrar este plan y su historial?')) return; st.plans = st.plans.filter(p => p.id !== st.cur); st.cur = st.plans[0].id; save(); closeSheet(); render(); }
function resetPlan(){ if(!confirm('¿Borrar todas las victorias y pérdidas de este plan?')) return; plan().events = []; save(); closeSheet(); render(); }
function pick(id){ st.cur = id; save(); render(); }
let chartMode = 'log';
window.interesBack = function(){ if(document.getElementById('sheet-root').innerHTML){ closeSheet(); return true; } return false; };

// ---- gráfica ----
function chart(p, c){
  const W = 520, H = 200, L = 46, R = 10, T = 10, B = 24;
  const ideal = c.idealCurve;
  const real = [p.start]; c.rows.filter(r => r.kind === 'W').forEach(r => real.push(r.fin));
  // proyección desde hoy
  const projLine = [{ n:c.wins, v:c.bal }].concat(c.proj.map(r => ({ n:r.n, v:r.fin })));
  const maxV = Math.max(ideal[ideal.length-1], c.finalProj, c.bal);
  const minV = Math.max(1, Math.min(p.start, c.bal) * .8);
  const log = chartMode === 'log';
  const y = v => { v = Math.max(v, minV); return log ? T + (H-T-B) * (1 - (Math.log(v) - Math.log(minV)) / (Math.log(maxV) - Math.log(minV))) : T + (H-T-B) * (1 - v / maxV); };
  const x = n => L + (W-L-R) * n / p.goal;
  const path = pts => pts.map((pt,k) => (k?'L':'M') + x(pt.n).toFixed(1) + ' ' + y(pt.v).toFixed(1)).join(' ');
  // marcas del eje Y
  let ticks = [];
  if(log){ for(let e = Math.floor(Math.log10(minV)); e <= Math.ceil(Math.log10(maxV)); e++){ const v = Math.pow(10, e); if(v >= minV && v <= maxV) ticks.push(v); } }
  else { for(let k = 0; k <= 4; k++) ticks.push(maxV * k / 4); }
  const xt = [0, Math.round(p.goal/4), Math.round(p.goal/2), Math.round(3*p.goal/4), p.goal];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${short(v).replace('.00','')}</text>`).join('')}
    ${xt.map(n => `<text x="${x(n)}" y="${H-6}" text-anchor="middle">${n}</text>`).join('')}
    <path d="${path(ideal.map((v,n) => ({n,v})))}" fill="none" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="${path(projLine)}" fill="none" stroke="var(--good)" stroke-width="2" opacity=".45"/>
    ${real.length > 1 ? `<path d="${path(real.map((v,n) => ({n,v})))}" fill="none" stroke="var(--good)" stroke-width="2.5"/>` : ''}
    <circle cx="${x(c.wins)}" cy="${y(c.bal)}" r="4.5" fill="var(--good)" stroke="var(--surface)" stroke-width="2"/>
  </svg>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;" class="faint">
    <span><span style="display:inline-block;width:14px;border-top:2.5px solid var(--good);vertical-align:middle;"></span> Real</span>
    <span><span style="display:inline-block;width:14px;border-top:2px solid var(--good);opacity:.45;vertical-align:middle;"></span> Lo que falta</span>
    ${c.offPlan ? `<span><span style="display:inline-block;width:14px;border-top:1.5px dashed var(--ink-faint);vertical-align:middle;"></span> Plan original</span>` : ''}
  </div>`;
}

// ---- pantalla ----
function render(){
  const p = plan(), c = compute(p);
  const nxt = c.proj[0];
  const pct = Math.min(100, c.wins / p.goal * 100);
  const marks = [100, 500, 1000, 5000, 10000, 50000, 100000, 500000, 1000000].filter(v => v > p.start && v <= c.finalProj * 1.0001);
  const allRows = c.rows.map(r => ({ ...r, done:true })).concat(c.proj);
  const mileFor = v => { const hit = c.rows.filter(r => r.kind === 'W').find(r => r.fin >= v); if(hit) return { n:hit.n, done:true }; const pr = c.proj.find(r => r.fin >= v); return pr ? { n:pr.n, done:false } : null; };
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div style="min-width:0;"><p class="page-title">Interés compuesto</p><p class="sub">${esc(p.name)} · ${p.pct}% por victoria</p></div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" onclick="openSettings(false)" aria-label="Editar">${ICON.gear}</button>
        ${native('goHome') ? `<button class="icon-btn" onclick="Android.goHome()" aria-label="Inicio">${ICON.home}</button>` : ''}
      </div>
    </div>
    <div class="chips">${st.plans.map(q => `<button class="chip ${q.id===p.id?'active':''}" onclick="pick('${q.id}')">${esc(q.name)}</button>`).join('')}<button class="chip" onclick="openSettings(true)">+ Nuevo</button></div>

    <div class="grid3">
      <div class="stat"><div class="n" style="color:var(--good);">${short(c.bal)}</div><div class="t">saldo</div></div>
      <div class="stat"><div class="n">${c.wins}/${p.goal}</div><div class="t">victorias</div></div>
      <div class="stat"><div class="n">${short(c.finalProj)}</div><div class="t">meta</div></div>
    </div>

    <div class="card">
      ${nxt ? `
        <p class="card-title">Victoria #${nxt.n}</p>
        <div class="next">
          <div><div class="v">${money(nxt.usd)}</div><div class="l">entras con</div></div><div class="arrow">+</div>
          <div><div class="v" style="color:var(--good);">${money(nxt.int)}</div><div class="l">${p.pct}%</div></div><div class="arrow">=</div>
          <div><div class="v">${money(nxt.fin)}</div><div class="l">quedas en</div></div>
        </div>
        <div class="row"><button class="btn" onclick="openResult()">Otro resultado</button><button class="btn btn-solid" style="flex:1.4;" onclick="win()">✓ Gané ${p.pct}%</button></div>`
      : `<p class="card-title">¡Meta cumplida! 🎉</p><p class="muted">Llegaste a ${p.goal} victorias con ${money(c.bal)}. Crea un plan nuevo o súbele la meta.</p>`}
      <div class="progress" style="margin-top:14px;"><span style="width:${pct.toFixed(1)}%"></span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="faint">${pct.toFixed(0)}% del camino${c.lossCount ? ` · ${c.lossCount} pérdida${c.lossCount===1?'':'s'} (−${short(c.lossTotal)})` : ''}</span>
        ${p.events.length ? `<button class="chip" style="padding:5px 10px;font-size:12px;" onclick="undo()">Deshacer</button>` : ''}
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <p class="card-title" style="margin:0;">Crecimiento</p>
        <div class="seg" style="width:150px;"><button class="${chartMode==='log'?'active':''}" onclick="chartMode='log';render()">Por etapas</button><button class="${chartMode==='lin'?'active':''}" onclick="chartMode='lin';render()">Normal</button></div>
      </div>
      ${chart(p, c)}
      ${marks.length ? `<div class="miles" style="margin-top:12px;">${marks.map(v => { const m = mileFor(v); return m ? `<div class="mile ${m.done?'ok':''}">${m.done?'✓ ':''}<b>${short(v).replace('.00','')}</b> en la #${m.n}</div>` : ''; }).join('')}</div>` : ''}
      ${c.offPlan ? `<p class="faint" style="margin:10px 0 0 0;">Con el plan original llegarías a ${money(c.ideal)}; con tus resultados reales vas para ${money(c.finalProj)}.</p>` : ''}
    </div>

    <div class="card" style="padding:12px 12px 6px 12px;">
      <p class="card-title" style="margin:4px 4px 8px 4px;">Tabla</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>Entra</th><th>Resultado</th><th>Queda</th><th style="text-align:center;">Fecha</th></tr></thead>
        <tbody>${allRows.map(r => {
          const cls = r.done ? (r.kind === 'L' ? 'loss' : 'done') : (r === nxt ? 'cur' : 'todo');
          const pos = r.int >= 0;
          const badge = !r.done ? '' : r.kind === 'W' ? '<span class="bdg w">W</span>' : r.kind === 'L' ? '<span class="bdg l">L</span>' : '<span class="bdg a">+</span>';
          return `<tr class="${cls}" ${r === nxt ? 'id="cur-row"' : ''}>
            <td class="n">${r.n != null ? r.n : '·'}</td>
            <td>${cm(r.usd)}</td>
            <td><div class="${r.done ? (pos ? 'g' : 'rd') : ''}">${pos ? '+' : '−'}${cm(Math.abs(r.int))}</div><div class="pc ${r.custom || !pos ? 'cust' : ''}">${pos ? '+' : '−'}${fmtPct(Math.abs(r.pct))}</div></td>
            <td class="fin">${cm(r.fin)}</td>
            <td class="dt">${badge}${r.done ? `<div>${fmtDate(r.d)}</div>` : ''}</td></tr>`; }).join('')}</tbody>
      </table></div>
    </div>
    <p class="faint" style="margin:4px 4px 0 4px;line-height:1.6;">Como tu Excel: cada fila arranca con el USD final de la anterior. Lo que registras con "Otro resultado" usa tu % real; las pérdidas no cuentan como victoria.</p>`;
  const cur = document.getElementById('cur-row');
  if(cur){ const w = cur.closest('.tbl-wrap'); w.scrollTop = Math.max(0, cur.offsetTop - 80); }
}
render();
</script>
</body>
</html>
