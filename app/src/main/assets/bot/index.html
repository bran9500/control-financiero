<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bot Señales</title>
<style>
:root{--bg:#0E1116;--panel:#161A21;--panel2:#1B2029;--line:#262C36;--fg:#E8EBF0;--muted:#8B93A1;--faint:#5C6470;
--gold:#D9B45A;--goldDim:#6B5A2E;--green:#2FC47A;--red:#EF5A5A;--greenBg:rgba(47,196,122,.12);--redBg:rgba(239,90,90,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;letter-spacing:.08em;color:var(--gold);flex:1}
.tf{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700;font-size:13px}
.status{padding:0 16px 8px;color:var(--muted);font-size:12px;min-height:18px}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0;font:600 13px system-ui;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
main{padding:12px 16px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700;text-transform:uppercase}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;font:700 14px system-ui;background:var(--gold);color:#0E1116}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(239,90,90,.4)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.big{font-size:28px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--panel2);border-radius:8px;padding:8px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.imgwrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line);background:#000;position:relative}
.imgwrap canvas{display:block}
.zoom{display:flex;gap:6px;margin:8px 0}
.zoom button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px;font:600 12px system-ui}
.zoom button.on{color:var(--gold);border-color:var(--goldDim)}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.strip i{width:14px;height:20px;border-radius:3px;display:inline-block;position:relative}
.strip i.R{background:var(--red)} .strip i.V{background:var(--green)}
.strip i.f{background:transparent;border:1.5px dashed var(--gold)}
.strip i em{position:absolute;top:21px;left:0;right:0;text-align:center;font-style:normal;font-size:8px;color:var(--faint)}
.strip.lab{row-gap:14px}
.sig{border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid}
.sig.V{background:var(--greenBg);border-color:rgba(47,196,122,.45)}
.sig.R{background:var(--redBg);border-color:rgba(239,90,90,.45)}
.sig.past{opacity:.45}
.sig .top{display:flex;align-items:baseline;gap:8px}
.sig .dir{font-weight:800;font-size:15px}
.sig.V .dir{color:var(--green)} .sig.R .dir{color:var(--red)}
.sig .time{font-weight:800;font-size:15px}
.sig .cd{margin-left:auto;font-size:12px;color:var(--gold);font-weight:700}
.sig .name{font-weight:700;margin-top:3px}
.sig .meta{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;margin:4px 4px 0 0;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--green);border-color:rgba(47,196,122,.4)} .tag.bad{color:var(--red);border-color:rgba(239,90,90,.4)}
select,input[type=number]{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px system-ui}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.tfgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tfgrid button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 0;font:700 13px system-ui}
.tfgrid button.on{background:var(--gold);color:#0E1116;border-color:var(--gold)}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px}
.switch input{width:20px;height:20px;accent-color:var(--gold)}
.fab{position:fixed;left:16px;right:16px;bottom:14px;z-index:10}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.warn{background:rgba(217,180,90,.1);border:1px solid var(--goldDim);color:var(--gold);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
#cal{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#cal .bar{padding:10px 12px;display:flex;gap:8px;background:var(--bg);align-items:center}
#cal .bar .t{flex:1;font-size:12px;color:var(--muted)}
#cal .bar button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:700 13px system-ui}
#cal .bar button.save{background:var(--gold);color:#0E1116;border-color:var(--gold)}
#calStage{flex:1;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
#calImg{max-width:100%;max-height:100%;display:block;user-select:none;-webkit-user-drag:none}
#calBox{position:absolute;border:2px solid var(--gold);background:rgba(217,180,90,.12);display:none;pointer-events:none}
.detail{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.mk{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.mk:first-child{border-top:0}
.mk .ic{font-size:18px;width:26px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>BOT SEÑALES</h1>
  <span class="tf" id="hTf">M1</span>
</header>
<div class="status" id="status"></div>
<nav class="tabs">
  <button data-t="cap" class="on">Captura</button>
  <button data-t="sig">Alertas</button>
  <button data-t="cfg">Estrategias</button>
</nav>
<main id="main"></main>
<div class="fab"><button class="btn" id="fabBtn">Iniciar ventana flotante</button></div>

<div id="cal">
  <div class="bar">
    <div class="t">Arrastra un rectángulo sobre las velas. Deja afuera la escala de precios de la derecha y los botones.</div>
  </div>
  <div id="calStage"><img id="calImg" alt=""><div id="calBox"></div></div>
  <div class="bar">
    <button onclick="closeCal()">Cancelar</button>
    <div class="t" id="calInfo"></div>
    <button class="save" onclick="saveCal()">Guardar zona</button>
  </div>
</div>

<script>
const A = window.Android || null;
let S = null, tab = "cap", zoom = 1, cropImg = null, cropFor = -1, selCandle = -1;
const TFS = [[5,"S5"],[10,"S10"],[15,"S15"],[30,"S30"],[60,"M1"],[120,"M2"],[180,"M3"],[300,"M5"],[600,"M10"],[900,"M15"]];
const PAT = {
  DOJI:["➕","Doji","Cuerpo casi inexistente: indecisión."],
  MARTILLO:["🔨","Martillo","Mecha larga abajo tras una baja: posible giro alcista."],
  HOMBRE_COLGADO:["🔨","Hombre colgado","Forma de martillo tras una subida: posible agotamiento."],
  MARTILLO_INVERTIDO:["🔧","Martillo invertido","Mecha larga arriba tras una baja: posible giro alcista."],
  ESTRELLA_FUGAZ:["🌠","Estrella fugaz","Mecha larga arriba tras una subida: posible giro bajista."],
  ENVOLVENTE_ALCISTA:["🟢","Envolvente alcista","El cuerpo verde cubre todo el rojo anterior."],
  ENVOLVENTE_BAJISTA:["🔴","Envolvente bajista","El cuerpo rojo cubre todo el verde anterior."],
  HARAMI_ALCISTA:["🟩","Harami alcista","Cuerpo verde chico dentro del rojo anterior."],
  HARAMI_BAJISTA:["🟥","Harami bajista","Cuerpo rojo chico dentro del verde anterior."],
  PINZAS_TECHO:["✂️","Pinzas de techo","Dos velas con el mismo máximo: posible resistencia."],
  PINZAS_SUELO:["✂️","Pinzas de suelo","Dos velas con el mismo mínimo: posible soporte."],
  TRES_SOLDADOS_BLANCOS:["🟢","Tres soldados blancos","3 verdes seguidas, cada una más arriba."],
  TRES_CUERVOS_NEGROS:["🔴","Tres cuervos negros","3 rojas seguidas, cada una más abajo."],
  ESTRELLA_MANANA:["🌅","Estrella de la mañana","Roja grande, indecisión, verde grande: giro alcista."],
  ESTRELLA_NOCHE:["🌆","Estrella de la noche","Verde grande, indecisión, roja grande: giro bajista."]
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function hms(ms,withSec){const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())+(withSec?":"+pad(d.getSeconds()):"")}
function cd(ms){const s=Math.max(0,Math.round(ms/1000));return s>=60?Math.floor(s/60)+":"+pad(s%60):s+"s"}
function tfLabel(sec){const f=TFS.find(t=>t[0]===sec);return f?f[1]:sec+"s"}

function load(){
  if(!A){S=demoState();return}
  try{S=JSON.parse(A.getState())}catch(e){}
}
function render(){
  load(); if(!S) return;
  document.getElementById("hTf").textContent=S.tfLabel;
  document.getElementById("status").textContent=S.status||"";
  const fb=document.getElementById("fabBtn");
  fb.textContent=S.overlay?"Ir al gráfico (ventana activa)":"Iniciar ventana flotante";
  fb.className="btn"+(S.overlay?" ghost":"");
  const m=document.getElementById("main");
  const scrollY=window.scrollY;
  if(tab==="cap") m.innerHTML=capView();
  else if(tab==="sig") m.innerHTML=sigView();
  else m.innerHTML=cfgView();
  if(tab==="cap") drawCrop();
  window.scrollTo(0,scrollY);
}
let autoCalDone=false;
window.onNative=function(){render(); if(S&&S.needsCalibration&&!autoCalDone&&A&&A.getImage("full")){autoCalDone=true;openCal()} if(S&&!S.needsCalibration) autoCalDone=false;};
window.onNativeBack=function(){
  if(document.getElementById("cal").style.display==="flex"){closeCal();return true}
  if(tab!=="cap"){setTab("cap");return true}
  return false;
};
function setTab(t){tab=t;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0);render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.getElementById("fabBtn").onclick=()=>{ if(!A) return; if(S&&S.overlay) A.goToTrading(); else A.toggleOverlay(); };

function hasRegion(){return S && (S.regionP||S.regionL)}

// ---------------- Captura ----------------
function capView(){
  const L=S.last;
  let h="";
  if(!hasRegion()||S.needsCalibration){
    h+=`<div class="warn"><b>Falta calibrar la zona de las velas.</b><br>1) Inicia la ventana flotante. 2) Ve a Pocket Option y presiona <b>LEER</b>: la app vuelve aquí con la captura. 3) Marca el rectángulo de las velas.</div>`;
    h+=`<button class="btn ghost" onclick="openCal()" style="margin-bottom:12px">Calibrar con la última captura</button>`;
  }
  if(!L){
    h+=`<div class="card"><h3>Sin lectura todavía</h3><div class="note">Abre la ventana flotante, ve al gráfico y presiona <b>LEER</b>. Aquí vas a ver la imagen que se captó, cada vela marcada con su color y el conteo, para comprobar que está leyendo bien.</div></div>`;
    return h;
  }
  const c=L.candles||[], closed=Math.max(0,c.length-1);
  h+=`<div class="card"><div class="row"><div class="grow"><div class="big">${closed}</div><div class="small muted">velas cerradas leídas + 1 en formación</div></div>
     <div style="text-align:right"><div class="small muted">captura</div><b>${hms(L.captureMs,true)}</b></div></div>
     <div class="stats">
       <div class="stat"><b>${(L.alerts||[]).length}</b><span>alertas</span></div>
       <div class="stat"><b>${c.slice(0,-1).filter(k=>k[7]).length}</b><span>martillos/cruces</span></div>
       <div class="stat"><b>${L.lateral?"lateral":"tendencia"}</b><span>mercado</span></div>
     </div>
     ${L.error?`<div class="warn" style="margin:10px 0 0">${esc(L.error)}</div>`:""}
  </div>`;
  h+=`<div class="card"><h3>Lo que vio la cámara</h3>
     <div class="zoom">${[1,2,3,4].map(z=>`<button class="${zoom===z?"on":""}" onclick="setZoom(${z})">${z}×</button>`).join("")}</div>
     <div class="imgwrap" id="imgwrap"><canvas id="cv"></canvas></div>
     <div class="detail" id="detail">${selCandle>=0?candleDetail(selCandle):"Toca una vela para ver su detalle. M = martillo normal, m = martillo con mecha, ✚ = cruz. La punteada dorada es la vela en formación."}</div>
  </div>`;
  const vis=c.map((x,i)=>({col:x[0],i}));
  h+=`<div class="card"><h3>Velas leídas (de la más vieja a la más nueva)</h3>
     <div class="strip lab">${vis.map((v,k)=>`<i class="${k===vis.length-1?"f":v.col}">${(k+1)%5===0||k===vis.length-1?`<em>${k===vis.length-1?"▲":k+1}</em>`:""}</i>`).join("")}</div>
     <div class="note" style="margin-top:14px">Compara con el gráfico: misma cantidad y mismo orden de colores. Si no coincide, recalibra la zona en Estrategias.</div>
  </div>`;
  return h;
}
function candleDetail(i){
  const c=S.last.candles[i]; if(!c) return "";
  const [col,x0,x1,tt,tb,bt,bb,sh]=c; const n=S.last.candles.length;
  const tot=tb-tt, body=bb-bt;
  return `<b style="color:${col==="R"?"var(--red)":"var(--green)"}">${i===n-1?"Vela en formación":"Vela #"+(i+1)} · ${col==="R"?"ROJA":"VERDE"}</b> · ancho ${x1-x0}px · cuerpo ${body}px · mecha arriba ${bt-tt}px · abajo ${tb-bb}px${sh?" · <b style=\"color:var(--gold)\">"+shapeName(sh)+"</b>":""}`;
}
function shapeName(sh){return sh==="X"?"Cruz":sh.startsWith("MN")?"Martillo normal (mecha "+(sh.endsWith("L")?"abajo":"arriba")+")":"Martillo con mecha (grande "+(sh.endsWith("L")?"abajo":"arriba")+")"}
function setZoom(z){zoom=z;render()}
function drawCrop(){
  const cv=document.getElementById("cv"); if(!cv||!S.last||!S.last.crop) return;
  const L=S.last;
  if(cropFor!==L.captureMs){
    cropFor=L.captureMs; cropImg=null;
    const src=A?A.getImage("crop"):"";
    if(src){const im=new Image();im.onload=()=>{cropImg=im;drawCrop()};im.src=src}
  }
  const wrap=document.getElementById("imgwrap");
  const W=L.crop.w,H=L.crop.h;
  const dispW=(wrap.clientWidth||320)*zoom, scale=dispW/W, dispH=Math.min(H*scale, 420*Math.max(1,zoom/1.5));
  const sy=dispH/H;
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(dispW*dpr); cv.height=Math.round(dispH*dpr);
  cv.style.width=dispW+"px"; cv.style.height=dispH+"px";
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#000"; g.fillRect(0,0,dispW,dispH);
  if(cropImg) g.drawImage(cropImg,0,0,dispW,dispH);
  const c=L.candles||[];
  c.forEach((k,i)=>{
    const [col,x0,x1,tt,tb]=k;
    const x=x0*scale,w=Math.max(2,(x1-x0)*scale),y=tt*sy-3,h=(tb-tt)*sy+6;
    const last=i===c.length-1;
    g.lineWidth=i===selCandle?2.5:1.2;
    g.setLineDash(last?[4,3]:[]);
    g.strokeStyle=last?"#D9B45A":(col==="R"?"#FF8A8A":"#7CF0B0");
    g.strokeRect(x-1,y,w+2,h);
    if(k[7]&&!last){g.setLineDash([]);g.fillStyle="#D9B45A";g.font="bold 9px system-ui";g.textAlign="center";g.fillText(k[7]==="X"?"✚":k[7].startsWith("MN")?"M":"m",x+w/2,Math.max(9,y-3));}
    if(!last&&((i+1)%5===0||zoom>=3)){
      g.setLineDash([]);g.fillStyle="#D9B45A";g.font="bold 10px system-ui";g.textAlign="center";
      g.fillText(String(i+1),x+w/2,Math.min(dispH-3,tb*sy+16));
    }
  });
  cv.onclick=(e)=>{
    const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)/scale;
    let best=-1,bd=1e9; c.forEach((k,i)=>{const m=(k[1]+k[2])/2,d=Math.abs(m-px);if(d<bd){bd=d;best=i}});
    selCandle=best; document.getElementById("detail").innerHTML=candleDetail(best); drawCrop();
  };
}

// ---------------- Señales ----------------
function kindText(a,withSec){
  const t=hms(a.entryMs,withSec);
  if(a.kind===0) return `<span class="dir">${a.dir==="V"?"▲ BUY":"▼ SELL"}</span><span class="time">${t}</span>`;
  if(a.kind===3) return `<span class="time" style="color:var(--muted)">Si la vela actual cierra ${a.ifColor==="V"?"🟩 verde":"🟥 roja"}</span>`;
  return `<span class="dir" style="color:var(--gold)">⚡ ${t}</span><span class="time" style="font-size:13px">mira cómo nace</span>`;
}
function verdictHTML(v,now,tfMs,withSec,compact){
  const t=hms(v.entryMs,withSec),late=now>v.entryMs+Math.max(4000,tfMs/6),left=v.entryMs-now;
  const when=late?"pasó":left>0?"en "+cd(left):"¡AHORA!";
  const sq=c=>c==="V"?"🟩 verde":"🟥 roja";
  const names=(v.names||[]).map(esc).join(" + ");
  let cls="",style="",head="",lines=[];
  if(v.type===0){cls=v.dir;head=`<span class="dir">${v.dir==="V"?"▲ BUY":"▼ SELL"}</span><span class="time">${t}</span>`;
    if(v.need) lines.push(`Solo si la vela <b>nace ${sq(v.need)}</b>${v.need===v.dir?"":" (va al revés del nacimiento)"}.`);
    if(v.risk) lines.push(`<span style="color:var(--gold)">⚠ Si la vela actual cierra ${sq(v.risk)}, se contradice: no entres.</span>`);}
  else if(v.type===1){style="border-color:var(--goldDim);background:rgba(217,180,90,.1)";head=`<span class="dir" style="color:var(--gold)">⛔ NO ENTRAR</span><span class="time">${t}</span>`;lines.push(esc(v.reason))}
  else if(v.type===4){head=`<span class="time" style="color:var(--muted);font-size:13px">¿cierra ${v.ifColor==="V"?"🟩":"🟥"}? → <span style="color:${v.dir==="V"?"var(--green)":"var(--red)"}">${v.dir==="V"?"▲ BUY":"▼ SELL"} ${t}</span></span>`;lines.push("Aviso: depende de cómo cierre la vela actual.")}
  else{style="border-color:var(--goldDim)";head=`<span class="dir" style="color:var(--gold)">⚡ ${t}</span><span class="time" style="font-size:13px">mira cómo nace</span>`;
    lines.push(v.type===2?`nace <b style="color:var(--green)">verde → SELL</b> · <b style="color:var(--red)">roja → BUY</b>`:`nace <b style="color:var(--green)">verde → BUY</b> · <b style="color:var(--red)">roja → SELL</b>`);
    if(v.ifColor) lines.push(`<span style="color:var(--gold)">Además, si la vela actual cierra ${sq(v.ifColor)}, otra estrategia dice ${v.dir==="V"?"BUY":"SELL"}.</span>`);}
  return `<div class="sig ${cls}${late?" past":""}" style="${style}"><div class="top">${head}<span class="cd" data-entry="${v.entryMs}">${when}</span></div>
    <div class="name">${names}</div>${lines.map(l=>`<div class="meta">${l}</div>`).join("")}${compact||v.type===1||v.type===4?"":`<div class="meta">Si no da: siguiente vela ${hms(v.mgMs,withSec)}</div>`}</div>`;
}
function sigView(){
  const L=S.last;
  if(!L) return `<div class="card"><div class="note">Todavía no hay lectura. Presiona LEER en la ventana flotante (o activa AUTO).</div></div>`;
  const now=S.now, al=L.alerts||[], withSec=S.tf<60;
  let h=`<div class="note" style="margin-bottom:10px">Arriba, una respuesta por vela (junta todas las estrategias). Abajo, el detalle de cada estrategia de los libros de Miguel Miranda que se está armando (lectura de las ${hms(L.captureMs,true)}). No hay porcentajes: solo la regla de cada estrategia.</div>`;
  if(!al.length) h+=`<div class="card"><div class="note">Ninguna estrategia armada en las últimas velas.</div></div>`;
  (L.verdicts||[]).forEach(v=>{h+=verdictHTML(v,now,L.tfMs,withSec,false)});
  if(al.length) h+=`<h3 class="muted small" style="margin:18px 0 8px;letter-spacing:.06em">DETALLE POR ESTRATEGIA</h3>`;
  al.forEach(a=>{
    const late=now>a.entryMs+Math.max(4000,L.tfMs/6), left=a.entryMs-now;
    const cls=a.kind===0?a.dir:"";
    let extra="";
    if(a.kind===1) extra=`Si nace <b style="color:var(--green)">verde → SELL</b> · si nace <b style="color:var(--red)">roja → BUY</b>`;
    if(a.kind===2) extra=`Si nace <b style="color:var(--green)">verde → BUY</b> · si nace <b style="color:var(--red)">roja → SELL</b>`;
    if(a.kind===3) extra=`→ entonces <b style="color:${a.dir==="V"?"var(--green)":"var(--red)"}">${a.dir==="V"?"▲ BUY":"▼ SELL"} ${hms(a.entryMs,withSec)}</b>`;
    h+=`<div class="sig ${cls}${late?" past":""}" style="${cls?"":"background:var(--panel);border-color:var(--line)"}">
      <div class="top">${kindText(a,withSec)}<span class="cd">${late?"pasó":left>0?"en "+cd(left):"¡AHORA!"}</span></div>
      <div class="name">${esc(a.name)}</div>
      ${extra?`<div class="meta">${extra}</div>`:""}
      <div class="meta">${esc(a.why)}</div>
      ${a.kind!==3?`<div class="meta">Si no da: siguiente vela ${hms(a.mgMs,withSec)}</div>`:""}
    </div>`;
  });
  return h;
}

function cfgView(){
  return `<div class="card"><h3>Temporalidad del gráfico</h3>
    <div class="tfgrid">${TFS.map(t=>`<button class="${S.tf===t[0]?"on":""}" onclick="A&&A.setTimeframe(${t[0]})">${t[1]}</button>`).join("")}</div>
    <div class="note" style="margin-top:8px">Tiene que ser la misma que tienes en Pocket Option.</div></div>
  <div class="card"><h3>Lectura automática</h3>
    <label class="switch"><input type="checkbox" ${S.auto?"checked":""} onchange="A&&A.setAuto(this.checked)"> AUTO: leer sola al empezar cada vela</label>
    <div class="note" style="margin-top:8px">Con AUTO la ventana parpadea un instante en cada vela (se esconde para tomar la foto) y vibra cuando aparece una estrategia.</div>
    <label class="f">Ajuste de reloj (segundos, si las velas de Pocket no cambian justo en el :00)</label>
    <input type="number" id="oClk" min="-30" max="30" value="${S.clockOffset}" onchange="A&&A.setClockOffset(parseInt(this.value||'0'))">
  </div>
  <div class="card"><h3>Estrategias activas</h3>
    ${(S.strategies||[]).map(st=>`<label class="mk" style="cursor:pointer"><input type="checkbox" style="width:20px;height:20px;accent-color:var(--gold);margin-top:2px" ${st.on?"checked":""} onchange="A&&A.setEnabled('${st.key}',this.checked)"><div><b>${esc(st.name)}</b><div class="note">${esc(st.desc)}</div></div></label>`).join("")}
    <div class="note" style="margin-top:8px">"Zona institucional" (precios con dos o tres ceros) no está: necesita leer los números de la escala de precios.</div>
  </div>
  <div class="card"><h3>Zona de las velas</h3>
    <div class="note">Vertical: ${S.regionP?"calibrada ✓":"sin calibrar"} · Horizontal: ${S.regionL?"calibrada ✓":"sin calibrar"}</div>
    <button class="btn ghost" style="margin-top:10px" onclick="openCal()">Recalibrar con la última captura</button>
  </div>
  <div class="note" style="margin-top:14px">Las alertas son apoyo para decidir, no garantía. Las decisiones y el dinero son tuyos.</div>`;
}

// ---------------- Calibración ----------------
let calRect=null, calStart=null;
function openCal(){
  const src=A?A.getImage("full"):"";
  if(!src){alertBox("Todavía no hay captura. Inicia la ventana flotante, ve al gráfico y presiona LEER VELAS.");return}
  const im=document.getElementById("calImg"); im.src=src;
  document.getElementById("cal").style.display="flex";
  const reg=S.fullOrient==="l"?S.regionL:S.regionP;
  calRect=reg?{l:reg[0],t:reg[1],r:reg[2],b:reg[3]}:null;
  im.onload=drawCalBox; drawCalBox();
}
function closeCal(){document.getElementById("cal").style.display="none"}
function imgBox(){const im=document.getElementById("calImg"),st=document.getElementById("calStage");const a=im.getBoundingClientRect(),s=st.getBoundingClientRect();return {x:a.left-s.left,y:a.top-s.top,w:a.width,h:a.height,ax:a.left,ay:a.top}}
function drawCalBox(){
  const bx=document.getElementById("calBox"),info=document.getElementById("calInfo");
  if(!calRect){bx.style.display="none";info.textContent="";return}
  const b=imgBox();
  bx.style.display="block";
  bx.style.left=(b.x+calRect.l*b.w)+"px"; bx.style.top=(b.y+calRect.t*b.h)+"px";
  bx.style.width=((calRect.r-calRect.l)*b.w)+"px"; bx.style.height=((calRect.b-calRect.t)*b.h)+"px";
  info.textContent=Math.round((calRect.r-calRect.l)*100)+"% × "+Math.round((calRect.b-calRect.t)*100)+"%";
}
(function(){
  const st=document.getElementById("calStage");
  const pt=e=>{const b=imgBox();return {x:Math.min(1,Math.max(0,(e.clientX-b.ax)/b.w)),y:Math.min(1,Math.max(0,(e.clientY-b.ay)/b.h))}};
  st.addEventListener("pointerdown",e=>{st.setPointerCapture(e.pointerId);calStart=pt(e);calRect={l:calStart.x,t:calStart.y,r:calStart.x,b:calStart.y};drawCalBox()});
  st.addEventListener("pointermove",e=>{if(!calStart)return;const p=pt(e);calRect={l:Math.min(calStart.x,p.x),t:Math.min(calStart.y,p.y),r:Math.max(calStart.x,p.x),b:Math.max(calStart.y,p.y)};drawCalBox()});
  st.addEventListener("pointerup",()=>{calStart=null});
})();
function saveCal(){
  if(!calRect||calRect.r-calRect.l<0.05||calRect.b-calRect.t<0.05){alertBox("Marca un rectángulo más grande sobre las velas.");return}
  if(A) A.setRegion(S.fullOrient||"p",calRect.l,calRect.t,calRect.r,calRect.b);
  closeCal(); setTab("cap");
}
function alertBox(msg){document.getElementById("status").textContent=msg}

// demo sin Android (para ver la página en un navegador)
function demoState(){return {tf:60,tfLabel:"M1",auto:false,strategies:[],clockOffset:0,overlay:false,status:"Vista de prueba",regionP:null,regionL:null,fullOrient:"p",now:Date.now(),last:null}}

render();
setInterval(()=>{ if(tab==="sig"||tab==="cap") { if(tab==="sig") render(); else { load(); document.getElementById("status").textContent=S.status||""; if(S.last&&S.last.captureMs!==cropFor) render(); } } else load(); }, 1000);
</script>
