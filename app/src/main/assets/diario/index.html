<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading</title>
<style>
  :root{
    --bg:#12161C; --surface:#1B2129; --surface-raised:#232A35; --line:#2A313B;
    --ink:#E8E6E0; --ink-dim:#8B93A0; --ink-faint:#5B6472; --good:#6FA98A; --warn:#C4693B;
    --win:#2FC47A; --loss:#EF5A5A; --gold:#D9B45A;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;max-width:100%;}
  .card,details.fold{min-width:0;max-width:100%;overflow:hidden;}
  html,body{background:var(--bg);margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 96px 14px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px 2px;gap:10px;}
  .page-title{font-family:var(--serif);font-size:26px;margin:0;}
  .sub{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0 0;}
  .icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .card-title{font-family:var(--serif);font-size:17px;margin:0 0 10px 0;}
  .muted{font-size:13px;color:var(--ink-dim);line-height:1.55;margin:0;}
  .faint{font-size:12px;color:var(--ink-faint);}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .pos{color:var(--win);} .neg{color:var(--loss);}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-width:0;}
  .stat .n{font-family:var(--mono);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat .t{font-size:11px;color:var(--ink-faint);margin-top:3px;}
  .progress{height:8px;border-radius:4px;background:var(--surface-raised);overflow:hidden;margin:10px 0 6px 0;}
  .progress span{display:block;height:100%;background:var(--good);border-radius:4px;}
  .btn{background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);padding:12px 16px;border-radius:12px;font-size:15px;cursor:pointer;font-family:var(--sans);}
  .btn-solid{background:var(--good);border-color:var(--good);color:#0E1A14;font-weight:600;}
  .btn-block{width:100%;display:block;text-align:center;}
  .btn-win{background:#163D2A;border-color:var(--win);color:#BFF5D8;font-weight:700;font-size:18px;padding:18px 10px;}
  .btn-loss{background:#3D1717;border-color:var(--loss);color:#FFD0D0;font-weight:700;font-size:18px;padding:18px 10px;}
  .link{background:none;border:none;color:var(--ink-dim);font-size:13px;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:var(--sans);}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line);}
  .kv:first-child{border-top:none;}
  .kv span{color:var(--ink-dim);}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
  .chip{white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:var(--sans);}
  .chip.active{border-color:var(--good);color:var(--ink);}
  label.f{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
  input[type=number], input[type=text], textarea{width:100%;background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:15px;font-family:var(--sans);margin-top:5px;}
  textarea{min-height:70px;resize:vertical;}
  .seg{display:flex;background:var(--surface-raised);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:6px 0 10px 0;}
  .seg button{flex:1;background:none;border:none;color:var(--ink-dim);padding:9px 6px;border-radius:9px;font-size:13px;font-family:var(--sans);cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);}
  /* escalera */
  .ladder{display:grid;grid-template-columns:repeat(var(--n,9),1fr);gap:5px;margin:4px 0 2px 0;}
  .rung{aspect-ratio:1/1.15;border-radius:10px;border:1px solid var(--line);background:var(--surface-raised);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--ink-faint);cursor:pointer;padding:0;}
  .rung b{font-size:15px;line-height:1;}
  .rung small{font-size:9px;margin-top:3px;}
  .rung.won{background:#143323;border-color:var(--win);color:#BFF5D8;}
  .rung.lost{background:#3A1616;border-color:var(--loss);color:#FFC9C9;}
  .rung.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(217,180,90,.25);}
  .next-op{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 10px 0;}
  .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);}
  .tag.mg{border-color:var(--gold);color:var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:right;}
  th{font-weight:500;color:var(--ink-faint);font-size:11px;border-top:none;}
  td:first-child,th:first-child{text-align:left;}
  .day{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .day:first-of-type{border-top:none;}
  .day .d{font-size:14px;}
  .day .m{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;z-index:5;}
  .tabbar button{flex:1;background:none;border:none;color:var(--ink-faint);font-size:12px;padding:8px 2px;border-radius:10px;font-family:var(--sans);cursor:pointer;}
  .tabbar button.on{color:var(--ink);background:var(--surface-raised);}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 14px 28px 14px;}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:20;max-width:90%;text-align:center;}
  details.fold{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;}
  details.fold > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  details.fold > summary::-webkit-details-marker{display:none;}
  details.fold > summary .t{font-family:var(--serif);font-size:16px;}
  details.fold > summary .arr{color:var(--ink-faint);transition:transform .15s;}
  details.fold[open] > summary .arr{transform:rotate(90deg);}
  details.fold > .in{padding:0 16px 14px 16px;}
  .insight{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;}
  .insight:first-child{border-top:none;}
  .insight i{font-style:normal;flex-shrink:0;}
  svg text{font-family:var(--sans);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabs"></nav>
<div id="sheet"></div>
<script src="../theme.js"></script>
<script>
const NA = !!(window.Android && Android.goHome);
const KEY = 'diario-data';
const DEF = { capital: 0, goal: 9, risk: 6, steps: 9, mgLevels: 1, mult: 2, payout: 92, mode: 'target', minStake: 1, src: NA ? 'rotador' : 'manual' };
let D = load();
let tab = 'hoy', sheet = null, statMonth = null, stakeDraft = null;

function load(){
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(o) return { cfg: Object.assign({}, DEF, o.cfg || {}), days: o.days || {} };
  }catch(e){}
  return { cfg: Object.assign({}, DEF), days: {} };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast('No se pudo guardar en el teléfono'); } }

// ---------- utilidades ----------
const r2 = v => Math.round(v * 100) / 100;
const money = v => (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const smoney = v => (v > 0.004 ? '+' : '') + money(v);
const pct = (v, d = 1) => (isFinite(v) ? v.toFixed(d) : '0') + '%';
const cls = v => v > 0.004 ? 'pos' : v < -0.004 ? 'neg' : '';
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const today = () => iso(new Date());
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function niceDate(s, long){ const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('es-ES', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric', month: 'short' }); }
function monthName(k){ const [y, m] = k.split('-'); return MESES[+m - 1].replace(/^./, c => c.toUpperCase()) + ' ' + y; }
function esc(s){ return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function num(v){ const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; }

// ---------- reglas de cada día ----------
// Riesgo por escalón = capital × riesgo% / escalones. Ese riesgo se reparte entre la entrada y las martingalas:
// con 1 martingala ×2 se divide en 3 → entrada = 1 parte, martingala = 2 partes.
function plan(d){
  const parts = Array.from({ length: d.mgLevels + 1 }, (_, k) => Math.pow(d.mult, k));
  const div = parts.reduce((a, b) => a + b, 0);
  const budget = d.capital * d.risk / 100 / d.steps;
  const min = d.minStake == null ? 1 : d.minStake;
  const entry = Math.max(min, r2(budget / div));
  // Cada martingala sale del monto anterior × multiplicador, nunca menos del mínimo del broker.
  const stakes = [entry];
  for(let k = 1; k < parts.length; k++) stakes.push(Math.max(min, r2(stakes[k - 1] * d.mult)));
  return {
    budget, div, entry, min, raised: budget / div < min - 0.004,
    stakes, realBudget: stakes.reduce((a, b) => a + b, 0),
    target: d.capital * d.goal / 100 / d.steps,       // ganancia que vale cada escalón
    goal$: d.capital * d.goal / 100,
    risk$: d.capital * d.risk / 100,
    mode: d.mode
  };
}

/** Repasa las operaciones del día y saca el estado de cada escalón. */
// Con el Rotador: cada operación suma o resta; al juntar lo que vale el escalón se marca ✓ y se empieza de cero.
// Si se pierde el riesgo del escalón, se marca ✕ y también se empieza de cero. Se puede seguir pasando de los 9.
function calcRot(d){
  const P = plan(d);
  const mk = i => ({ i, ops: [], profit: 0, status: 'pending', mg: 0, mgWins: 0, burns: 0, extra: i >= d.steps });
  const steps = [mk(0)];
  let cur = steps[0], acc = 0;
  const all = [];
  (d.rops || []).forEach(r => {
    if(r.cut) return;
    const o = { step: cur.i, lvl: r.s || 0, stake: r.stake || 0, win: !!r.win, v: +r.v || 0, lot: r.lot == null ? 0 : r.lot, burn: !!r.burn, auto: !!r.auto, t: r.ts };
    all.push(o);
    cur.ops.push(o); cur.profit += o.v;
    if(o.lvl > 0){ cur.mg++; if(o.win) cur.mgWins++; }
    if(o.burn) cur.burns++;
    acc += o.v;
    if(acc >= P.target - 0.005){ cur.status = 'won'; acc = 0; cur = mk(steps.length); steps.push(cur); }
    else if(acc <= -P.budget + 0.005){ cur.status = 'lost'; acc = 0; cur = mk(steps.length); steps.push(cur); }
    else cur.status = 'active';
  });
  while(steps.length < d.steps) steps.push(mk(steps.length));
  if(steps.length > d.steps && !steps[steps.length - 1].ops.length) steps.pop();
  const ci = steps.findIndex(s => s.status === 'pending' || s.status === 'active');
  return tail(d, P, steps, all, ci < 0 ? steps.length : ci, 0, 0);
}

function calc(d){
  if(d.src === 'rotador') return calcRot(d);
  const P = plan(d);
  const steps = Array.from({ length: d.steps }, (_, i) => ({ i, ops: [], profit: 0, status: 'pending', mg: 0, mgWins: 0 }));
  d.ops.forEach(op => {
    const s = steps[op.step]; if(!s) return;
    s.ops.push(op);
    s.profit += op.win ? op.stake * d.payout / 100 : -op.stake;
    if(op.lvl > 0){ s.mg++; if(op.win) s.mgWins++; }
  });
  steps.forEach(s => {
    if(!s.ops.length) return;
    s.status = 'active';
    let acc = 0;
    for(const op of s.ops){
      acc += op.win ? op.stake * d.payout / 100 : -op.stake;
      if(op.win && (d.mode === 'one' || acc >= P.target - 0.005)){ s.status = 'won'; break; }
      if(!op.win && op.lvl >= d.mgLevels){ s.status = 'lost'; break; }
    }
  });
  Object.keys(d.closed || {}).forEach(i => { if(steps[i]) steps[i].status = d.closed[i]; });
  const cur = steps.findIndex(s => s.status === 'pending' || s.status === 'active');
  let lvl = 0, nextStake = 0;
  if(cur >= 0){
    const last = steps[cur].ops[steps[cur].ops.length - 1];
    if(last && !last.win && last.lvl < d.mgLevels) lvl = last.lvl + 1;
    // La martingala se calcula sobre lo que de verdad metiste en la operación anterior.
    nextStake = lvl > 0 ? Math.max(P.min, r2(last.stake * d.mult)) : P.stakes[0];
  }
  d.ops.forEach(o => { o.v = o.win ? o.stake * d.payout / 100 : -o.stake; });
  return tail(d, P, steps, d.ops, cur, lvl, nextStake);
}
function tail(d, P, steps, all, cur, lvl, nextStake){
  const profit = steps.reduce((a, s) => a + s.profit, 0);
  const ops = all.length, wins = all.filter(o => o.win).length;
  const entryOps = all.filter(o => o.lvl === 0), mgOps = all.filter(o => o.lvl > 0);
  const won = steps.filter(s => s.status === 'won'), lost = steps.filter(s => s.status === 'lost');
  const rot = d.src === 'rotador';
  const curIdx = rot && cur >= d.steps && !(steps[cur] && steps[cur].ops.length) ? -1 : (cur >= steps.length ? -1 : cur);
  return {
    P, steps, cur: curIdx, lvl, nextStake, all, rot, burns: all.filter(o => o.burn).length,
    profit, pctCap: d.capital ? profit / d.capital * 100 : 0, pctGoal: P.goal$ ? profit / P.goal$ * 100 : 0,
    ops, wins, entryOps: entryOps.length, entryWins: entryOps.filter(o => o.win).length,
    mgOps: mgOps.length, mgWins: mgOps.filter(o => o.win).length,
    won: won.length, lost: lost.length, done: rot ? won.length + lost.length >= d.steps : cur < 0,
    opsPerWon: won.length ? won.reduce((a, s) => a + s.ops.length, 0) / won.length : 0,
    first: steps[0]
  };
}

// ---------- acciones ----------
function lastDay(){ const k = Object.keys(D.days).filter(x => x < today()).sort().pop(); return k ? D.days[k] : null; }
function suggestedCapital(){
  const l = lastDay();
  if(l){ const c = calc(l); return r2(l.capital + c.profit); }
  return D.cfg.capital || 0;
}
function panelState(){ try{ return window.Android && Android.panelState ? JSON.parse(Android.panelState()) : null; }catch(e){ return null; } }
function panelHtml(){
  const S = panelState(); if(!S) return '';
  const lots = (S.lots || []).map((l, i) => `<span class="tag ${i === S.turn ? 'mg' : ''}" style="${l.dead ? 'border-color:var(--loss);color:var(--loss);' : ''}">L${i + 1} ${l.dead ? '✕' : 'P' + (l.step + 1)}</span>`).join(' ');
  const dead = (S.lots || []).some(l => l.dead);
  return `<div class="card" style="border-color:${S.running ? 'var(--win)' : 'var(--line)'};">
    <div class="next-op"><div><p class="faint" style="margin:0;">Siguiente operación</p>
      <p class="num" style="font-size:30px;margin:2px 0 0 0;">${S.turn < 0 ? '—' : money(S.stake)}</p></div>
      <div style="text-align:right;"><p class="faint" style="margin:0;">${S.turn < 0 ? 'Lotes quemados' : 'Lote ' + (S.turn + 1)}</p><p class="num ${cls(S.net)}" style="margin:4px 0 0 0;">${smoney(S.net)}</p></div></div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 12px 0;">${lots}</div>
    ${dead ? `<button class="link" onclick="Android.reviveAll()">Revivir lotes quemados</button>` : ''}
    <button class="btn btn-block ${S.running ? '' : 'btn-solid'}" style="padding:15px;font-size:16px;${S.running ? 'border-color:var(--loss);color:var(--loss);' : ''}" onclick="Android.togglePanel()">${S.running ? '■ Cerrar la ventanita' : '▶ Empezar a operar'}</button>
  </div>`;
}
// Tarjeta siempre visible con capital, meta y riesgo, editables aquí mismo.
function planCardHtml(d){
  const src = d || Object.assign({}, D.cfg, { capital: D.cfg.capital || 0 });
  const P = plan(src);
  return `<div class="card">
    <div class="next-op"><p class="card-title" style="margin:0;">Capital, meta y riesgo</p><button class="link" onclick="diarioTab('ajustes')">Más ajustes ⚙</button></div>
    <div class="grid3" style="margin:8px 0 0 0;">
      <label class="f" style="margin:0;">Capital $<input type="text" inputmode="decimal" value="${src.capital || ''}" placeholder="2000" onchange="quickSet('capital', this.value)"></label>
      <label class="f" style="margin:0;">Meta %<input type="number" inputmode="decimal" step="0.5" value="${src.goal}" onchange="quickSet('goal', this.value)"></label>
      <label class="f" style="margin:0;">Riesgo %<input type="number" inputmode="decimal" step="0.5" value="${src.risk}" onchange="quickSet('risk', this.value)"></label>
    </div>
    <p class="faint" style="margin:8px 0 0 0;">Meta ${money(P.goal$)} · riesgo ${money(P.risk$)} · cada escalón vale ${money(P.target)}</p>
  </div>`;
}
function quickSet(k, v){
  const n = num(v); if(!(n > 0)) return;
  if(k === 'capital'){ const d = D.days[today()]; if(d) setTodayCapital(n); D.cfg.capital = n; save(); pushPlan(); }
  else setCfg(k, n);
  render(); toast('Guardado');
}

// ---------- sesiones (guardar, restaurar, borrar) ----------
function curSession(){ try{ return JSON.parse(Android.currentSession()); }catch(e){ return null; } }
function savedSessions(){ try{ return JSON.parse(Android.sessions() || '[]'); }catch(e){ return []; } }
let armed = { k: '', t: 0 };
function sure(key, msg){ if(armed.k === key && Date.now() - armed.t < 4000){ armed = { k: '', t: 0 }; return true; } armed = { k: key, t: Date.now() }; toast(msg || 'Toca otra vez para confirmar'); return false; }
function hhmm(ms){ return ms ? new Date(ms).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '—'; }
function sessionCardHtml(){
  if(!(window.Android && Android.currentSession)) return '';
  const c = curSession() || {}, n = savedSessions().length;
  return `<div class="card">
    <div class="next-op"><p class="card-title" style="margin:0;">Sesión</p><span class="faint">${c.ops || 0} op. · <span class="num ${cls(c.net || 0)}">${smoney(c.net || 0)}</span></span></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" onclick="saveSession()">💾 Guardar y empezar otra</button>
      <button class="btn" onclick="openSessions()">📂 Guardadas (${n})</button>
    </div>
    <button class="link" style="margin-top:4px;" onclick="discardSession()">Borrar esta sesión y empezar de cero</button>
  </div>`;
}
function saveSession(){
  const c = curSession() || {};
  if(!c.ops){ toast('Esta sesión no tiene operaciones todavía'); return; }
  Android.newSession(); toast('Sesión guardada. Empiezas una nueva'); setTimeout(() => { syncRot(); render(); }, 250);
}
function discardSession(){
  if(!sure('discard', 'Toca otra vez para BORRAR la sesión actual (no se guarda)')) return;
  Android.discardSession(); toast('Sesión borrada'); setTimeout(() => { syncRot(); render(); }, 250);
}
function openSessions(){ sheet = { type: 'sessions' }; renderSheet(); }
function restoreSession(i){
  if(!sure('restore' + i, 'Toca otra vez para restaurarla (la actual se guarda primero)')) return;
  Android.restoreSession(i); sheet = null; renderSheet(); toast('Sesión restaurada'); setTimeout(() => { syncRot(); render(); }, 300);
}
function deleteSaved(i){
  if(!sure('del' + i, 'Toca otra vez para borrar esa sesión guardada')) return;
  Android.deleteSession(i); setTimeout(() => { syncRot(); if(sheet) renderSheet(); render(); }, 250);
}
function resetToday(){

}

function startDay(open){
  const cap = num(document.getElementById('cap').value);
  if(!(cap > 0)){ toast('Escribe tu capital de hoy'); return; }
  const c = D.cfg;
  D.days[today()] = { capital: cap, goal: c.goal, risk: c.risk, steps: c.steps, mgLevels: c.mgLevels, mult: c.mult, payout: c.payout, mode: c.mode, src: c.src || 'manual', ops: [], closed: {}, note: '', started: Date.now() };
  if(!D.cfg.capital) D.cfg.capital = cap;
  syncRot(); save(); pushPlan(); render();
  if(open && window.Android && Android.togglePanel){ const S = panelState(); if(S && !S.running) Android.togglePanel(); }
}
function addOp(win){
  const d = D.days[today()]; if(!d) return;
  const c = calc(d); if(c.cur < 0) return;
  const el = document.getElementById('stake');
  const stake = r2(el ? num(el.value) : c.nextStake);
  if(!(stake > 0)){ toast('Escribe el monto de la operación'); return; }
  const min = d.minStake == null ? 1 : d.minStake;
  if(stake < min - 0.004){ toast('La operación mínima es ' + money(min)); return; }
  d.ops.push({ step: c.cur, lvl: c.lvl, stake, win, t: Date.now() });
  stakeDraft = null;
  save();
  const after = calc(d), s = after.steps[c.cur];
  if(s.status === 'won') toast('✓ Escalón ' + (c.cur + 1) + ' logrado' + (after.done ? ' · día terminado' : ''));
  else if(s.status === 'lost') toast('✕ Escalón ' + (c.cur + 1) + ' perdido. Sigue con el ' + (c.cur + 2 <= d.steps ? c.cur + 2 : '—'));
  else if(!win) toast('Toca martingala: ' + money(after.nextStake));
  render();
}
function undo(){
  const d = D.days[today()]; if(!d || !d.ops.length) return;
  const op = d.ops.pop();
  if(d.closed) delete d.closed[op.step];
  save(); render(); toast('Se quitó la última operación');
}
function closeStep(status){
  const d = D.days[today()]; if(!d) return;
  const c = calc(d); if(c.cur < 0) return;
  d.closed = d.closed || {}; d.closed[c.cur] = status;
  save(); render();
}
function reopenStep(day, i){
  const d = D.days[day]; if(!d || !d.closed) return;
  delete d.closed[i]; save(); sheet = null; render();
}
function setNote(day, v){ const d = D.days[day]; if(d){ d.note = v; save(); } }
function deleteDay(day){
  if(sheet && sheet.confirm !== day){ sheet.confirm = day; renderSheet(); return; }
  delete D.days[day]; save(); sheet = null; render(); toast('Día borrado');
}

// ---------- vistas ----------
function d0(c){ return Math.min(9, c.steps.length); }
function ladderHtml(c, day){
  // Máximo 9 por fila; si hay muchos escalones extra, se muestran los últimos y un contador.
  const MAXC = 27;
  const all = c.steps, hidden = Math.max(0, all.length - MAXC);
  const shown = hidden ? all.slice(0, d0(c)).concat(all.slice(all.length - (MAXC - d0(c)))) : all;
  const more = hidden ? `<p class="faint" style="margin:4px 0 0 0;">… y ${hidden} escalones más (✓ ${c.won} · ✕ ${c.lost} en total)</p>` : '';
  return `<div class="ladder" style="--n:${Math.min(9, Math.max(1, all.length))}">${shown.map(s => {
    const k = s.status === 'won' ? 'won' : s.status === 'lost' ? 'lost' : s.i === c.cur ? 'cur' : '';
    const ic = s.status === 'won' ? '✓' : s.status === 'lost' ? '✕' : s.i === c.cur ? '•' : '';
    return `<button class="rung ${k}" onclick="openStep('${day}',${s.i})"><b>${s.i + 1}</b><small>${ic || '&nbsp;'}</small></button>`;
  }).join('')}</div>${more}`;
}

function summaryHtml(d, c){
  const bar = Math.max(0, Math.min(100, c.pctGoal));
  return `
  <div class="grid3">
    <div class="stat"><div class="n ${cls(c.profit)}">${smoney(c.profit)}</div><div class="t">Profit · ${pct(c.pctCap, 2)}</div></div>
    <div class="stat"><div class="n"><span class="pos">${c.won}</span> / <span class="neg">${c.lost}</span></div><div class="t">Escalones ✓ / ✕ de ${d.steps}</div></div>
    <div class="stat"><div class="n">${pct(c.pctGoal, 0)}</div><div class="t">De la meta (${d.goal}%)</div></div>
  </div>
  <div class="progress"><span style="width:${bar}%;${c.pctGoal >= 100 ? '' : c.profit < 0 ? 'background:var(--loss);width:' + Math.min(100, -c.profit / c.P.risk$ * 100) + '%' : ''}"></span></div>
  <p class="faint" style="margin:0 0 4px 0;">${c.profit >= 0 ? 'Meta del día ' + money(c.P.goal$) + (c.pctGoal >= 100 ? ' · ¡lograda!' : ' · faltan ' + money(Math.max(0, c.P.goal$ - c.profit))) : 'Riesgo usado ' + money(-c.profit) + ' de ' + money(c.P.risk$)}</p>`;
}

    h += `<div class="card">

  } else {

      <p class="card-title">Día terminado</p>

function planHtml(P){
  return `<div class="kv"><span>Meta del día</span><b class="num">${money(P.goal$)}</b></div>
    <div class="kv"><span>Riesgo máximo</span><b class="num">${money(P.risk$)}</b></div>
    <div class="kv"><span>Riesgo por escalón</span><b class="num">${money(P.budget)} <span class="faint">(÷${P.div.toFixed(P.div % 1 ? 1 : 0)})</span></b></div>
    <div class="kv"><span>Entrada${P.stakes.length > 1 ? ' → martingala' : ''}</span><b class="num" style="text-align:right;">${P.stakes.map(money).join(' → ')}</b></div>
    ${P.raised ? `<p class="faint" style="color:var(--gold);margin:6px 0;">La entrada daba ${money(P.budget / P.div)}, menos del mínimo de ${money(P.min)}, así que se sube a ${money(P.min)}. Si pierdes el escalón completo pierdes ${money(P.realBudget)}, no ${money(P.budget)}. Para que cuadre, sube el riesgo % o usa menos martingalas.</p>` : ''}
    ${(P.mode || D.cfg.mode) === 'target' ? `<div class="kv"><span>Cada escalón vale</span><b class="num">${money(P.target)}</b></div>` : ''}`;
}
function previewPlan(v){
  const el = document.getElementById('pv'); if(!el) return;
  el.innerHTML = planHtml(plan(Object.assign({}, D.cfg, { capital: num(v) })));
}

function dayDetailHtml(day, d, c){
  const rows = c.all.map((o, i) => `<tr><td>${o.step + 1}</td><td>${c.rot && o.lot < 0 ? '<span class="tag">Fuera del plan</span>' : c.rot ? 'L' + (o.lot + 1) + ' ' + (o.lvl ? '<span class="tag mg">P' + (o.lvl + 1) + '</span>' : 'P1') : (o.lvl ? '<span class="tag mg">MG' + (d.mgLevels > 1 ? o.lvl : '') + '</span>' : 'Entrada')}${o.burn ? ' 🔥' : ''}</td>
    <td class="num">${money(o.stake)}</td><td>${o.win ? '<span class="pos">✓</span>' : '<span class="neg">✕</span>'}</td>
    <td class="num ${o.win ? 'pos' : 'neg'}">${smoney(o.v)}</td></tr>`).reverse().join('');
  const f = c.first;
  return `<details class="fold" data-k="num-${day}"><summary><span class="t">Números del día</span><span class="arr">▸</span></summary><div class="in">
    <div class="kv"><span>Operaciones</span><b class="num">${c.ops} · ${c.wins} ganadas (${pct(c.ops ? c.wins / c.ops * 100 : 0, 0)})</b></div>
    <div class="kv"><span>Martingalas usadas</span><b class="num">${c.mgOps}${c.mgOps ? ' · ganó ' + c.mgWins : ''}</b></div>
    <div class="kv"><span>Primer escalón</span><b>${f.status === 'won' ? '<span class="pos">Logrado</span> en ' + f.ops.length + ' op.' : f.status === 'lost' ? '<span class="neg">Perdido</span>' : 'Sin terminar'}</b></div>
    <div class="kv"><span>Operaciones por escalón logrado</span><b class="num">${c.won ? c.opsPerWon.toFixed(1) : '—'}</b></div>
    <div class="kv"><span>Capital</span><b class="num">${money(d.capital)} → ${money(d.capital + c.profit)}</b></div>
    ${c.rot ? `<div class="kv"><span>Lotes quemados</span><b class="num">${c.burns}</b></div>
    <div class="kv"><span>Reglas</span><b class="faint">${d.goal}% meta · ${d.risk}% riesgo · ${d.steps} escalones · operado con el Rotador</b></div>`
    : `<div class="kv"><span>Reglas</span><b class="faint">${d.goal}% meta · ${d.risk}% riesgo · ${d.steps} escalones · ${d.mgLevels ? d.mgLevels + ' MG ×' + d.mult : 'sin MG'} · ${d.payout}%</b></div>`}
  </div></details>
  ${c.all.length ? `<details class="fold" data-k="ops-${day}"><summary><span class="t">Operaciones (${c.all.length})</span><span class="arr">▸</span></summary><div class="in">
    <table><tr><th>Esc.</th><th>Tipo</th><th>Monto</th><th></th><th>Resultado</th></tr>${rows}</table></div></details>` : ''}
  <details class="fold" data-k="note-${day}" ${d.note ? 'open' : ''}><summary><span class="t">Nota del día</span><span class="arr">▸</span></summary><div class="in">
    <textarea placeholder="Cómo te sentiste, qué par, qué salió bien o mal…" oninput="setNote('${day}', this.value)">${esc(d.note)}</textarea></div></details>`;
}

function openStep(day, i){ sheet = { type: 'step', day, i }; renderSheet(); }
function openDay(day){ sheet = { type: 'day', day }; renderSheet(); }

    h = `<p class="card-title">Escalón ${sheet.i + 1} · ${st}</p>
      <div class="kv"><span>Operaciones</span><b class="num">${s.ops.length}</b></div>
      <div class="kv"><span>Martingala</span><b>${s.mg ? 'Sí (' + s.mg + ')' : 'No'}</b></div>

      ${s.ops.length ? `<table style="margin-top:8px;"><tr><th>#</th><th>Tipo</th><th>Monto</th><th></th></tr>${s.ops.map((o, k) => `<tr><td>${k + 1}</td><td>${o.lvl ? 'Martingala' : 'Entrada'}</td><td class="num">${money(o.stake)}</td><td>${o.win ? '<span class="pos">✓</span>' : '<span class="neg">✕</span>'}</td></tr>`).join('')}</table>` : ''}
      ${d.closed && d.closed[sheet.i] ? `<button class="link" onclick="reopenStep('${sheet.day}',${sheet.i})">Quitar "dar por ${d.closed[sheet.i] === 'won' ? 'logrado' : 'perdido'}"</button>` : ''}`;
  } else {
    h = `<div class="topbar" style="margin-top:0;"><p class="card-title" style="margin:0;">${niceDate(sheet.day, true)}</p></div>

  }
  setTimeout(() => restoreFolds(el), 0);
  el.innerHTML = `<div class="sheet-bg" onclick="if(event.target===this){sheet=null;renderSheet();}"><div class="sheet">${h}
    <button class="btn btn-block" style="margin-top:12px;" onclick="sheet=null;renderSheet();render()">Cerrar</button></div></div>`;
}

function renderHistorial(){
  const keys = Object.keys(D.days).sort().reverse();
  let h = `<div class="topbar"><div><p class="page-title">Historial</p><p class="sub">Tus sesiones y tus días</p></div></div>`;
  if(window.Android && Android.sessions){
    const n = savedSessions().length;
    h += `<details class="fold" data-k="ses" open><summary><span class="t">Sesiones guardadas (${n})</span><span class="arr">▸</span></summary><div class="in">${sessionsListHtml()}</div></details>`;
  }
  if(!keys.length) return h + `<div class="card"><p class="muted">Todavía no hay días. Empieza uno en <b>Hoy</b>.</p></div>`;
  const curM = today().slice(0, 7);

  const byMonth = {};
  keys.forEach(k => (byMonth[k.slice(0, 7)] = byMonth[k.slice(0, 7)] || []).push(k));
  Object.keys(byMonth).forEach(m => {
    const tot = byMonth[m].reduce((a, k) => a + calc(D.days[k]).profit, 0);
    h += `<details class="fold" data-k="m-${m}" ${m === curM ? 'open' : ''}><summary><span class="t">${monthName(m)} · ${byMonth[m].length} día${byMonth[m].length === 1 ? '' : 's'}</span><span><b class="num ${cls(tot)}">${smoney(tot)}</b> <span class="arr">▸</span></span></summary><div class="in">
      ${byMonth[m].map(k => {
        const d = D.days[k], c = calc(d);
        return `<div class="day" onclick="openDay('${k}')"><div><div class="d">${niceDate(k)}</div>
          <div class="m">✓ ${c.won} · ✕ ${c.lost} de ${d.steps} · ${c.ops} op. · win ${pct(c.ops ? c.wins / c.ops * 100 : 0, 0)}${c.mgOps ? ' · ' + c.mgOps + ' MG' : ''}</div></div>
          <div style="text-align:right;"><div class="num ${cls(c.profit)}">${smoney(c.profit)}</div><div class="m">${pct(c.pctGoal, 0)} meta</div></div></div>`;
      }).join('')}</div></details>`;
  });
  return h;
}

function monthStats(m){
  const keys = Object.keys(D.days).filter(k => k.startsWith(m)).sort();
  const days = keys.map(k => ({ k, d: D.days[k], c: calc(D.days[k]) })).filter(x => x.c.ops > 0);
  const S = { days, n: days.length, profit: 0, ops: 0, wins: 0, entryOps: 0, entryWins: 0, mgOps: 0, mgWins: 0, won: 0, lost: 0, steps: 0,
    goalDays: 0, greenDays: 0, firstWon: 0, firstDone: 0, opsWon: 0, stepsWithMg: 0, stepsWithMgWon: 0, startCap: 0 };
  days.forEach(({ d, c }, i) => {
    if(i === 0) S.startCap = d.capital;
    S.profit += c.profit; S.ops += c.ops; S.wins += c.wins;
    S.entryOps += c.entryOps; S.entryWins += c.entryWins; S.mgOps += c.mgOps; S.mgWins += c.mgWins;
    S.won += c.won; S.lost += c.lost; S.steps += d.steps;
    if(c.pctGoal >= 100) S.goalDays++;
    if(c.profit > 0.004) S.greenDays++;
    if(c.first.status === 'won' || c.first.status === 'lost'){ S.firstDone++; if(c.first.status === 'won') S.firstWon++; }
    c.steps.forEach(s => {
      if(s.status === 'won') S.opsWon += s.ops.length;
      if(s.mg){ S.stepsWithMg++; if(s.status === 'won') S.stepsWithMgWon++; }
    });
  });
  S.best = days.slice().sort((a, b) => b.c.profit - a.c.profit)[0];
  S.worst = days.slice().sort((a, b) => a.c.profit - b.c.profit)[0];
  return S;
}

function chartHtml(S){
  if(S.days.length < 1) return '';
  const W = 520, H = 170, pad = 26, n = S.days.length;
  const vals = S.days.map(x => x.c.profit);
  let cum = 0; const cums = vals.map(v => (cum += v));
  const max = Math.max(0.01, ...vals.map(Math.abs), ...cums.map(Math.abs));
  const y0 = H / 2, sc = (H / 2 - 14) / max, bw = Math.max(4, Math.min(28, (W - pad * 2) / n - 4));
  const x = i => pad + (i + 0.5) * (W - pad * 2) / n;
  const bars = vals.map((v, i) => `<rect x="${x(i) - bw / 2}" y="${v >= 0 ? y0 - v * sc : y0}" width="${bw}" height="${Math.max(1, Math.abs(v) * sc)}" rx="2" fill="${v >= 0 ? 'var(--win)' : 'var(--loss)'}" opacity=".85"/>`).join('');
  const line = cums.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + (y0 - v * sc).toFixed(1)).join(' ');
  const labels = S.days.map((d, i) => (n <= 12 || i % Math.ceil(n / 10) === 0) ? `<text x="${x(i)}" y="${H - 2}" font-size="10" fill="var(--ink-faint)" text-anchor="middle">${+d.k.slice(8)}</text>` : '').join('');
  return `<div class="card"><p class="card-title">Profit por día</p>
    <svg viewBox="0 0 ${W} ${H + 8}" style="width:100%;height:auto;display:block;">
      <line x1="${pad}" x2="${W - pad}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>
      ${bars}<path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2"/>${labels}
    </svg>
    <p class="faint" style="margin:6px 0 0 0;">Barras: profit de cada día · Línea dorada: acumulado del mes</p></div>`;
}

function renderStats(noHead){

  h += `<div class="grid3">
      <div class="stat"><div class="n ${cls(S.profit)}">${smoney(S.profit)}</div><div class="t">Profit del mes${S.startCap ? ' · ' + pct(S.profit / S.startCap * 100) : ''}</div></div>
      <div class="stat"><div class="n">${pct(wr, 0)}</div><div class="t">Win rate (${S.ops} op.)</div></div>
      <div class="stat"><div class="n">${S.won}<span class="faint">/${S.won + S.lost}</span></div><div class="t">Escalones logrados</div></div>
    </div>

      <div class="stat"><div class="n">${S.n}</div><div class="t">Días operados</div></div>

      <div class="kv"><span>Win rate en entrada</span><b class="num">${pct(S.entryOps ? S.entryWins / S.entryOps * 100 : 0, 0)} <span class="faint">(${S.entryWins}/${S.entryOps})</span></b></div>
      <div class="kv"><span>Win rate en martingala</span><b class="num">${S.mgOps ? pct(S.mgWins / S.mgOps * 100, 0) + ' <span class="faint">(' + S.mgWins + '/' + S.mgOps + ')</span>' : '—'}</b></div>
      <div class="kv"><span>Escalones donde usaste martingala</span><b class="num">${(S.won + S.lost) ? pct(S.stepsWithMg / (S.won + S.lost) * 100, 0) : '—'}</b></div>
      <div class="kv"><span>Primer escalón logrado</span><b class="num">${S.firstWon} de ${S.firstDone} días</b></div>
      <div class="kv"><span>Operaciones por escalón logrado</span><b class="num">${S.won ? (S.opsWon / S.won).toFixed(1) : '—'}</b></div>

      ${S.worst && S.worst.c.profit < 0 ? `<div class="kv"><span>Peor día</span><b class="num neg">${smoney(S.worst.c.profit)} <span class="faint">${niceDate(S.worst.k)}</span></b></div>` : ''}

    ${rotBreakdownHtml(S)}

  return h;
}

// Con el Rotador: cómo te va en cada paso de martingala y cuánto deja cada lote.
function rotBreakdownHtml(S){
  const lv = {}, lots = {};
  let any = false;
  S.days.forEach(({ c }) => { if(!c.rot) return; c.all.forEach(o => {
    any = true;
    const L = lv[o.lvl] = lv[o.lvl] || { n: 0, w: 0, v: 0 }; L.n++; if(o.win) L.w++; L.v += o.v;
    const k = o.lot < 0 ? 'fuera' : o.lot;
    const T = lots[k] = lots[k] || { n: 0, w: 0, v: 0, burn: 0 }; T.n++; if(o.win) T.w++; T.v += o.v; if(o.burn) T.burn++;
  }); });
  if(!any) return '';
  const lvRows = Object.keys(lv).sort((a, b) => a - b).map(k => { const L = lv[k];
    return `<tr><td>P${+k + 1}${+k ? ' <span class="faint">(MG)</span>' : ''}</td><td class="num">${L.n}</td><td class="num">${pct(L.w / L.n * 100, 0)}</td><td class="num ${cls(L.v)}">${smoney(L.v)}</td></tr>`; }).join('');
  const lotRows = Object.keys(lots).sort((a, b) => (a === 'fuera') - (b === 'fuera') || a - b).map(k => { const T = lots[k];
    return `<tr><td>${k === 'fuera' ? 'Fuera del plan' : 'Lote ' + (+k + 1)}</td><td class="num">${T.n}</td><td class="num">${pct(T.w / T.n * 100, 0)}</td><td class="num">${T.burn || '—'}</td><td class="num ${cls(T.v)}">${smoney(T.v)}</td></tr>`; }).join('');
  return `<div class="card"><p class="card-title">Por paso de martingala</p>
      <table><tr><th>Paso</th><th>Op.</th><th>Ganó</th><th>Resultado</th></tr>${lvRows}</table>
      <p class="faint" style="margin:8px 0 0 0;">P1 es la entrada; P2, P3… son las martingalas. Si un paso gana poco, ahí se te va la plata.</p></div>
    <div class="card"><p class="card-title">Por lote</p>
      <table><tr><th>Lote</th><th>Op.</th><th>Ganó</th><th>Quem.</th><th>Resultado</th></tr>${lotRows}</table></div>`;
}

function insightsHtml(S, wr){
  const out = [];
  const ew = S.entryOps ? S.entryWins / S.entryOps * 100 : 0, mw = S.mgOps ? S.mgWins / S.mgOps * 100 : 0;
  if(S.mgOps >= 5 && mw < 45) out.push(['⚠', `La martingala solo te sale el ${pct(mw, 0)} de las veces. Cuando pierdes la entrada, el siguiente movimiento suele ir en tu contra: vale la pena revisar si conviene seguir con ella.`]);
  if(S.mgOps >= 5 && mw >= 55) out.push(['✓', `La martingala te salva el ${pct(mw, 0)} de las veces: está cumpliendo su función.`]);
  if(S.firstDone >= 3 && S.firstWon / S.firstDone < 0.5) out.push(['⚠', `Pierdes el primer escalón más de la mitad de los días. Prueba esperar unos minutos y leer el mercado antes de la primera entrada.`]);
  if(S.n >= 3 && S.greenDays / S.n >= 0.6) out.push(['✓', `Cerraste en verde ${S.greenDays} de ${S.n} días: aunque no siempre llegues al 9%, el sistema de escalones te mantiene en profit.`]);
  if(S.ops >= 20 && wr < 52) out.push(['⚠', `Tu win rate del mes es ${pct(wr, 0)}. Con payout de ${D.cfg.payout}%, necesitas más o menos ${pct(100 / (1 + D.cfg.payout / 100), 0)} para no perder plata a la larga.`]);
  if(S.ops >= 20 && ew - mw > 15 && S.mgOps >= 5) out.push(['•', `Ganas bastante más en la entrada (${pct(ew, 0)}) que en la martingala (${pct(mw, 0)}).`]);
  if(!out.length) return '';
  return `<div class="card"><p class="card-title">Lo que dicen tus números</p>${out.map(([i, t]) => `<div class="insight"><i>${i}</i><span>${t}</span></div>`).join('')}</div>`;
}

function getRot(){ try{ return window.Android && Android.getRotCfg ? JSON.parse(Android.getRotCfg()) : null; }catch(e){ return null; } }
function setRot(k, v){
  const R = getRot(); if(!R) return;
  if(k === 'mode' || k === 'currency') R[k] = v;
  else {
    let n = num(v);
    if(k === 'nLots') n = Math.max(1, Math.min(20, Math.round(n) || 1));
    if(k === 'steps') n = Math.max(1, Math.min(8, Math.round(n) || 1));
    if(k === 'payout'){ n = Math.max(1, Math.min(100, n || 92)); D.cfg.payout = n; syncToday('payout', n); save(); }
    if(k === 'base'){ if(!(n > 0)) return; }
    R[k] = n;
  }
  try{ Android.setRotCfg(JSON.stringify(R)); }catch(e){}
  setTimeout(() => { const el = document.getElementById('rotseq'); if(el) el.innerHTML = rotSeqHtml(getRot()); }, 200);
  if(k === 'mode' || k === 'currency') setTimeout(render, 220);
}

// Los ajustes valen para hoy también (las operaciones ya anotadas quedan con el monto que tuvieron).
function syncToday(k, n){
  const d = D.days[today()]; if(!d) return;
  if(k === 'capital') return;            // el capital de hoy se cambia aparte
  if(k === 'steps'){ const used = d.ops.reduce((m, o) => Math.max(m, o.step + 1), 0); n = Math.max(n, used); }
  d[k] = n;
}
function setCfg(k, v){
  if(k === 'mode' || k === 'src'){
    D.cfg[k] = v; syncToday(k, v);
    if(k === 'src') syncRot();
    save(); pushPlan(); render(); return;
  }
  let n = num(v);
  if(k === 'steps') n = Math.max(1, Math.min(20, Math.round(n) || 1));
  if(k === 'mgLevels') n = Math.max(0, Math.min(4, Math.round(n)));
  if(k === 'mult') n = Math.max(1, n || 2);
  if(k === 'minStake') n = Math.max(0, n);
  D.cfg[k] = n; syncToday(k, n); save(); pushPlan();
  refreshPlan();
}
function setTodayCapital(v){
  const d = D.days[today()]; const n = num(v);
  if(!d || !(n > 0)) return;
  d.capital = n; save(); pushPlan(); refreshPlan();
}
function refreshPlan(){
  const el = document.getElementById('pv2'); if(!el) return;
  const d = D.days[today()];
  el.innerHTML = planHtml(plan(d || Object.assign({}, D.cfg, { capital: D.cfg.capital || 0 })));
  const t = document.getElementById('pv2t'); if(t) t.textContent = 'Así queda hoy con ' + money(d ? d.capital : (D.cfg.capital || 0));
}

function useRotToday(){
  const d = D.days[today()]; if(!d) return;
  d.src = 'rotador'; D.cfg.src = 'rotador';
  syncRot(); save(); pushPlan(); render();
  toast('Listo: hoy cuenta lo del Rotador');
}
function dayRange(k){ const a = new Date(k + 'T00:00:00').getTime(); return [a, a + 86400000 - 1]; }
function fetchRot(k){
  if(!(window.Android && Android.getRotadorOps)) return null;
  try{ const [a, b] = dayRange(k); return JSON.parse(Android.getRotadorOps(a, b) || '[]'); }catch(e){ return null; }
}
/** Copia las operaciones del Rotador a cada día (así quedan guardadas aunque borres sesiones en el Rotador). */
function syncRot(){
  let changed = false;
  const t = today();
  // Si hoy operaste con el Rotador y no habías empezado el día, se empieza solo con tu capital.
  if(!D.days[t] && D.cfg.src === 'rotador'){
    const ops = fetchRot(t);
    const cap = suggestedCapital();
    if(ops && ops.length && cap > 0){
      const c = D.cfg;
      D.days[t] = { capital: cap, goal: c.goal, risk: c.risk, steps: c.steps, mgLevels: c.mgLevels, mult: c.mult, payout: c.payout, mode: c.mode, src: 'rotador', ops: [], closed: {}, note: '', started: Date.now(), rops: ops };
      changed = true;
    }
  }
  const td = D.days[t];
  if(td && td.src !== 'rotador' && D.cfg.src === 'rotador' && !(td.ops || []).length){
    const ops = fetchRot(t);
    if(ops && ops.length){ td.src = 'rotador'; changed = true; }
  }
  Object.keys(D.days).forEach(k => {
    const d = D.days[k]; if(d.src !== 'rotador') return;
    const ops = fetchRot(k); if(!ops) return;
    if(ops.length || k === t){
      const before = JSON.stringify(d.rops || []), after = JSON.stringify(ops);
      if(before !== after && (ops.length >= (d.rops || []).length || k === t)){ d.rops = ops; changed = true; }
    }
  });
  if(changed) save();
  return changed;
}
/** Le pasa a la ventanita del Rotador lo que vale el escalón de hoy. */
function pushPlan(){
  if(!(window.Android && Android.setPlan)) return;
  const d = D.days[today()] || Object.assign({}, D.cfg, { capital: D.cfg.capital || 0 });
  const P = plan(d);
  try{ Android.setPlan(JSON.stringify({ date: today(), target: r2(P.target), riskStep: r2(P.budget), steps: d.steps, src: d.src || D.cfg.src })); }catch(e){}
  try{ if(Android.setRotPlan && d.capital > 0) Android.setRotPlan(JSON.stringify({ cap: d.capital, risk: d.risk, goal: d.goal })); }catch(e){}
}
let lastPanel = '';
window.diarioResume = function(){
  const ps = window.Android && Android.panelState ? Android.panelState() : '';
  const changed = syncRot() || ps !== lastPanel;
  lastPanel = ps;
  if(changed && !sheet && tab === 'hoy' && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
};
setInterval(() => { if(!document.hidden) window.diarioResume(); }, 2500);

window.diarioBack = function(){
  if(sheet){ sheet = null; renderSheet(); return true; }
  if(tab !== 'hoy'){ tab = 'hoy'; render(); return true; }
  return false;
};
window.diarioTab = function(t){ if(!['hoy','hist','stats','ajustes'].includes(t)) t = 'hoy'; tab = t; sheet = null; renderSheet(); render(); scrollTo(0, 0); };
if(location.hash === '#ajustes') tab = 'ajustes';
syncRot(); pushPlan();
render();
</script>
