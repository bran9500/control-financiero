<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control semanal</title>
<style>
  :root{
    --bg:#12161C;
    --surface:#1B2129;
    --surface-raised:#212832;
    --line:#2A313B;
    --ink:#E8E6E0;
    --ink-dim:#8B93A0;
    --ink-faint:#5B6472;
    --good:#6FA98A;
    --warn:#C4693B;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding:0 0 60px 0;
  }
  .wrap{max-width:520px;margin:0 auto;padding:28px 18px;}

  .greeting{
    font-family:var(--serif);
    font-size:17px;
    color:var(--ink);
    margin:0 0 2px 0;
  }
  .today{
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink-dim);
    margin:0 0 4px 0;
    text-transform:capitalize;
  }
  h1{
    font-family:var(--serif);
    font-size:26px;
    font-weight:normal;
    margin:0 0 22px 0;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
  }

  .hero{
    padding:22px 0 26px 0;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .hero-label{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 6px 0;
  }
  .hero-number{
    font-family:var(--mono);
    font-size:44px;
    font-variant-numeric:tabular-nums;
    margin:0;
    line-height:1.1;
  }
  .hero-number.good{color:var(--good);}
  .hero-number.warn{color:var(--warn);}
  .hero-sub{
    font-size:13px;
    color:var(--ink-faint);
    margin-top:8px;
  }

  .stat-row{
    display:flex;
    gap:0;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .stat{
    flex:1;
    padding:14px 14px 18px 0;
  }
  .stat + .stat{
    border-left:1px solid var(--line);
    padding-left:14px;
  }
  .stat-label{font-size:12.5px;color:var(--ink-dim);margin:0 0 6px 0;}
  .stat-value{
    font-family:var(--mono);
    font-size:20px;
    font-variant-numeric:tabular-nums;
    margin:0;
  }

  section{margin-bottom:8px;}
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:14px 0 10px 0;
    cursor:pointer;
    user-select:none;
  }
  .section-title{
    font-family:var(--serif);
    font-size:18px;
    margin:0;
  }
  .section-count{
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .chevron{
    color:var(--ink-faint);
    font-size:13px;
    transition:transform .15s ease;
  }
  .chevron.open{transform:rotate(90deg);}

  .section-body{display:none;padding-bottom:14px;}
  .section-body.open{display:block;}

  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-top:1px solid var(--line);
    gap:10px;
  }
  .item-main{flex:1;min-width:0;}
  .item-main.clickable{cursor:pointer;}
  .item-name{font-size:14.5px;color:var(--ink);}
  .item-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .item-amounts{text-align:right;flex-shrink:0;}
  .item-amount{
    font-family:var(--mono);
    font-size:15px;
    font-variant-numeric:tabular-nums;
  }
  .item-weekly{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .item-del{
    background:none;border:none;color:var(--ink-faint);
    font-size:18px;cursor:pointer;padding:0 0 0 8px;line-height:1;
  }
  .item-del:hover{color:var(--warn);}

  .badge{
    display:inline-block;
    font-size:11px;
    padding:2px 7px;
    border-radius:10px;
    border:1px solid var(--line);
    color:var(--ink-faint);
    margin-top:3px;
    cursor:pointer;
  }
  .badge.returned{border-color:var(--good);color:var(--good);}

  .month-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0 4px 0;
    margin-top:4px;
    border-top:1px solid var(--line);
    font-family:var(--serif);
    font-size:13.5px;
    color:var(--ink-dim);
    text-transform:capitalize;
    cursor:pointer;
    user-select:none;
  }
  .month-header .amt{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-faint);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .month-header .chevron{font-size:11px;}

  .add-toggle-btn{
    width:100%;
    text-align:center;
    border-top:1px solid var(--line);
    border-left:none;border-right:none;border-bottom:none;
    border-radius:0;
    padding:14px 0 4px 0;
    background:none;
    color:var(--good);
    font-size:14px;
  }

  .tab-row{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{
    flex:1;
    text-align:center;
    padding:9px 8px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--surface-raised);
    color:var(--ink-dim);
    font-size:13px;
    cursor:pointer;
  }
  .tab-btn.active{border-color:var(--good);color:var(--good);}

  .del-confirm{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .item-del-yes, .item-del-no{
    font-size:12px;
    padding:6px 9px;
    border-radius:4px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--surface-raised);
    color:var(--ink);
    white-space:nowrap;
  }
  .item-del-yes{border-color:var(--warn);color:var(--warn);}
  .item-del-no{color:var(--ink-dim);}

  .empty-note{
    font-size:13px;color:var(--ink-faint);
    padding:12px 0;border-top:1px solid var(--line);
  }

  .add-form{
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .field-row{display:flex;gap:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;}
  label{font-size:11.5px;color:var(--ink-dim);}
  input, select{
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:4px;
    padding:9px 10px;
    font-size:14px;
    font-family:var(--sans);
    width:100%;
  }
  input::placeholder{color:var(--ink-faint);}
  input:focus, select:focus{outline:1px solid var(--ink-dim);}

  .btn{
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:10px 14px;
    border-radius:4px;
    font-size:14px;
    cursor:pointer;
    align-self:flex-start;
  }
  .btn:active{background:var(--line);}
  .btn-primary{border-color:var(--good);color:var(--good);}

  .upcoming{
    margin-top:26px;
    padding-top:6px;
  }

  .weeks-ahead{
    margin-bottom:22px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .week-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .week-row.current{color:var(--ink);}
  .week-row .amt{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
  }
  .week-row.current .amt{color:var(--warn);}
  .week-row.total{
    font-family:var(--serif);
    font-size:14.5px;
    margin-top:4px;
  }
  .week-row.total .amt{color:var(--ink);}
  .upcoming-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .upcoming-row .days{
    color:var(--ink-faint);
    font-size:12px;
    margin-left:8px;
  }
  .upcoming-row .amt{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
  }
  .soon .amt{color:var(--warn);}

  .footnote{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:26px;
    line-height:1.6;
  }

  .save-status{
    font-size:12px;
    min-height:16px;
    margin:-4px 0 14px 0;
    color:var(--ink-faint);
  }
  .save-status.error{color:var(--warn);}
  .save-status.ok{color:var(--good);}

  .balance-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .balance-row label{
    font-size:13px;
    color:var(--ink-dim);
    flex:1;
  }
  .balance-row input{
    width:110px;
    text-align:right;
    font-family:var(--mono);
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--good);
    border-radius:4px;
    padding:8px 10px;
    font-size:15px;
  }

  .backup-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .backup-btn{
    flex:1 1 auto;
    min-width:100px;
    font-size:12.5px;
    padding:9px 8px;
    text-align:center;
  }

  .load-fail{
    border:1px solid var(--warn);
    border-radius:6px;
    padding:18px;
    margin-top:10px;
  }
  .load-fail-title{
    font-family:var(--serif);
    font-size:17px;
    margin:0 0 10px 0;
    color:var(--ink);
  }
  .load-fail-body{
    font-size:13.5px;
    color:var(--ink-dim);
    line-height:1.6;
    margin:0 0 16px 0;
  }
  #restore-textarea{
    width:100%;
    min-height:110px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:4px;
    padding:10px;
    font-size:12px;
    font-family:var(--mono);
    resize:vertical;
    margin-bottom:4px;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const STORAGE_KEY = 'ledger-data';
function emptyData(){
  return {
    debts: [], expenses: [], incomes: [], hormiga: [], loans: [],
    settings: { hormigaLimit: 50, currentBalance: 0 },
    savings: { emergency: { movements: [] }, investments: { movements: [], rate: 0 } },
    history: { paidDebts: [] }
  };
}
function normalizeData(parsed){
  parsed = parsed || {};
  return {
    debts: parsed.debts || [],
    expenses: parsed.expenses || [],
    incomes: parsed.incomes || [],
    hormiga: parsed.hormiga || [],
    loans: parsed.loans || [],
    settings: {
      hormigaLimit: (parsed.settings && parsed.settings.hormigaLimit) || 50,
      currentBalance: (parsed.settings && parsed.settings.currentBalance) || 0
    },
    savings: {
      emergency: { movements: (parsed.savings && parsed.savings.emergency && parsed.savings.emergency.movements) || [] },
      investments: {
        movements: (parsed.savings && parsed.savings.investments && parsed.savings.investments.movements) || [],
        rate: (parsed.savings && parsed.savings.investments && parsed.savings.investments.rate) || 0
      }
    },
    history: { paidDebts: (parsed.history && parsed.history.paidDebts) || [] }
  };
}

let data = emptyData();
let sectionsOpen = { income:true, debts:false, expenses:false, hormiga:false, loans:false, savings:false, stats:false, range:false, history:false };
let savingsTab = 'emergency';
let editingItem = null; // {kind, id}
let loaded = false;
let monthsOpen = {}; // { sectionKey: { monthKey: bool } }
let formOpen = {}; // { kind: bool } — formularios de "añadir" colapsados detrás de un botón +

function isMonthOpen(section, key, defaultOpen){
  if(!monthsOpen[section]) monthsOpen[section] = {};
  if(!(key in monthsOpen[section])) monthsOpen[section][key] = defaultOpen;
  return monthsOpen[section][key];
}
function toggleMonth(section, key){
  if(!monthsOpen[section]) monthsOpen[section] = {};
  monthsOpen[section][key] = !monthsOpen[section][key];
  render();
}
function toggleFormOpen(kind){
  formOpen[kind] = !formOpen[kind];
  render();
  if(formOpen[kind]){
    setTimeout(()=>{
      const el = document.getElementById('edit-anchor-'+kind);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 50);
  }
}

function getGreeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Buenos días';
  if(h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

const fmtMoney = n => {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
};

function escapeAttr(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Convierte el texto de un campo de monto a número, tratando comas como separador
// de miles (nunca como decimal) para que un teclado en otro idioma/región no
// convierta "12,788" en 12.788. Acepta tanto "12,788.50" como "12788.50".
function parseMoney(v){
  if(v === null || v === undefined) return 0;
  const cleaned = String(v).trim().replace(/,/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function startOfWeek(d){
  const date = new Date(d);
  const day = date.getDay(); // 0 Sun .. 6 Sat
  const diff = (day === 0 ? -6 : 1) - day; // move to Monday
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function nextExpenseDueDate(dueDay, from){
  const d = new Date(from);
  d.setHours(0,0,0,0);
  let candidate = new Date(d.getFullYear(), d.getMonth(), dueDay);
  if(candidate < d) candidate = new Date(d.getFullYear(), d.getMonth()+1, dueDay);
  return candidate;
}

function monthKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
}
function groupByMonth(items, amountFn){
  const map = {};
  const order = [];
  items.forEach(it=>{
    const key = monthKey(it.date);
    if(!map[key]){ map[key] = { key, label: monthLabel(it.date), items: [], total: 0 }; order.push(key); }
    map[key].items.push(it);
    map[key].total += amountFn ? amountFn(it) : (it.amount||0);
  });
  return order.sort((a,b)=>b.localeCompare(a)).map(k=>map[k]);
}

let saveStatus = null; // null | 'saving' | 'ok' | 'error'
let saveStatusTimer = null;

function setSaveStatus(status){
  saveStatus = status;
  renderStatusOnly();
  if(saveStatusTimer) clearTimeout(saveStatusTimer);
  if(status === 'ok'){
    saveStatusTimer = setTimeout(()=>{ saveStatus = null; renderStatusOnly(); }, 1800);
  }
}

function renderStatusOnly(){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(saveStatus === 'saving') el.textContent = 'Guardando…';
  else if(saveStatus === 'ok') el.textContent = 'Guardado ✓';
  else if(saveStatus === 'error') el.textContent = 'No se pudo guardar — reintentando en segundo plano';
  else el.textContent = '';
  el.className = 'save-status ' + (saveStatus || '');
}

let loadState = 'ok'; // localStorage es síncrono: no hay estado de "cargando" ni reintentos de red
let saveBlocked = false;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      data = normalizeData(JSON.parse(raw));
    }
    loadState = 'ok';
  }catch(e){
    // localStorage no disponible (modo incógnito muy restrictivo, o navegador muy viejo).
    loadState = 'unavailable';
  }
  loaded = true;
  render();
}

function downloadBackup(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `control-semanal-respaldo-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

let showBackupBox = false;
let copyStatus = '';

function toggleBackupBox(){
  showBackupBox = !showBackupBox;
  copyStatus = '';
  render();
  if(showBackupBox){
    setTimeout(()=>{
      const el = document.getElementById('backup-textarea');
      if(el){ el.focus(); el.select(); }
    }, 50);
  }
}

async function copyBackupText(){
  const text = document.getElementById('backup-textarea').value;
  try{
    await navigator.clipboard.writeText(text);
    copyStatus = 'Copiado ✓ — ahora pégalo en Notas o donde quieras guardarlo.';
  }catch(e){
    // El portapapeles automático puede estar bloqueado: recurrimos a selección manual.
    const el = document.getElementById('backup-textarea');
    el.focus();
    el.select();
    try{
      document.execCommand('copy');
      copyStatus = 'Copiado ✓ — ahora pégalo en Notas o donde quieras guardarlo.';
    }catch(e2){
      copyStatus = 'No pudimos copiarlo automáticamente. El texto ya está seleccionado: mantén presionado y elige "Copiar".';
    }
  }
  render();
  setTimeout(()=>{
    const el = document.getElementById('backup-textarea');
    if(el){ el.focus(); el.select(); }
  }, 50);
}

let pendingRestoreData = null;
let restoreError = null;
let showRestoreBox = false;

function toggleRestoreBox(){
  showRestoreBox = !showRestoreBox;
  restoreError = null;
  render();
}

function restoreFromTextarea(){
  const el = document.getElementById('restore-textarea');
  const val = el ? el.value : '';
  if(!val || !val.trim()){
    restoreError = 'Pega el contenido del archivo antes de restaurar.';
    render();
    return;
  }
  try{
    const parsed = JSON.parse(val);
    if(typeof parsed !== 'object' || parsed === null) throw new Error('formato inválido');
    pendingRestoreData = parsed;
    restoreError = null;
    showRestoreBox = false;
  }catch(err){
    pendingRestoreData = null;
    restoreError = 'Ese texto no es un respaldo válido — revisa que copiaste todo el contenido del archivo, desde la primera { hasta la última }.';
  }
  render();
}

function confirmRestore(){
  data = normalizeData(pendingRestoreData);
  pendingRestoreData = null;
  saveBlocked = false;
  loadState = 'ok';
  saveData();
  render();
}

function cancelRestore(){
  pendingRestoreData = null;
  render();
}

function saveData(){
  if(loadState === 'unavailable'){
    setSaveStatus('error');
    return;
  }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setSaveStatus('ok');
  }catch(e){
    // Típicamente por cuota llena (muy improbable con este volumen de datos) o modo incógnito estricto.
    setSaveStatus('error');
  }
}

// ---- Edición en curso ----
function startEdit(kind, id){
  editingItem = { kind, id };
  confirmingDeleteId = null;
  if(kind === 'savings-emergency') savingsTab = 'emergency';
  if(kind === 'savings-investments') savingsTab = 'investments';
  const sectionKey = kind === 'incomes' ? 'income'
    : (kind === 'savings-emergency' || kind === 'savings-investments') ? 'savings'
    : kind;
  if(sectionKey in sectionsOpen) sectionsOpen[sectionKey] = true;
  render();
  setTimeout(()=>{
    const el = document.getElementById('edit-anchor-'+kind);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}
function cancelEdit(){
  if(editingItem) formOpen[editingItem.kind] = false;
  editingItem = null;
  render();
}

// ---- Deudas ----
function addDebt(name, balance, rate, dueDate, monthlyPayment){
  data.debts.push({id:'d'+Date.now(), name, balance:parseMoney(balance), rate:parseMoney(rate)||0, dueDate, monthlyPayment:parseMoney(monthlyPayment)});
  saveData(); render();
}
function updateDebt(id, name, balance, rate, dueDate, monthlyPayment){
  const idx = data.debts.findIndex(d=>d.id===id);
  if(idx>-1) data.debts[idx] = {...data.debts[idx], name, balance:parseMoney(balance), rate:parseMoney(rate)||0, dueDate, monthlyPayment:parseMoney(monthlyPayment)};
  saveData(); render();
}
// ---- Gastos fijos ----
function addExpense(name, amount, dueDay){
  data.expenses.push({id:'e'+Date.now(), name, amount:parseMoney(amount), dueDay:Number(dueDay)});
  saveData(); render();
}
function updateExpense(id, name, amount, dueDay){
  const idx = data.expenses.findIndex(e=>e.id===id);
  if(idx>-1) data.expenses[idx] = {...data.expenses[idx], name, amount:parseMoney(amount), dueDay:Number(dueDay)};
  saveData(); render();
}
// ---- Ingresos ----
function addIncome(amount, date, source){
  data.incomes.push({id:'i'+Date.now(), amount:parseMoney(amount), date, source:source||''});
  saveData(); render();
}
function updateIncome(id, amount, date, source){
  const idx = data.incomes.findIndex(i=>i.id===id);
  if(idx>-1) data.incomes[idx] = {...data.incomes[idx], amount:parseMoney(amount), date, source:source||''};
  saveData(); render();
}
// ---- Gastos hormiga ----
function addHormiga(amount, date, desc){
  data.hormiga.push({id:'h'+Date.now(), amount:parseMoney(amount), date, desc:desc||''});
  saveData(); render();
}
function updateHormiga(id, amount, date, desc){
  const idx = data.hormiga.findIndex(h=>h.id===id);
  if(idx>-1) data.hormiga[idx] = {...data.hormiga[idx], amount:parseMoney(amount), date, desc:desc||''};
  saveData(); render();
}
// ---- Préstamos ----
// Un préstamo "activo" (no devuelto) descuenta su monto del capital disponible;
// al marcarlo devuelto, borrarlo, o editar su monto, se ajusta el capital para que
// siempre refleje lo que de verdad tienes en la mano.
function applyLoanBalanceEffect(amount, wasActive, isActive){
  const oldContribution = wasActive ? -amount : 0;
  const newContribution = isActive ? -amount : 0;
  data.settings.currentBalance = (data.settings.currentBalance || 0) + (newContribution - oldContribution);
}
function addLoan(person, amount, date, note){
  const amt = parseMoney(amount);
  data.loans.push({id:'l'+Date.now(), person, amount:amt, date, note:note||'', returned:false});
  applyLoanBalanceEffect(amt, false, true);
  saveData(); render();
}
function updateLoan(id, person, amount, date, note, returned){
  const idx = data.loans.findIndex(l=>l.id===id);
  if(idx>-1){
    const existing = data.loans[idx];
    const wasActive = !existing.returned;
    const newAmount = parseMoney(amount);
    const isActive = !returned;
    // Revierte el efecto del monto viejo y aplica el del monto nuevo
    if(wasActive) applyLoanBalanceEffect(existing.amount, true, false);
    if(isActive) applyLoanBalanceEffect(newAmount, false, true);
    data.loans[idx] = {...existing, person, amount:newAmount, date, note:note||'', returned: !!returned};
  }
  saveData(); render();
}
function toggleLoanReturned(id){
  const l = data.loans.find(x=>x.id===id);
  if(l){
    const wasActive = !l.returned;
    l.returned = !l.returned;
    const isActive = !l.returned;
    applyLoanBalanceEffect(l.amount, wasActive, isActive);
    saveData(); render();
  }
}
function removeLoan(id){
  const l = data.loans.find(x=>x.id===id);
  if(l){
    const wasActive = !l.returned;
    applyLoanBalanceEffect(l.amount, wasActive, false);
  }
  data.loans = data.loans.filter(x => x.id !== id);
  saveData(); render();
}

function removeItem(kind, id){
  data[kind] = data[kind].filter(x => x.id !== id);
  saveData(); render();
}

let confirmingDeleteId = null;
function requestDelete(id){
  confirmingDeleteId = id;
  render();
}
function cancelDelete(){
  confirmingDeleteId = null;
  render();
}
function confirmDelete(kind, id){
  confirmingDeleteId = null;
  if(editingItem && editingItem.kind===kind && editingItem.id===id) editingItem = null;
  if(kind === 'loans'){ removeLoan(id); return; }
  removeItem(kind, id);
}
function deleteControl(kind, id){
  if(confirmingDeleteId === id){
    if(kind === 'debts'){
      return `<span class="del-confirm">
        <button class="item-del-yes" onclick="confirmPaidDebt('${id}')">Saldada ✓</button>
        <button class="item-del-yes" style="border-color:var(--ink-faint);color:var(--ink-faint);" onclick="confirmDelete('${kind}','${id}')">Borrar sin más</button>
        <button class="item-del-no" onclick="cancelDelete()">Cancelar</button>
      </span>`;
    }
    return `<span class="del-confirm">
      <button class="item-del-yes" onclick="confirmDelete('${kind}','${id}')">Sí, borrar</button>
      <button class="item-del-no" onclick="cancelDelete()">Cancelar</button>
    </span>`;
  }
  return `<button class="item-del" onclick="event.stopPropagation(); requestDelete('${id}')">×</button>`;
}
function confirmPaidDebt(id){
  const debt = data.debts.find(d => d.id === id);
  if(debt){
    data.history.paidDebts.push({
      id:'p'+Date.now(),
      name: debt.name,
      balance: debt.balance,
      monthlyPayment: debt.monthlyPayment,
      date: new Date().toISOString().slice(0,10)
    });
  }
  confirmingDeleteId = null;
  if(editingItem && editingItem.kind==='debts' && editingItem.id===id) editingItem = null;
  removeItem('debts', id);
}

// ---- Resumen por rango de fechas ----
let rangeStart = null, rangeEnd = null;
function setRangeStart(v){ rangeStart = v; render(); }
function setRangeEnd(v){ rangeEnd = v; render(); }
function computeRangeSummary(){
  if(!rangeStart || !rangeEnd) return null;
  const rs = new Date(rangeStart+'T00:00:00');
  const re = new Date(rangeEnd+'T23:59:59');
  if(re < rs) return null;
  const incomes = data.incomes.filter(i=>{ const d=new Date(i.date+'T00:00:00'); return d>=rs && d<=re; });
  const hormiga = data.hormiga.filter(h=>{ const d=new Date(h.date+'T00:00:00'); return d>=rs && d<=re; });
  const loans = data.loans.filter(l=>{ const d=new Date(l.date+'T00:00:00'); return d>=rs && d<=re; });

  const recurring = [];
  data.debts.forEach(d=>{ if(d.dueDate) recurring.push({ name:d.name, amount:d.monthlyPayment||0, dayOfMonth:new Date(d.dueDate+'T00:00:00').getDate(), kind:'Deuda' }); });
  data.expenses.forEach(e=>{ recurring.push({ name:e.name, amount:e.amount||0, dayOfMonth:e.dueDay, kind:'Gasto fijo' }); });

  const dueItems = [];
  const d = new Date(rs);
  while(d <= re){
    const lastDayOfMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    recurring.forEach(it=>{
      const effectiveDay = Math.min(it.dayOfMonth, lastDayOfMonth);
      if(d.getDate() === effectiveDay) dueItems.push({ name: it.name, amount: it.amount, kind: it.kind, date: new Date(d).toISOString().slice(0,10) });
    });
    d.setDate(d.getDate()+1);
  }

  const totalIncome = incomes.reduce((s,i)=>s+(i.amount||0),0);
  const totalHormiga = hormiga.reduce((s,h)=>s+(h.amount||0),0);
  const totalDue = dueItems.reduce((s,x)=>s+(x.amount||0),0);
  const totalLoaned = loans.reduce((s,l)=>s+(l.amount||0),0);
  return { incomes, hormiga, loans, dueItems, totalIncome, totalHormiga, totalDue, totalLoaned };
}
function renderRangeSummary(r){
  if(!r) return '<div class="empty-note" style="border-top:none;">Elige fecha de inicio y fin para ver el resumen.</div>';
  const rows = [];
  r.incomes.forEach(i=>rows.push({label:(i.source||'Ingreso'), kind:'Ingreso', amount:i.amount, date:i.date, positive:true}));
  r.hormiga.forEach(h=>rows.push({label:(h.desc||'Gasto hormiga'), kind:'Hormiga', amount:h.amount, date:h.date, positive:false}));
  r.loans.forEach(l=>rows.push({label:l.person, kind:'Préstamo', amount:l.amount, date:l.date, positive:false}));
  r.dueItems.forEach(x=>rows.push({label:x.name, kind:x.kind, amount:x.amount, date:x.date, positive:false}));
  rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const net = r.totalIncome - r.totalHormiga - r.totalDue - r.totalLoaned;
  return `
    <div class="item-row" style="border-top:none;"><div class="item-main"><div class="item-name">Ingresos</div></div><div class="item-amounts"><span class="item-amount" style="color:var(--good);">${fmtMoney(r.totalIncome)}</span></div></div>
    <div class="item-row"><div class="item-main"><div class="item-name">Gastos hormiga</div></div><div class="item-amounts"><span class="item-amount" style="color:var(--warn);">${fmtMoney(r.totalHormiga)}</span></div></div>
    <div class="item-row"><div class="item-main"><div class="item-name">Deudas y gastos fijos que vencen</div></div><div class="item-amounts"><span class="item-amount" style="color:var(--warn);">${fmtMoney(r.totalDue)}</span></div></div>
    <div class="item-row"><div class="item-main"><div class="item-name">Prestado en el período</div></div><div class="item-amounts"><span class="item-amount" style="color:var(--warn);">${fmtMoney(r.totalLoaned)}</span></div></div>
    <div class="item-row" style="border-top:2px solid var(--line);"><div class="item-main"><div class="item-name">Neto del período</div></div><div class="item-amounts"><span class="item-amount" style="${net<0?'color:var(--warn);':'color:var(--good);'}">${fmtMoney(net)}</span></div></div>
    <p class="item-meta" style="margin:14px 0 6px 0;">Detalle</p>
    ${rows.length ? rows.map(x=>`
      <div class="item-row">
        <div class="item-main"><div class="item-name">${x.label}</div><div class="item-meta">${x.kind} · ${new Date(x.date+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</div></div>
        <div class="item-amounts"><span class="item-amount" style="${x.positive?'color:var(--good);':''}">${x.positive?'+':'-'}${fmtMoney(x.amount)}</span></div>
      </div>`).join('') : '<div class="empty-note">Sin movimientos en este rango.</div>'}
  `;
}

function computeAll(){
  const today = new Date(); today.setHours(0,0,0,0);
  const weekStart = startOfWeek(today);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6); weekEnd.setHours(23,59,59,999);
  const in7 = new Date(today); in7.setDate(in7.getDate()+7);

  const weeklyEquivDebt = data.debts.map(d => ({...d, weekly: (d.monthlyPayment||0)/4.345}));
  const weeklyEquivExp = data.expenses.map(e => ({...e, weekly: (e.amount||0)/4.345}));

  const weeklyTarget = weeklyEquivDebt.reduce((s,d)=>s+d.weekly,0) + weeklyEquivExp.reduce((s,e)=>s+e.weekly,0);

  let dueThisWeek = 0;
  const upcoming = [];
  data.debts.forEach(d=>{
    if(!d.dueDate) return;
    const dd = new Date(d.dueDate+'T00:00:00');
    const days = Math.round((dd-today)/86400000);
    if(dd >= today && dd <= in7) dueThisWeek += (d.monthlyPayment||0);
    if(days >= 0 && days <= 30) upcoming.push({name:d.name, amount:d.monthlyPayment||0, days, date:dd});
  });
  data.expenses.forEach(e=>{
    const dd = nextExpenseDueDate(e.dueDay, today);
    const days = Math.round((dd-today)/86400000);
    if(dd >= today && dd <= in7) dueThisWeek += (e.amount||0);
    if(days >= 0 && days <= 30) upcoming.push({name:e.name, amount:e.amount, days, date:dd});
  });
  upcoming.sort((a,b)=>a.date-b.date);

  const incomeThisWeek = data.incomes
    .filter(i=>{ const dd=new Date(i.date+'T00:00:00'); return dd>=weekStart && dd<=weekEnd; })
    .reduce((s,i)=>s+(i.amount||0),0);

  const hormigaThisWeek = data.hormiga
    .filter(h=>{ const dd=new Date(h.date+'T00:00:00'); return dd>=weekStart && dd<=weekEnd; })
    .reduce((s,h)=>s+(h.amount||0),0);

  const hormigaLimit = (data.settings && data.settings.hormigaLimit) || 0;
  const hormigaOver = hormigaThisWeek - hormigaLimit;

  const availableThisWeek = incomeThisWeek - hormigaThisWeek;
  const need = Math.max(weeklyTarget, dueThisWeek);
  const shortfall = need - availableThisWeek;

  const currentBalance = (data.settings && data.settings.currentBalance) || 0;
  const totalWithBalance = currentBalance + availableThisWeek;
  const realGap = need - totalWithBalance; // positivo = aún te falta, negativo = te sobra

  const totalDebt = data.debts.reduce((s,d)=>s+(d.balance||0),0);
  const monthlyTotal = data.debts.reduce((s,d)=>s+(d.monthlyPayment||0),0) + data.expenses.reduce((s,e)=>s+(e.amount||0),0);

  // Recurring items projected as "day of month" for multi-week lookahead
  const recurring = [];
  data.debts.forEach(d=>{
    if(!d.dueDate) return;
    recurring.push({ name:d.name, amount:d.monthlyPayment||0, dayOfMonth: new Date(d.dueDate+'T00:00:00').getDate() });
  });
  data.expenses.forEach(e=>{
    recurring.push({ name:e.name, amount:e.amount||0, dayOfMonth:e.dueDay });
  });

  function amountDueInRange(rangeStart, rangeEnd){
    let total = 0;
    const d = new Date(rangeStart);
    while(d <= rangeEnd){
      const lastDayOfMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      recurring.forEach(it=>{
        const effectiveDay = Math.min(it.dayOfMonth, lastDayOfMonth);
        if(d.getDate() === effectiveDay) total += it.amount;
      });
      d.setDate(d.getDate()+1);
    }
    return total;
  }

  const weeksAhead = [];
  for(let w=0; w<4; w++){
    const ws = new Date(weekStart); ws.setDate(ws.getDate() + w*7);
    const we = new Date(ws); we.setDate(we.getDate()+6); we.setHours(23,59,59,999);
    const due = amountDueInRange(ws, we);
    weeksAhead.push({ weekStart: ws, weekEnd: we, due, isCurrent: w===0 });
  }

  return {weeklyTarget, dueThisWeek, incomeThisWeek, hormigaThisWeek, hormigaLimit, hormigaOver, availableThisWeek, shortfall, totalDebt, monthlyTotal, upcoming, weeklyEquivDebt, weeklyEquivExp, need, weeksAhead, currentBalance, totalWithBalance, realGap};
}

function pastWeeksHistory(limit){
  const today = new Date(); today.setHours(0,0,0,0);
  const curWeekStart = startOfWeek(today);
  const weeks = [];
  for(let w=1; w<=limit; w++){
    const ws = new Date(curWeekStart); ws.setDate(ws.getDate() - w*7);
    const we = new Date(ws); we.setDate(we.getDate()+6); we.setHours(23,59,59,999);
    const income = data.incomes
      .filter(i=>{ const dd=new Date(i.date+'T00:00:00'); return dd>=ws && dd<=we; })
      .reduce((s,i)=>s+(i.amount||0),0);
    const hormiga = data.hormiga
      .filter(h=>{ const dd=new Date(h.date+'T00:00:00'); return dd>=ws && dd<=we; })
      .reduce((s,h)=>s+(h.amount||0),0);
    if(income === 0 && hormiga === 0) continue;
    weeks.push({ weekStart: ws, weekEnd: we, income, hormiga, net: income - hormiga });
  }
  return weeks;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<p style="color:#8B93A0;padding-top:40px;">Cargando…</p>'; return; }

  if(loadState === 'unavailable'){
    app.innerHTML = `
      <p class="today">${new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'})}</p>
      <h1>Control semanal</h1>
      <div class="load-fail">
        <p class="load-fail-title">Tu navegador está bloqueando el guardado local</p>
        <p class="load-fail-body">Esto pasa sobre todo en modo incógnito/privado muy estricto. Abre este archivo en una pestaña normal (no incógnita) de Chrome o Safari para que pueda guardar tus datos.</p>
      </div>
    `;
    return;
  }

  const c = computeAll();
  const today = new Date();
  const todayStr = today.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

  let html = '';
  html += `<p class="greeting">${getGreeting()}, Bran</p>`;
  html += `<p class="today">${todayStr}</p>`;
  html += `<h1>Control semanal</h1>`;
  html += `<p class="save-status" id="save-status"></p>`;

  html += `<div class="backup-row">
    <button class="btn backup-btn" onclick="toggleBackupBox()">📋 Copiar respaldo</button>
    <button class="btn backup-btn" onclick="downloadBackup()">⬇ Descargar archivo</button>
    <button class="btn backup-btn" onclick="toggleRestoreBox()">⬆ Restaurar</button>
  </div>
  ${renderBackupBox()}
  ${renderRestoreDialogs()}`;

  html += `<div class="balance-row">
    <label for="current-balance">¿Cuánto tienes ahora en la mano/cuenta?</label>
    <input type="text" inputmode="decimal" id="current-balance" value="${c.currentBalance}" placeholder="0.00" onchange="setCurrentBalance(this.value)">
  </div>`;

  const heroClass = c.shortfall > 0 ? 'warn' : 'good';
  const heroText = c.shortfall > 0 ? fmtMoney(c.shortfall) : fmtMoney(0);
  html += `<div class="hero">
    <p class="hero-label">${c.shortfall > 0 ? 'Te falta ganar esta semana' : 'Vas cubierto esta semana'}</p>
    <p class="hero-number ${heroClass}">${heroText}</p>
    <p class="hero-sub">Ingresado: ${fmtMoney(c.incomeThisWeek)} − hormiga: ${fmtMoney(c.hormigaThisWeek)} = disponible ${fmtMoney(c.availableThisWeek)} · Meta: ${fmtMoney(c.need)}</p>
  </div>`;

  const gapClass = c.realGap > 0 ? 'warn' : 'good';
  const gapLabel = c.realGap > 0 ? 'Sumando lo que ya tienes, aún te faltan' : 'Sumando lo que ya tienes, te sobran';
  const gapText = fmtMoney(Math.abs(c.realGap));
  html += `<div class="hero" style="border-top:none;padding-top:0;">
    <p class="hero-label">${gapLabel}</p>
    <p class="hero-number ${gapClass}" style="font-size:32px;">${gapText}</p>
    <p class="hero-sub">Tienes ${fmtMoney(c.currentBalance)} + disponible esta semana ${fmtMoney(c.availableThisWeek)} = ${fmtMoney(c.totalWithBalance)} frente a una meta de ${fmtMoney(c.need)}</p>
  </div>`;

  html += `<div class="stat-row">
    <div class="stat">
      <p class="stat-label">Meta semanal promedio</p>
      <p class="stat-value">${fmtMoney(c.weeklyTarget)}</p>
    </div>
    <div class="stat">
      <p class="stat-label">Total mensual</p>
      <p class="stat-value">${fmtMoney(c.monthlyTotal)}</p>
    </div>
    <div class="stat">
      <p class="stat-label">Deuda total</p>
      <p class="stat-value">${fmtMoney(c.totalDebt)}</p>
    </div>
  </div>`;

  const fmtRange = (s,e) => `${s.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${e.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;

function renderSavingsTab(which){
  const label = which==='emergency' ? 'Fondo de emergencia' : 'Inversiones';
  const movements = data.savings[which].movements;
  const total = savingsTotal(which);
  const kind = 'savings-'+which;
  const editing = editingItem && editingItem.kind===kind ? movements.find(m=>m.id===editingItem.id) : null;
  const groups = groupByMonth(movements.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)), m => m.type==='withdraw' ? -(m.amount||0) : (m.amount||0));

  let html = `<div class="hero" style="padding:14px 0 18px 0;border-bottom:1px solid var(--line);margin-bottom:14px;">
    <p class="hero-label">${label} — total actual</p>
    <p class="hero-number good" style="font-size:30px;">${fmtMoney(total)}</p>
  </div>`;

  if(which === 'investments'){
    html += `<div class="balance-row">
      <label for="inv-rate">Interés / rendimiento (%)</label>
      <input type="text" inputmode="decimal" id="inv-rate" value="${data.savings.investments.rate||0}" style="width:90px;" onchange="setInvestmentRate(this.value)">
    </div>`;
  }

  html += groups.length ? groups.map((g,gi)=>{
    const open = isMonthOpen(kind, g.key, gi===0);
    return `
    <div class="month-header" onclick="toggleMonth('${kind}','${g.key}')"><span>${g.label}</span><span class="amt">${fmtMoney(g.total)} <span class="chevron ${open?'open':''}">›</span></span></div>
    ${open ? g.items.map(m=>`
      <div class="item-row">
        <div class="item-main clickable" onclick="startEdit('${kind}','${m.id}')">
          <div class="item-name">${m.type==='withdraw'?'Retiro':'Depósito'}${m.note?' · '+m.note:''}</div>
          <div class="item-meta">${new Date(m.date+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</div>
        </div>
        <div class="item-amounts"><span class="item-amount" style="${m.type==='withdraw'?'color:var(--warn);':'color:var(--good);'}">${m.type==='withdraw'?'-':'+'}${fmtMoney(m.amount)}</span></div>
        ${deleteControlSavings(which, m.id)}
      </div>`).join('') : ''}
  `;}).join('') : '<div class="empty-note">Sin movimientos registrados.</div>';

  if(formOpen[kind] || !!editing){
    html += `<div class="add-form" id="edit-anchor-${kind}">
      <div class="field-row">
        <div class="field"><label>Tipo</label>
          <select id="sav-${which}-type">
            <option value="deposit" ${editing&&editing.type==='deposit'?'selected':''}>Depósito</option>
            <option value="withdraw" ${editing&&editing.type==='withdraw'?'selected':''}>Retiro</option>
          </select>
        </div>
        <div class="field"><label>Monto</label><input type="text" inputmode="decimal" id="sav-${which}-amount" placeholder="0.00" value="${editing?editing.amount:''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Fecha</label><input type="date" id="sav-${which}-date" value="${editing?editing.date:new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Nota (opcional)</label><input type="text" id="sav-${which}-note" placeholder="Opcional" value="${editing?escapeAttr(editing.note):''}"></div>
      </div>
      <div class="field-row" style="gap:8px;">
        <button class="btn btn-primary" onclick="submitSavingsMovement('${which}')">${editing?'Guardar cambios':'Añadir movimiento'}</button>
        <button class="btn" onclick="${editing?'cancelEdit()':`toggleFormOpen('${kind}')`}">Cancelar</button>
      </div>
    </div>`;
  } else {
    html += `<button class="add-toggle-btn" id="edit-anchor-${kind}" onclick="toggleFormOpen('${kind}')">+ Añadir movimiento</button>`;
  }

  return html;
}

function renderSection(key, title, count, bodyHtml){
  const open = sectionsOpen[key];
  const countHtml = (count === '' ) ? '' : ` <span class="section-count">(${count})</span>`;
  return `<section>
    <div class="section-head" onclick="toggleSection('${key}')">
      <p class="section-title">${title}${countHtml}</p>
      <span class="chevron ${open?'open':''}">›</span>
    </div>
    <div class="section-body ${open?'open':''}">${bodyHtml}</div>
  </section>`;
}

function submitIncome(){
  const amount = document.getElementById('inc-amount').value;
  const date = document.getElementById('inc-date').value;
  const source = document.getElementById('inc-source').value;
  if(!amount || !date) return;
  if(editingItem && editingItem.kind==='incomes'){
    updateIncome(editingItem.id, amount, date, source);
    editingItem = null;
  } else {
    addIncome(amount, date, source);
  }
  formOpen['incomes'] = false;
}

  const day = document.getElementById('exp-day').value;
  if(!name || !amount || !day) return;

  formOpen['expenses'] = false;

function submitLoan(){
  const person = document.getElementById('loan-person').value;
  const amount = document.getElementById('loan-amount').value;
  const date = document.getElementById('loan-date').value;
  const note = document.getElementById('loan-note').value;
  if(!person || !amount || !date) return;
  if(editingItem && editingItem.kind==='loans'){
    const existing = data.loans.find(l=>l.id===editingItem.id);
    updateLoan(editingItem.id, person, amount, date, note, existing ? existing.returned : false);
    editingItem = null;
  } else {
    addLoan(person, amount, date, note);
  }
  formOpen['loans'] = false;
}

loadData();
