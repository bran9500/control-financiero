// =====================================================================
//  REVISAR MOVIMIENTOS (tarjeta en Inicio)
//  Agrupa por comercio/persona: lo que contestas se aplica a todos los de ese comercio.
// =====================================================================
const NOISE_ONE = new RegExp(DESC_NOISE.source);
// Palabras del banco que no dicen nada del comercio: no sirven para comparar.
const GENERIC_WORDS = new Set(['JERSEY','CITY','BAYONNE','NEWARK','YORK','STORE','MARKET','PAYMENT','PAYMENTS','DEPOSIT','INC','LLC','COMPANY',
  'SERVICE','SERVICES','SVC','ONLINE','BILL','TRANSFER','ZELLE','SENT','RECEIVED','ELECTRONIC','PURCHASE','DEBIT','CREDIT','CARD','AUTOPAY',
  'RECURRING','WITHDRAWAL','CHECK','FUNDS','DIRECT','PAYROLL','INTERNET','MOBILE','BANK','CORP','STORES','SUPERCENTER','CENTER','WWW']);
const REVIEW_DAYS = 45;     // solo se pregunta por movimientos recientes
const SNOOZE_DAYS = 3;      // "Después" lo esconde estos días; a la segunda vez se descarta

function sigWords(s){
  return normDesc(s).replace(/[^A-Z ]/g,' ').split(' ').filter(w => w.length >= 4 && !GENERIC_WORDS.has(w) && !NOISE_ONE.test(' '+w+' '));
}
// Dirección (entrada/salida) de un comercio ya nombrado, según sus movimientos.
function keyDir(key){
  const t = bankList().find(x => merchantKey(x.desc) === key);
  return t ? t.dir : null;
}
// Sugerencia de nombre: mismo comercio ya nombrado, o uno que comparte una palabra propia (nunca mezcla entradas con salidas).
function suggestName(t){
  const names = data.bank.names || {};
  const key = merchantKey(t.desc);
  if(names[key]) return { name: names[key], exact: true, key };
  const words = sigWords(key);
  if(!words.length) return null;
  for(const k of Object.keys(names)){
    if(keyDir(k) !== t.dir) continue;
    const kw = sigWords(k);
    if(kw.some(w => words.includes(w)) || sameCompact(words, kw)) return { name: names[k], exact: false, key: k };
  }
  return null;
}

// "STAR SNACKS" y "STARSNACKS" son lo mismo: se comparan pegados.
function sameCompact(a, b){
  const ca = a.join(''), cb = b.join('');
  if(ca.length < 5 || cb.length < 5) return false;
  return ca.includes(cb) || cb.includes(ca) || b.some(w => w.length >= 5 && ca.includes(w)) || a.some(w => w.length >= 5 && cb.includes(w));
}
let questionRename = null;   // grupo al que le dijiste "No" y estás escribiendo qué es
let questionCats = null;     // grupo en el que abriste "Otra categoría"
function groupKeyOf(t){ return t.dir + '|' + merchantKey(t.desc); }
function groupTxs(gk){
  const since = addDays(new Date(), -REVIEW_DAYS);
  return bankList().filter(t => groupKeyOf(t) === gk && isoToDate(t.date) >= since && !t.qDismissed);
}
function pendingLoanFor(t){
  const k = merchantKey(t.desc);
  return data.loans.find(l => l.fromBank && !l.returned && l.personKey === k);
}

function pendingQuestions(){
  const today = todayISO();
  const since = addDays(new Date(), -REVIEW_DAYS);
  const groups = {};
  bankList().forEach(t => {
    if(t.qDismissed || isoToDate(t.date) < since) return;
    if(t.qSnooze && t.qSnooze > today) return;
    (groups[groupKeyOf(t)] = groups[groupKeyOf(t)] || []).push(t);
  });
  const qs = [];
  // Pagos repetidos: una deuda y un gasto fijo con casi el mismo monto
  detectDupes().forEach(d => qs.push({ kind:'dupe', gk: d.gk, dupe:d, date:'9999' }));
  Object.keys(groups).forEach(gk => {
    const txs = groups[gk].sort((a,b) => b.date.localeCompare(a.date));
    const t = txs[0];
    const key = merchantKey(t.desc);
    const base = { gk, txs, t, date: t.date };
    // 0) El mismo comercio quedó en dos cosas distintas: preguntar para que no se duplique
    const conf = groupConflict(gk);
    if(conf){ qs.push({ ...base, kind:'conflict', options: conf }); return; }
    // 1) Alguien te devuelve un préstamo
    const loan = t.dir === 'in' ? pendingLoanFor(t) : null;
    const loanTx = txs.find(x => x.dir === 'in' && x.category !== 'loanback' && !x.reviewed && pendingLoanFor(x));
    if(loan && loanTx){ qs.push({ ...base, t: loanTx, kind:'loanback', loan }); return; }
    // 2) Pagos de deuda / gasto fijo sin conectar
    const unlinked = txs.filter(x => (x.category === 'debt' || x.category === 'fixed') && !x.link && !x.linkAsked && x.dir === 'out');
    if(unlinked.length){
      const mem = (data.bank.linkMemory || {})[gk];
      const target = mem && (mem.type === 'debt' ? data.debts.find(d => d.id === mem.id) : data.expenses.find(e => e.id === mem.id));
      qs.push({ ...base, t: unlinked[0], txs: unlinked, kind:'link', target: target ? { type: mem.type, id: mem.id, name: target.name } : null });
      return;
    }
    // 3) Te devolvieron un préstamo pero falta decir cuál
    const lb = txs.find(x => x.category === 'loanback' && !x.loanId);
    if(lb){ qs.push({ ...base, t: lb, kind:'loanpick' }); return; }
    // 4) Nombre parecido a uno que ya pusiste
    if(!(data.bank.trust[key] >= 2) && txs.some(x => !x.nameOk) && t.category !== 'own' && t.category !== 'ignore'){
      const sug = suggestName(t);
      if(sug){ qs.push({ ...base, kind:'name', sug }); return; }
    }
    // 5) Comercio nuevo (o confirmado solo 1 vez): preguntar en qué categoría va
    const rule = findRule(key, t.dir);
    const unrev = txs.filter(x => !x.reviewed && x.auto !== 'manual-set' && x.auto !== 'manual' && !x.link);
    if(unrev.length && !ruleTrusted(rule)){
      qs.push({ ...base, t: unrev[0], txs: unrev, kind:'cat', last: rule ? rule.category : null });
    }
  });
  return qs.sort((a,b) => (b.date||'').localeCompare(a.date||''));
}

function setGroupCategory(gk, cat){
  const txs = groupTxs(gk);
  if(!txs.length || !BANK_CATS[cat]) return;
  const t = txs[0];
  const key = merchantKey(t.desc);
  txs.forEach(x => {
    if(x.category !== cat){
      if(x.link) unlinkTx(x);
      if(x.category === 'loan') removeLoanFromTx(x);
      if(x.category === 'loanback') removeRepayment(x);
    }
    x.category = cat; x.auto = 'manual-set'; x.reviewed = true;
  });
  upsertRule(key, t.dir, cat);
  questionCats = null;
  saveData();
  if(cat === 'debt' || cat === 'fixed'){ openLinkSheet(t.id, cat === 'debt' ? 'debt' : 'expense'); return; }
  if(cat === 'loan'){ txs.forEach(x => createLoanFromTx(x)); saveData(); sheet = { type:'loanDue', loanId: t.loanId }; render(); return; }
  if(cat === 'loanback'){ sheet = { type:'loanPick', txId: t.id }; render(); return; }
  render();
  showToast(`"${displayName(t)}" → ${BANK_CATS[cat].label}` + (txs.length > 1 ? ` (${txs.length} movimientos)` : '') + '. Lo recordaré.');
}
function dismissGroup(gk){
  if(gk.startsWith('dupe|')){ const [, a, b] = gk.split('|'); ignoreDupe(a, b); return; }
  groupTxs(gk).forEach(x => { x.qDismissed = true; x.reviewed = true; });
  questionRename = null; questionCats = null;
  saveData(); render();
  showToast('Descartado: no vuelve a aparecer');
}
function snoozeGroup(gk){
  if(gk.startsWith('dupe|')){ skippedDupes.add(gk); render(); return; }
  let dismissed = false;
  const until = dayISO(addDays(new Date(), SNOOZE_DAYS));
  groupTxs(gk).forEach(x => {
    x.qSnoozes = (x.qSnoozes || 0) + 1;
    if(x.qSnoozes >= 2){ x.qDismissed = true; dismissed = true; } else x.qSnooze = until;
  });
  questionRename = null; questionCats = null;
  saveData(); render();
  showToast(dismissed ? 'Ya lo habías dejado para después: lo descarté para que no se acumule' : `Te lo vuelvo a preguntar en ${SNOOZE_DAYS} días`);
}
function answerName(gk, yes){
  const txs = groupTxs(gk);
  if(!txs.length) return;
  const t = txs[0];
  const sug = suggestName(t);
  if(yes && sug){
    const key = merchantKey(t.desc);
    if(!sug.exact) data.bank.names[key] = sug.name;
    data.bank.trust[key] = (data.bank.trust[key] || 0) + 1;
    txs.forEach(x => { x.nameOk = true; });
    // Si el comercio parecido ya tenía categoría, se usa la misma
    const simRule = (data.bank.rules || []).find(r => r.key === sug.key && r.dir === t.dir);
    if(simRule && !findRule(key, t.dir)){ upsertRule(key, t.dir, simRule.category); txs.forEach(x => { if(!x.link){ x.category = simRule.category; x.reviewed = true; } }); }
    saveData(); render();
    showToast(`Listo: "${sug.name}"` + (txs.length > 1 ? ` (${txs.length} movimientos)` : ''));
  } else {
    questionRename = gk;
    render();
    setTimeout(() => { const el = document.getElementById('q-rename'); if(el) el.focus(); }, 50);
  }
}
function saveQuestionRename(gk){
  const txs = groupTxs(gk);
  const el = document.getElementById('q-rename');
  if(!txs.length || !el) return;
  const name = el.value.trim();

function answerLink(gk, yes){
  const txs = groupTxs(gk).filter(x => (x.category === 'debt' || x.category === 'fixed') && !x.link);
  if(!txs.length) return;
  const mem = (data.bank.linkMemory || {})[gk];

}
function answerLoanBack(txId, loanId, yes){

  if(!t) return;

// ---- Un mismo comercio puesto en dos cosas distintas ----
function assignmentOf(x){
  if(x.link){
    const tg = x.link.type === 'debt' ? data.debts.find(d => d.id === x.link.id) : data.expenses.find(e => e.id === x.link.id);
    return { id: x.link.type + ':' + x.link.id, label: tg ? tg.name + (x.link.type === 'debt' ? ' (deuda)' : ' (gasto fijo)') : '?', link: x.link };
  }
  return { id: 'cat:' + x.category, label: BANK_CATS[x.category] ? BANK_CATS[x.category].label : x.category, cat: x.category };
}
function groupConflict(gk){
  if((data.conflictOk || []).includes(gk)) return null;
  const opts = {};
  bankList().forEach(x => {
    if(groupKeyOf(x) !== gk || x.qDismissed) return;
    if(!(x.auto === 'manual-set' || x.link)) return;
    if(['loan','loanback','own','trading','ignore'].includes(x.category)) return;
    const a = assignmentOf(x);
    if(!opts[a.id]) opts[a.id] = { ...a, n: 0 };
    opts[a.id].n++;
  });
  const list = Object.values(opts);
  return list.length > 1 ? list : null;
}
function resolveConflict(gk, optId){
  const conf = groupConflict(gk);
  const opt = conf && conf.find(o => o.id === optId);
  if(!opt) return;
  const txs = bankList().filter(x => groupKeyOf(x) === gk && !x.qDismissed);
  if(opt.link){
    const t0 = txs.find(x => !(x.link && x.link.id === opt.link.id)) || txs[0];
    txs.forEach(x => { if(x.link && x.link.id !== opt.link.id) unlinkTx(x); x.auto = 'manual-set'; });
    chooseLink(t0.id, opt.link.type, opt.link.id);
  } else {
    txs.forEach(x => { if(x.link) unlinkTx(x); x.category = opt.cat; x.auto = 'manual-set'; x.reviewed = true; });
    upsertRule(merchantKey(txs[0].desc), txs[0].dir, opt.cat);
    saveData(); render();
    showToast(`Listo: todo "${displayName(txs[0])}" quedó como ${opt.label}`);
  }
}
function keepConflict(gk){
  if(!data.conflictOk) data.conflictOk = [];
  data.conflictOk.push(gk);
  saveData(); render();
}

// ---- Pagos repetidos: deuda y gasto fijo que son el mismo pago (ej. el carro) ----
let skippedDupes = new Set();
// Referencias: "d:<id>" para deudas, "e:<id>" para gastos fijos.
function refItem(ref){
  const [k, id] = [ref.slice(0,1), ref.slice(2)];
  if(k === 'd'){ const d = data.debts.find(x => x.id === id); return d ? { type:'debt', id, name:d.name, amount:d.monthlyPayment||0, item:d } : null; }
  const e = data.expenses.find(x => x.id === id);
  return e ? { type:'expense', id, name:e.name, amount:e.amount||0, item:e, freq: expenseFreq(e) } : null;
}
function itemDesc(r){
  if(r.type === 'debt') return `deuda con pago de ${fmtMoney(r.amount)} al mes`;
  return `gasto fijo de ${fmtMoney(r.amount)} ${expenseWhen(r.item).toLowerCase()}`;
}
const normName = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function detectDupes(){
  const ign = data.dupIgnored || [];
  const out = [];
  const close = (a, b) => a > 0 && b > 0 && Math.abs(a - b) <= Math.max(5, Math.max(a,b) * 0.03);
  const add = (a, b) => {
    const gk = 'dupe|'+a+'|'+b;
    if(ign.includes(a+'|'+b) || ign.includes(b+'|'+a) || skippedDupes.has(gk)) return;
    out.push({ a: refItem(a), b: refItem(b), aRef:a, bRef:b, gk });
  };
  // deuda + gasto fijo con casi el mismo pago mensual (ej. Tel Toyota y Carro)
  data.debts.forEach(d => {
    if(!(d.monthlyPayment > 0)) return;
    data.expenses.forEach(e => { if(expenseFreq(e) === 'month' && close(e.amount, d.monthlyPayment)) add('e:'+e.id, 'd:'+d.id); });
  });
  // dos deudas con el mismo nombre (ej. "Child support" repetida)
  for(let i = 0; i < data.debts.length; i++) for(let k = i+1; k < data.debts.length; k++){
    const a = data.debts[i], b = data.debts[k];
    if(normName(a.name) === normName(b.name)) add('d:'+b.id, 'd:'+a.id);
  }
  // dos gastos fijos iguales (mismo nombre, o mismo monto y misma frecuencia)
  for(let i = 0; i < data.expenses.length; i++) for(let k = i+1; k < data.expenses.length; k++){
    const a = data.expenses[i], b = data.expenses[k];
    if(expenseFreq(a) !== expenseFreq(b)) continue;
    if(normName(a.name) === normName(b.name) || close(a.amount, b.amount)) add('e:'+b.id, 'e:'+a.id); // se queda el más viejo
  }
  return out;
}
function ignoreDupe(a, b){
  if(!data.dupIgnored) data.dupIgnored = [];
  data.dupIgnored.push(a+'|'+b);
  saveData(); render();
}
// Une "from" dentro de "to": los pagos conectados pasan a "to" y "from" se borra.
function mergeItems(fromRef, toRef){
  const from = refItem(fromRef), to = refItem(toRef);
  if(!from || !to || fromRef === toRef) return;
  let moved = 0;
  bankList().forEach(t => {
    if(t.link && t.link.type === from.type && t.link.id === from.id){ unlinkTx(t); linkTx(t, to.type, to.id); moved++; }
  });
  if(from.type === 'expense'){
    data.allocations = (data.allocations || []).map(a => a.expenseId === from.id ? (to.type === 'expense' ? { ...a, expenseId: to.id } : null) : a).filter(Boolean);
  } else {
    data.allocations = (data.allocations || []).map(a => a.debtId === from.id ? (to.type === 'debt' ? { ...a, debtId: to.id } : null) : a).filter(Boolean);
  }
  Object.keys(data.bank.linkMemory || {}).forEach(k => {
    const m = data.bank.linkMemory[k];
    if(m.type === from.type && m.id === from.id) data.bank.linkMemory[k] = { type: to.type, id: to.id, count: m.count || 1 };
  });
  if(to.type === 'debt' && from.type === 'expense' && !to.item.dueDate){
    to.item.dueDate = todayISO().slice(0,8) + String(Math.min(28, from.item.dueDay||1)).padStart(2,'0');
  }
  if(from.type === 'expense') data.expenses = data.expenses.filter(x => x.id !== from.id);
  else data.debts = data.debts.filter(x => x.id !== from.id);
  sheet = null;
  saveData(); render();
  showToast(`Listo: "${from.name}" quedó unido a "${to.name}"` + (moved ? ` (${moved} pago${moved===1?'':'s'} pasaron)` : '') + '. Ya no se cuenta dos veces.');
}
function mergeDupe(did, eid){ mergeItems('e:'+eid, 'd:'+did); }

// =====================================================================
//  COBROS QUE SE REPITEN (suscripciones, pagos mensuales)
// =====================================================================
function detectRecurring(){
  const groups = {};
  bankList().forEach(t => {
    if(t.dir !== 'out' || t.category === 'ignore' || t.category === 'own' || t.category === 'trading') return;
    const k = merchantKey(t.desc);
    (groups[k] = groups[k] || []).push(t);
  });
  const out = [];
  Object.keys(groups).forEach(k => {
    const list = groups[k];
    const byMonth = {};
    list.forEach(t => { const mk = t.date.slice(0,7); (byMonth[mk] = byMonth[mk] || []).push(t); });
    const months = Object.keys(byMonth).sort();
    if(months.length < 2) return;
    if(months.some(m => byMonth[m].length > 2)) return; // compras frecuentes (gasolina, comida), no un cobro fijo
    if(months.filter(m => byMonth[m].length === 1).length < Math.ceil(months.length * 2/3)) return;
    const picks = months.map(m => byMonth[m].slice().sort((a,b) => b.amount - a.amount)[0]);
    const amts = picks.map(p => p.amount).sort((a,b) => a-b);
    const med = amts[Math.floor(amts.length/2)];
    if(!picks.every(p => Math.abs(p.amount - med) <= Math.max(1, med*0.2))) return;
    const days = picks.map(p => +p.date.slice(8,10));
    if(Math.max(...days) - Math.min(...days) > 7) return;
    const last = picks[picks.length-1];
    const tracked = data.expenses.some(e => nameMatches(last.desc, e.name)) || data.debts.some(d => nameMatches(last.desc, d.name));
    out.push({
      key: k, name: niceName(k), amount: med,
      day: Math.round(days.reduce((a,b)=>a+b,0) / days.length),
      months: months.length, last: last.date, tracked, category: last.category
    });
  });
  return out.sort((a,b) => b.amount - a.amount);
}
function addRecurringAsExpense(key){
  const r = detectRecurring().find(x => x.key === key);
  if(!r) return;
  data.expenses.push({ id:'e'+Date.now(), name: r.name, amount: Math.round(r.amount*100)/100, dueDay: Math.min(28, Math.max(1, r.day)) });
  upsertRule(key, 'out', 'fixed');
  bankList().forEach(t => { if(t.dir === 'out' && merchantKey(t.desc) === key && t.auto !== 'manual-set' && t.auto !== 'manual') { t.category = 'fixed'; t.auto = 'rule'; } });
  saveData(); render();
  showToast(`"${r.name}" quedó como gasto fijo de ${fmtMoney(r.amount)} al mes`);
}

function currentMonthKey(){ return todayISO().slice(0,7); }
function monthKeysWithData(){
  const set = new Set();
  data.incomes.forEach(i => i.date && set.add(i.date.slice(0,7)));
  data.hormiga.forEach(h => h.date && set.add(h.date.slice(0,7)));
  bankList().forEach(t => set.add(t.date.slice(0,7)));
  return Array.from(set).sort().reverse();
}
function monthSummary(mk){
  const [y, m] = mk.split('-').map(Number);
  const s = new Date(y, m-1, 1);
  const e = new Date(y, m, 0, 23, 59, 59, 999);
  const income = sumInRange(allIncomes(), s, e);
  const spend = spendingByCategory(s, e);
  const totalOut = SPEND_CATS.reduce((a,c) => a + spend[c], 0);
  return {
    mk, s, e, label: capFirst(s.toLocaleDateString('es-ES', {month:'long', year:'numeric'})),
    income, spend, totalOut, net: income - totalOut,
    sources: incomeBySource(s, e), merchants: topMerchants(s, e, 5), trading: tradingSummary(s, e)
  };
}

    }

  // Navegador normal: descarga clásica

  return true;
}

// Resumen para pasarle a Claude: últimos 3 meses + todos los movimientos de ese periodo.
function buildSummaryText(){
  const lines = [];
  const now = new Date();
  lines.push('# Resumen de Control Financiero');
  lines.push('Generado: ' + now.toLocaleString('es-ES'));
  lines.push('');
  const c = computeAll();
  lines.push('## Situación actual');
  lines.push(`- Saldo actual (lo que tengo): ${fmtMoney(c.currentBalance)}`);
  lines.push(`- Meta ${PL().adj} promedio (deudas + gastos fijos): ${fmtMoney(c.weeklyTarget)}`);
  lines.push(`- Total mensual comprometido: ${fmtMoney(c.monthlyTotal)}`);
  lines.push(`- Deuda total: ${fmtMoney(c.totalDebt)}`);
  lines.push(`- ${capFirst(PL().art)}: ingresé ${fmtMoney(c.incomeThisWeek)}, gasté ${fmtMoney(c.hormigaThisWeek + c.gastoThisWeek)} (hormiga ${fmtMoney(c.hormigaThisWeek)}), me falta ${fmtMoney(Math.max(c.shortfall,0))}`);
  lines.push('');
  for(let i=0; i<3; i++){
    const b = monthBounds(-i);
    const mk = b.s.getFullYear() + '-' + String(b.s.getMonth()+1).padStart(2,'0');
    const ms = monthSummary(mk);
    lines.push(`## ${ms.label}${i===0?' (mes en curso)':''}`);
    lines.push(`- Ingresos: ${fmtMoney(ms.income)}`);
    ms.sources.forEach(src => lines.push(`  - ${src.name}: ${fmtMoney(src.total)} (${src.count})`));
    lines.push(`- Gastos: ${fmtMoney(ms.totalOut)}`);
    SPEND_CATS.forEach(cat => lines.push(`  - ${BANK_CATS[cat].label}: ${fmtMoney(ms.spend[cat])}`));
    lines.push(`- Neto: ${fmtMoney(ms.net)}`);
    if(ms.merchants.length) lines.push('- Donde más gasté: ' + ms.merchants.map(m => `${niceName(m.key)} ${fmtMoney(m.total)}`).join(', '));
    lines.push('');
  }
  lines.push('## Deudas');
  if(data.debts.length) data.debts.forEach(d => lines.push(`- ${d.name}: saldo ${fmtMoney(d.balance)}, pago ${fmtMoney(d.monthlyPayment)}/mes${d.rate?`, ${d.rate}% interés`:''}${d.dueDate?`, vence ${d.dueDate}`:''}`));
  else lines.push('- Ninguna');
  lines.push('');
  lines.push('## Gastos fijos mensuales');
  if(data.expenses.length) data.expenses.forEach(e => lines.push(`- ${e.name}: ${fmtMoney(e.amount)} el día ${e.dueDay}`));
  else lines.push('- Ninguno');
  lines.push('');
  const rec = detectRecurring();
  lines.push('## Cobros que se repiten (detectados en el banco)');
  if(rec.length) rec.forEach(r => lines.push(`- ${r.name}: ~${fmtMoney(r.amount)} cerca del día ${r.day} (${r.months} meses)${r.tracked?' — ya está como gasto fijo/deuda':''}`));
  else lines.push('- Ninguno detectado todavía');
  lines.push('');
  const pendingLoans = data.loans.filter(l => !l.returned);
  lines.push('## Préstamos que me deben');
  if(pendingLoans.length) pendingLoans.forEach(l => lines.push(`- ${l.person}: ${fmtMoney(l.amount)} desde ${l.date}`));
  else lines.push('- Ninguno');
  lines.push('');
  lines.push(`## Ahorro\n- Fondo de emergencia: ${fmtMoney(savingsTotal('emergency'))}\n- Inversiones: ${fmtMoney(savingsTotal('investments'))}`);
  lines.push('');
  // Movimientos de los últimos ~3 meses
  const since = monthBounds(-2).s;
  const rows = [];
  data.incomes.forEach(i => rows.push([i.date, i.source || 'Ingreso', i.amount, 'Ingreso', 'a mano']));
  data.hormiga.forEach(h => rows.push([h.date, h.desc || 'Gasto hormiga', -h.amount, 'Gasto hormiga', 'a mano']));
  bankList().forEach(t => rows.push([t.date, t.desc, t.dir==='out' ? -t.amount : t.amount, BANK_CATS[t.category] ? BANK_CATS[t.category].label : t.category, 'banco']));
  const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : String(v);
  lines.push('## Movimientos (desde ' + since.toLocaleDateString('es-ES') + ')');
  lines.push('```csv');
  lines.push('fecha,descripcion,monto,categoria,origen');
  rows.filter(r => new Date(r[0]+'T00:00:00') >= since)
      .sort((a,b) => b[0].localeCompare(a[0]))
      .forEach(r => lines.push([r[0], csvCell(r[1]), Number(r[2]).toFixed(2), csvCell(r[3]), r[4]].join(',')));
  lines.push('```');
  return lines.join('\n');
}
function exportSummary(){
  saveTextFile(`resumen-financiero-${todayISO()}.md`, 'text/markdown', buildSummaryText());
}

function scheduleNativeReminders(){
  if(typeof previewMode !== 'undefined' && previewMode) return;
  pushWidget();
  if(!(window.Android && Android.scheduleReminders)) return;
  const now = Date.now();
  const today = new Date(); today.setHours(0,0,0,0);
  const items = [];
  const push = (name, amount, due) => {
    [2, 0].forEach(off => {
      const at = new Date(due); at.setDate(at.getDate() - off); at.setHours(9, 0, 0, 0);
      if(at.getTime() <= now || at.getTime() - now > 35*86400000) return;
      items.push({
        title: off ? `En ${off} días vence: ${name}` : `Hoy vence: ${name}`,
        text: `${fmtMoney(amount || 0)} · Control Financiero`,
        at: at.getTime()
      });
    });
  };
  occurrencesInRange(today, addDays(today, 36)).forEach(o => { if(o.remaining > 0.004) push(o.name, o.remaining, o.date); });
  data.loans.forEach(l => { if(l.due && !l.returned){ const dd = isoToDate(l.due); if(dd >= today) push(`${l.person} te paga el préstamo`, l.amount - loanRepaid(l), dd); } });
  try{ Android.scheduleReminders(JSON.stringify(items.slice(0, 60))); }catch(e){}
}

// =====================================================================
//  CALENDARIO DE PAGOS (gastos fijos mensuales/semanales, deudas,
//  pagos programados) + PAGOS CONECTADOS A DEUDAS Y GASTOS FIJOS
// =====================================================================
const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function dayISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isoToDate(iso){ return new Date(iso+'T00:00:00'); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function expenseFreq(e){ return e.freq === 'week' ? 'week' : 'month'; }
function expenseMonthly(e){ return expenseFreq(e) === 'week' ? (e.amount||0) * 4.345 : (e.amount||0); }
function expenseWhen(e){
  return expenseFreq(e) === 'week' ? `Cada ${WEEKDAYS[e.weekday ?? 5]}` : `Día ${e.dueDay} de cada mes`;
}
function monthPeriod(d){
  return { s: new Date(d.getFullYear(), d.getMonth(), 1), e: new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59,999),
           key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') };
}
function weekPeriod(d){
  const s = startOfWeek(d);
  const e = addDays(s, 6); e.setHours(23,59,59,999);
  return { s, e, key: dayISO(s) };
}

// ---- Pagos conectados ----
function linkedTxs(type, id){
  return bankList().filter(t => t.link && t.link.type === type && t.link.id === id && t.dir === 'out');
}
function allocations(){ return data.allocations || (data.allocations = []); }
// Lo pagado a un gasto fijo dentro de un periodo (sin contar lo que se pasó a una deuda).
function expensePaid(eid, s, e, before){
  let paid = 0;
  linkedTxs('expense', eid).forEach(t => {
    const d = isoToDate(t.date);
    if(d >= s && d <= e && (!before || d < before)) paid += t.amount;
  });
  allocations().forEach(a => {
    if(a.expenseId !== eid) return;
    const d = isoToDate(a.periodDate);
    if(d >= s && d <= e) paid -= a.amount;
  });
  return Math.max(0, paid);
}
function debtPaidIn(did, s, e, before){
  let paid = 0;
  linkedTxs('debt', did).forEach(t => {
    const d = isoToDate(t.date);
    if(d >= s && d <= e && (!before || d < before)) paid += t.amount;
  });
  allocations().forEach(a => {
    if(a.debtId !== did) return;
    const d = isoToDate(a.date);
    if(d >= s && d <= e && (!before || d < before)) paid += a.amount;
  });
  return paid;
}
function debtPayments(did){
  const list = linkedTxs('debt', did).map(t => ({ date:t.date, amount:t.amount, label: displayName(t), kind:'tx', id:t.id }));
  allocations().filter(a => a.debtId === did).forEach(a => {
    const e = data.expenses.find(x => x.id === a.expenseId);
    list.push({ date:a.date, amount:a.amount, label:'Sobrante de ' + (e ? e.name : 'gasto fijo'), kind:'alloc', id:a.id });
  });
  return list.sort((a,b) => b.date.localeCompare(a.date));
}

// Conecta un movimiento del banco a una deuda o gasto fijo. A una deuda le resta el monto del saldo.
// Fecha en que registraste una deuda (sale del id). Los pagos anteriores ya estaban descontados del saldo que escribiste.
function debtCreated(d){
  if(d.createdAt) return d.createdAt;
  const m = /^d(\d{12,})$/.exec(d.id || '');
  return m ? dayISO(new Date(+m[1])) : null;
}
function linkTx(t, type, id, force){
  unlinkTx(t);
  let applied = false;
  if(type === 'debt'){
    const d = data.debts.find(x => x.id === id);
    if(!d) return;
    const created = debtCreated(d);
    applied = !!force || !created || t.date >= created;
    if(applied) d.balance = Math.round(((d.balance||0) - t.amount) * 100) / 100;
    t.category = 'debt';
  } else {
    if(!data.expenses.find(x => x.id === id)) return;
    t.category = 'fixed';
  }
  t.link = { type, id, applied };
  t.reviewed = true;
  t.auto = t.auto === 'manual' ? 'manual' : 'manual-set';
}
function unlinkTx(t){
  if(!t.link) return;
  if(t.link.type === 'debt' && t.link.applied !== false){
    const d = data.debts.find(x => x.id === t.link.id);
    if(d) d.balance = Math.round(((d.balance||0) + t.amount) * 100) / 100;
  }
  delete t.link;
}
function removeAllocation(id){
  const a = allocations().find(x => x.id === id);
  if(!a) return;
  const d = data.debts.find(x => x.id === a.debtId);
  if(d) d.balance = Math.round(((d.balance||0) + a.amount) * 100) / 100;
  data.allocations = allocations().filter(x => x.id !== id);
  saveData(); render();
  showToast('Se quitó ese abono de la deuda');
}
function allocateExcess(expenseId, periodDate, debtId, amount){
  const d = data.debts.find(x => x.id === debtId);
  if(!d || !(amount > 0)) return;
  allocations().push({ id:'a'+Date.now(), date: todayISO(), periodDate, expenseId, debtId, amount: Math.round(amount*100)/100 });
  d.balance = Math.round(((d.balance||0) - amount) * 100) / 100;
  sheet = null;
  saveData(); render();
  showToast(`Se abonaron ${fmtMoney(amount)} a "${d.name}". Ahora debes ${fmtMoney(Math.max(0, d.balance))}`);
}

// ---- Fechas de pago en un rango ----
// Devuelve cada pago (gasto fijo, cuota de deuda o pago programado) con lo pagado y lo que falta.
// "paidBefore": si se da, solo cuenta lo pagado antes de esa fecha.
function occurrencesInRange(s, e, paidBefore){
  const out = [];
  const shifts = data.shifts || {};
  const push = (o) => {
    o.date = shifts[o.key] ? isoToDate(shifts[o.key]) : o.baseDate;
    o.shifted = !!shifts[o.key];
    if(o.date >= s && o.date <= e) out.push(o);
  };
  // Meses y semanas a revisar (con margen, por si un pago se movió de fecha)
  const from = addDays(s, -40), to = addDays(e, 40);
  const months = [];
  for(let d = new Date(from.getFullYear(), from.getMonth(), 1); d <= to; d = new Date(d.getFullYear(), d.getMonth()+1, 1)) months.push(new Date(d));
  const weeks = [];
  for(let d = startOfWeek(from); d <= to; d = addDays(d, 7)) weeks.push(new Date(d));

  data.expenses.forEach(ex => {
    if(expenseFreq(ex) === 'week'){
      const wd = ex.weekday ?? 5;
      weeks.forEach(ws => {
        const base = addDays(ws, (wd + 6) % 7); // la semana empieza el lunes
        const p = weekPeriod(base);
        push({ key:`e:${ex.id}:${p.key}`, kind:'expense', refId:ex.id, name:ex.name, amount:ex.amount||0, baseDate:base, period:p });
      });
    } else {
      months.forEach(m => {
        const last = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
        const base = new Date(m.getFullYear(), m.getMonth(), Math.min(ex.dueDay||1, last));
        const p = monthPeriod(base);
        push({ key:`e:${ex.id}:${p.key}`, kind:'expense', refId:ex.id, name:ex.name, amount:ex.amount||0, baseDate:base, period:p });
      });
    }
  });
  data.debts.forEach(dt => {
    if(dt.dueDate && (dt.monthlyPayment||0) > 0){
      const day = isoToDate(dt.dueDate).getDate();
      months.forEach(m => {
        const last = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
        const base = new Date(m.getFullYear(), m.getMonth(), Math.min(day, last));
        const p = monthPeriod(base);
        push({ key:`d:${dt.id}:${p.key}`, kind:'debt', refId:dt.id, name:dt.name, amount:dt.monthlyPayment, baseDate:base, period:p });
      });
    }
    (dt.schedule || []).forEach(sc => {
      const base = isoToDate(sc.date);
      push({ key:`s:${dt.id}:${sc.id}`, kind:'debt', refId:dt.id, name:dt.name + ' (pago programado)', amount:sc.amount||0, baseDate:base, period:monthPeriod(base), scheduled:true });
    });
  });

  // Lo pagado: a los gastos fijos por periodo; a las deudas, se reparte en orden de fecha dentro del mes.
  const debtPool = {};
  out.sort((a,b) => a.date - b.date).forEach(o => {
    let paid;
    if(o.kind === 'expense') paid = expensePaid(o.refId, o.period.s, o.period.e, paidBefore);
    else {
      const k = o.refId + '|' + o.period.key;
      if(!(k in debtPool)) debtPool[k] = debtPaidIn(o.refId, o.period.s, o.period.e, paidBefore);
      paid = Math.min(o.amount, debtPool[k]);
      debtPool[k] -= paid;
    }
    o.paid = Math.min(paid, o.amount);
    o.remaining = Math.max(0, Math.round((o.amount - o.paid) * 100) / 100);
    o.overpaid = o.kind === 'expense' ? Math.max(0, Math.round((paid - o.amount) * 100) / 100) : 0;
    // Pagado casi completo (el banco cobró unos centavos/dólares distinto): cuenta como pagado.
    if(o.paid > 0 && o.remaining > 0 && o.remaining <= Math.min(5, Math.max(1, o.amount * 0.01))) o.remaining = 0;
    // Marcado como pagado a mano en "Ya lo pagué" (efectivo, otra cuenta, o lo que faltaba no se va a pagar).
    if((data.paidMarks || {})[o.key]) o.remaining = 0;
  });
  return out;
}

// ---- Mover un pago de fecha (solo esa vez) ----
function shiftPayment(key, iso){
  if(!data.shifts) data.shifts = {};
  if(iso) data.shifts[key] = iso; else delete data.shifts[key];
  sheet = null;
  saveData(); render();
  showToast(iso ? `Pago movido al ${fmtShortDate(iso)}. Todo se recalculó.` : 'El pago volvió a su fecha original');
}
function shiftBy(key, baseIso, days){
  shiftPayment(key, dayISO(addDays(isoToDate(baseIso), days)));
}

// ---- Pagos programados de una deuda (ej. los $500 de la orden) ----
function addScheduledPayment(debtId){
  const d = data.debts.find(x => x.id === debtId);
  const di = document.getElementById('sch-date-'+debtId), ai = document.getElementById('sch-amt-'+debtId);
  if(!d || !di || !ai || !di.value || !parseMoney(ai.value)) return;
  if(!d.schedule) d.schedule = [];
  d.schedule.push({ id:'sc'+Date.now(), date: di.value, amount: parseMoney(ai.value) });
  d.schedule.sort((a,b) => a.date.localeCompare(b.date));
  saveData(); render();
  showToast('Pago programado agregado, con aviso antes de la fecha');
}
function removeScheduledPayment(debtId, sid){
  const d = data.debts.find(x => x.id === debtId);
  if(!d) return;
  d.schedule = (d.schedule || []).filter(x => x.id !== sid);
  saveData(); render();
}

// =====================================================================
//  VENTANA DE ABAJO (hoja) — elegir deuda/gasto, mover fecha, ver semana…
// =====================================================================
let sheet = null; // {type:'link', txId, kind} | {type:'shift', key, baseIso, date, name} | {type:'week', idx} | {type:'source', name} | {type:'alloc', expenseId, periodDate, amount} | {type:'rename', txId}
function closeSheet(){ sheet = null; render(); }
function openLinkSheet(txId, kind){ sheet = { type:'link', txId, kind }; render(); }
// Conecta este pago y todos los del mismo comercio/persona que aún no estén conectados.
function chooseLink(txId, type, id, force){
  const t = bankList().find(x => x.id === txId);
  if(!t) return;
  linkTx(t, type, id, force);
  const gk = groupKeyOf(t);
  if(!data.bank.linkMemory) data.bank.linkMemory = {};
  const prev = data.bank.linkMemory[gk];
  data.bank.linkMemory[gk] = { type, id, count: prev && prev.type === type && prev.id === id ? (prev.count || 1) + 1 : 1 };
  let others = 0;
  bankList().forEach(o => {
    if(o === t || o.link || o.dir !== t.dir || groupKeyOf(o) !== gk || o.qDismissed) return;
    if(o.category === 'loan' || o.category === 'loanback' || o.category === 'own' || o.category === 'trading' || o.category === 'income') return;
    linkTx(o, type, id); others++;
  });
  upsertRule(merchantKey(t.desc), t.dir, type === 'debt' ? 'debt' : 'fixed');
  sheet = null;
  saveData(); render();
  const extra = others ? ` También conecté ${others} pago${others===1?'':'s'} más de "${displayName(t)}".` : '';
  if(type === 'debt'){
    const d = data.debts.find(x => x.id === id);
    const msg = t.link.applied ? `Se restaron ${fmtMoney(t.amount)} de "${d.name}". ` + (d.balance <= 0 ? '¡Esa deuda quedó en cero!' : `Ahora debes ${fmtMoney(d.balance)}.`)
      : `Conectado a "${d.name}". No se restó del saldo porque ese pago es de antes de que registraras la deuda.`;
    showToast(msg + extra);
  } else {
    const e = data.expenses.find(x => x.id === id);
    showToast(`Pago de ${fmtMoney(t.amount)} conectado a "${e.name}".` + extra + ' Los próximos se conectan solos.');
  }
}
// Al subir un extracto: los comercios que ya conectaste antes se conectan solos.
function autoLinkNew(txs){
  let n = 0;
  txs.forEach(t => {
    if(t.link || t.dir !== 'out' || t.auto === 'manual') return;
    const mem = (data.bank.linkMemory || {})[groupKeyOf(t)];
    if(!mem || (mem.count || 1) < 2) return; // todavía no está seguro: te pregunta
    const ok = mem.type === 'debt' ? data.debts.find(d => d.id === mem.id) : data.expenses.find(e => e.id === mem.id);
    if(!ok) return;
    linkTx(t, mem.type, mem.id); n++;
  });
  return n;
}
function createAndLink(txId, kind){
  const t = bankList().find(x => x.id === txId);
  const name = (document.getElementById('nl-name') || {}).value || '';
  const amt = parseMoney((document.getElementById('nl-amount') || {}).value);
  if(!t || !name.trim()) { showToast('Escribe un nombre'); return; }
  if(kind === 'debt'){
    const pay = parseMoney((document.getElementById('nl-pay') || {}).value);
    const id = 'd'+Date.now();
    data.debts.push({ id, name:name.trim(), balance: amt, rate:0, dueDate:'', monthlyPayment: pay, createdAt: todayISO() });
    chooseLink(txId, 'debt', id, true);
  } else {
    const freq = (document.getElementById('nl-freq') || {}).value === 'week' ? 'week' : 'month';
    const id = 'e'+Date.now();
    const d = isoToDate(t.date);
    data.expenses.push({ id, name:name.trim(), amount: amt || t.amount, freq, dueDay: d.getDate(), weekday: d.getDay() });
    chooseLink(txId, 'expense', id);
  }
}
function unlinkFromSheet(txId){
  const t = bankList().find(x => x.id === txId);
  if(t){ unlinkTx(t); t.linkAsked = true; }
  sheet = null; saveData(); render();
}

// =====================================================================
//  "YA LO PAGUÉ": elegir el movimiento del banco que pagó un pago pendiente
// =====================================================================
function markPaidCandidates(dateIso, amount, wide){
  const d0 = isoToDate(dateIso);
  const span = wide ? 25 : 12;
  return bankList()
    .filter(t => t.dir === 'out' && !t.link && t.category !== 'own' && t.category !== 'trading' && t.category !== 'loan'
      && Math.abs((isoToDate(t.date) - d0) / 86400000) <= span)
    .map(t => ({ t, score: Math.abs(t.amount - amount) / Math.max(1, amount) * 3 + Math.abs((isoToDate(t.date) - d0) / 86400000) / span }))
    .sort((a,b) => a.score - b.score)
    .slice(0, wide ? 40 : 8)
    .map(x => x.t);
}
function markPaidLinked(u){
  const d0 = isoToDate(u.date);
  return bankList().filter(t => t.link && t.link.id === u.refId && t.link.type === (u.kind === 'debt' ? 'debt' : 'expense')
    && Math.abs((isoToDate(t.date) - d0) / 86400000) <= 25).sort((a,b) => b.date.localeCompare(a.date));
}
function markPaidManual(){
  if(!sheet || sheet.type !== 'markpaid') return;
  const u = sheet.u;
  if(!data.paidMarks) data.paidMarks = {};
  data.paidMarks[u.key] = todayISO();
  sheet = null; saveData(); render();
  showToast(`"${u.name}" quedó como pagado.`);
}
function unmarkPaid(key){
  if(data.paidMarks) delete data.paidMarks[key];
  saveData(); render();
}
function openMarkPaid(u){ sheet = { type:'markpaid', u, wide:false }; render(); }
function chooseMarkPaid(txId){
  if(!sheet || sheet.type !== 'markpaid') return;
  const u = sheet.u;
  chooseLink(txId, u.kind === 'debt' ? 'debt' : 'expense', u.refId);
}

// =====================================================================
//  PRÉSTAMOS DESDE EL BANCO (le prestaste a alguien)
// =====================================================================
function loanPersonName(t){
  return displayName(t).replace(/^Zelle\s+/i, '') || 'Préstamo';
}
function createLoanFromTx(t){
  if(t.loanId && data.loans.find(l => l.id === t.loanId)) return;
  const id = 'l' + Date.now() + Math.floor(Math.random()*1000);
  data.loans.push({ id, person: loanPersonName(t), amount: t.amount, date: t.date, note:'Desde el banco', returned:false,
                    fromBank:true, txId: t.id, personKey: merchantKey(t.desc), due:'', repayments:[] });
  t.loanId = id;
}
function removeLoanFromTx(t){
  if(!t.loanId) return;
  data.loans = data.loans.filter(l => !(l.id === t.loanId && l.fromBank));
  delete t.loanId;
}
function loanRepaid(l){ return (l.repayments || []).reduce((s,r) => s + r.amount, 0); }
function applyRepayment(t, loanId){
  const l = data.loans.find(x => x.id === loanId);
  if(!l) return;
  removeRepayment(t);
  l.repayments = l.repayments || [];
  const left = Math.max(0, l.amount - loanRepaid(l));
  l.repayments.push({ txId: t.id, amount: Math.min(t.amount, left || t.amount), date: t.date });
  t.loanId = loanId;
  if(loanRepaid(l) >= l.amount - 0.009) l.returned = true;
  sheet = null;
  showToast(l.returned ? `${l.person} terminó de pagarte el préstamo ✓` : `${l.person} te abonó ${fmtMoney(t.amount)}. Le faltan ${fmtMoney(l.amount - loanRepaid(l))}.`);
}
function removeRepayment(t){
  if(!t.loanId) return;
  const l = data.loans.find(x => x.id === t.loanId);
  if(l && l.repayments){
    l.repayments = l.repayments.filter(r => r.txId !== t.id);
    if(loanRepaid(l) < l.amount - 0.009) l.returned = false;
  }
  delete t.loanId;
}
function setLoanDue(loanId, iso){
  const l = data.loans.find(x => x.id === loanId);
  if(!l) return;
  l.due = iso || '';
  sheet = null;
  saveData(); render();
  showToast(iso ? `Listo: te aviso 2 días antes y el ${fmtShortDate(iso)}, el día que ${l.person} te tiene que pagar` : 'Préstamo guardado sin fecha');
}
function pickLoanForRepayment(txId, loanId){
  const t = bankList().find(x => x.id === txId);
  if(!t) return;
  t.category = 'loanback'; t.reviewed = true;
  applyRepayment(t, loanId);
  saveData(); render();
}

function barPath(x, y, w, h, r){
  if(h <= 0) return '';
  r = Math.min(r, h, w/2);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
function renderWeeklyChartCard(){
  const weeks = weeklySeries(8);
  const any = weeks.some(w => w.income > 0 || w.spend > 0);
  let html = `<div class="card">
    <div class="card-head"><div><p class="card-title">Ingresos vs gastos</p><p class="card-sub">Últimas 8 semanas · toca una semana</p></div></div>`;
  if(!any) return html + `<p class="empty-chart">Aún no hay movimientos para comparar.</p></div>`;
  const W = 340, H = 170, L = 34, R = 4, T = 8, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max(...weeks.map(w => Math.max(w.income, w.spend))));
  const gw = pw / weeks.length;
  const bw = Math.min(14, (gw - 10) / 2);
  const sel = (chartWeekSel === null || chartWeekSel >= weeks.length) ? weeks.length - 1 : chartWeekSel;
  let svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por semana">`;
  [0, 0.5, 1].forEach(f => {
    const y = T + ph - f*ph;
    svg += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    svg += `<text x="${L-6}" y="${y+3}" text-anchor="end">${shortMoney(max*f)}</text>`;
  });
  weeks.forEach((w, i) => {
    const gx = L + i*gw;
    if(i === sel) svg += `<rect x="${gx+1}" y="${T}" width="${gw-2}" height="${ph}" rx="6" fill="rgba(255,255,255,.05)"/>`;
    const cx = gx + gw/2;
    const hi = w.income / max * ph, hs = w.spend / max * ph;
    svg += `<path d="${barPath(cx - bw - 1, T + ph - hi, bw, hi, 4)}" fill="var(--s3)"/>`;
    svg += `<path d="${barPath(cx + 1, T + ph - hs, bw, hs, 4)}" fill="var(--s2)"/>`;
    svg += `<text x="${cx}" y="${H-8}" text-anchor="middle">${w.ws.getDate()}/${w.ws.getMonth()+1}</text>`;
    svg += `<rect x="${gx}" y="0" width="${gw}" height="${H}" fill="transparent" style="cursor:pointer" onclick="selectChartWeek(${i})"/>`;
  });
  svg += `</svg>`;
  const s = weeks[sel];
  const range = `${s.ws.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${s.we.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;
  html += `<div class="legend"><span><i class="dot" style="background:var(--s3)"></i>Ingresos</span><span><i class="dot" style="background:var(--s2)"></i>Gastos (hormiga + otros)</span></div>`;
  html += svg;
  html += `<div class="chart-tip"><span>${range}</span><span>Entró <b>${fmtMoney(s.income)}</b> · salió <b>${fmtMoney(s.spend)}</b></span></div>`;
  return html + `</div>`;
}

// ------------------------------------------------- listas por mes (solo el mes actual a la vista)
function monthGroupedList(listKey, items, rowFn, emptyText, amountFn){
  const groups = groupByMonth(items.slice().sort((a,b) => new Date(b.date) - new Date(a.date)), amountFn);
  const cur = currentMonthKey();
  const current = groups.filter(g => g.key === cur);
  const older = groups.filter(g => g.key !== cur);
  let html = '';
  if(current.length){
    const g = current[0];
    html += `<div class="month-header" style="cursor:default;"><span>${g.label}</span><span class="amt">${fmtMoney(g.total)}</span></div>`;
    html += g.items.map(rowFn).join('');
  } else {
    html += `<div class="empty-note" style="padding-top:0;">${emptyText}</div>`;
  }
  if(older.length){
    if(showOlder[listKey]){
      html += older.map(g => {
        const open = isMonthOpen(listKey, g.key, false);
        return `<div class="month-header" onclick="toggleMonth('${listKey}','${g.key}')"><span>${g.label}</span><span class="amt">${fmtMoney(g.total)} <span class="chevron ${open?'open':''}">›</span></span></div>
          ${open ? g.items.map(rowFn).join('') : ''}`;
      }).join('');
      html += `<button class="card-link" style="margin-top:6px;" onclick="toggleOlder('${listKey}')">Ocultar meses anteriores</button>`;
    } else {
      html += `<button class="card-link" style="margin-top:6px;" onclick="toggleOlder('${listKey}')">Ver meses anteriores (${older.length}) ›</button>`;
    }
  }
  return html;
}
function toggleOlder(k){ showOlder[k] = !showOlder[k]; render(); }

  const row = (e, i) => {
    const per = expenseFreq(e) === 'week' ? weekPeriod(today) : monthPeriod(today);
    const occ = occurrencesInRange(per.s, per.e).find(o => o.refId === e.id && o.kind === 'expense');
    const paid = occ ? occ.paid : 0, over = occ ? occ.overpaid : 0;
    const left = occ ? occ.remaining : (e.amount||0);
    const perName = expenseFreq(e) === 'week' ? 'Esta semana' : 'Este mes';
    return `<div class="item-row ${i===0?'list-first':''}" style="align-items:flex-start;">
        <div class="item-main clickable" onclick="startEdit('expenses','${e.id}')">
          <div class="item-name">${escapeAttr(e.name)}</div>
          <div class="item-meta">${expenseWhen(e)} · <span class="link-inline" onclick="event.stopPropagation(); sheet={type:'mergeInto', ref:'e:${e.id}'};render()">Unir con…</span></div>
          <div class="item-meta" style="color:${left<=0.004?'var(--good)':'var(--ink-dim)'};">${perName}: pagado ${fmtMoney(paid)} de ${fmtMoney(e.amount||0)}${left>0.004?` · faltan ${fmtMoney(left)}`:' ✓'}</div>
          ${over > 0.004 ? `<button class="card-link" style="font-size:12.5px;padding:4px 0 0 0;" onclick="event.stopPropagation(); sheet={type:'alloc', expenseId:'${e.id}', periodDate:'${dayISO(occ.baseDate)}', amount:${over}};render()">Pagaste ${fmtMoney(over)} de más → Agregar a deuda</button>` : ''}
        </div>
        <div class="item-amounts">
          <div class="item-amount">${fmtMoney(e.amount)}/${expenseFreq(e)==='week'?'sem':'mes'}</div>
          <div class="item-weekly">${expenseFreq(e)==='week' ? fmtMoney(expenseMonthly(e))+'/mes' : fmtMoney((e.amount||0)/4.345)+'/sem'}</div>
        </div>
        ${deleteControl('expenses', e.id)}
      </div>`;
  };
  const ef = editingExpense ? expenseFreq(editingExpense) : 'month';
  return `
    ${data.expenses.length ? data.expenses.map(row).join('') : '<div class="empty-note" style="padding-top:0;">Sin gastos fijos registrados.</div>'}
    ${(formOpen['expenses'] || !!editingExpense) ? `
    <div class="add-form" id="edit-anchor-expenses">
      <div class="field"><label>Nombre</label><input type="text" id="exp-name" placeholder="Ej: Ethan, renta, T-Mobile" value="${editingExpense?escapeAttr(editingExpense.name):''}"></div>
      <div class="field-row">
        <div class="field"><label>Monto</label><input type="text" inputmode="decimal" id="exp-amount" placeholder="0.00" value="${editingExpense?editingExpense.amount:''}"></div>
        <div class="field"><label>¿Cada cuánto?</label>
          <select id="exp-freq" onchange="document.getElementById('exp-day-wrap').style.display=this.value==='week'?'none':'flex';document.getElementById('exp-wd-wrap').style.display=this.value==='week'?'flex':'none';">
            <option value="month" ${ef==='month'?'selected':''}>Cada mes</option>
            <option value="week" ${ef==='week'?'selected':''}>Cada semana</option>
          </select></div>
      </div>
      <div class="field" id="exp-day-wrap" style="display:${ef==='week'?'none':'flex'};"><label>Día del mes que vence</label><input type="number" id="exp-day" min="1" max="31" placeholder="1-31" value="${editingExpense?editingExpense.dueDay:''}"></div>
      <div class="field" id="exp-wd-wrap" style="display:${ef==='week'?'flex':'none'};"><label>Día de la semana</label>
        <select id="exp-weekday">${WEEKDAYS.map((w,k) => `<option value="${k}" ${(editingExpense ? (editingExpense.weekday ?? 5) : 5)===k?'selected':''}>${capFirst(w)}</option>`).join('')}</select></div>
      <div class="field-row">
        <button class="btn btn-primary" onclick="submitExpense()">${editingExpense?'Guardar cambios':'Añadir gasto'}</button>
        <button class="btn" onclick="${editingExpense?'cancelEdit()':"toggleFormOpen('expenses')"}">Cancelar</button>
      </div>
    </div>` : `<button class="add-toggle-btn" id="edit-anchor-expenses" onclick="toggleFormOpen('expenses')">+ Añadir gasto fijo</button>`}
    <p class="item-meta" style="margin-top:12px;">Los pagos del banco que marques como "Gasto fijo" se conectan aquí. La app te avisa 2 días antes y el mismo día de cada vencimiento.</p>`;
}

function recurringBody(rec){
  if(!bankList().length) return `<p class="empty-chart">Cuando subas extractos de al menos 2 meses, aquí aparecen solos los cobros que se repiten cada mes (suscripciones, seguros, planes de celular…).</p>
    <button class="btn btn-primary btn-block" onclick="setTab('import')">Subir extractos</button>`;
  if(!rec.length) return `<p class="empty-chart">Todavía no detecto cobros que se repitan. Necesito ver el mismo cobro en al menos 2 meses distintos.</p>`;
  const yearly = rec.filter(r => !r.tracked).reduce((a,r) => a + r.amount*12, 0);
  return `
    <p class="item-meta" style="margin:0 0 10px 0;">Cobros que aparecen todos los meses en tu banco.${yearly ? ` Los que no tienes anotados suman unos <b style="color:var(--ink);">${fmtMoney(yearly)}</b> al año — revisa si alguno se puede cancelar.` : ''}</p>
    ${rec.map((r,i) => `
      <div class="item-row ${i===0?'list-first':''}">
        <div class="item-main">
          <div class="item-name">${escapeAttr(r.name)}</div>
          <div class="item-meta">Cerca del día ${r.day} · visto en ${r.months} meses · último ${fmtShortDate(r.last)}</div>
          ${r.tracked ? `<div class="item-meta note-good">Ya está en tus gastos fijos o deudas</div>` : `<button class="card-link" style="font-size:12.5px;padding:4px 0 0 0;" onclick="addRecurringAsExpense('${escapeAttr(r.key)}')">+ Agregar como gasto fijo</button>`}
        </div>
        <div class="item-amounts"><div class="item-amount">${fmtMoney(r.amount)}</div><div class="item-weekly">al mes</div></div>
      </div>`).join('')}`;
}

function renderMoreTab(c){
  let html = '';

  html += renderSection('savings', 'Ahorro', '', `
    <div class="tab-row">
      <button class="tab-btn ${savingsTab==='emergency'?'active':''}" onclick="setSavingsTab('emergency')">Fondo de emergencia</button>
      <button class="tab-btn ${savingsTab==='investments'?'active':''}" onclick="setSavingsTab('investments')">Inversiones</button>
    </div>
    ${renderSavingsTab(savingsTab)}`);

  // Estadísticas
  const pastWeeksForStats = pastWeeksHistory(12);
  const allWeeksForAvg = [{income:c.incomeThisWeek, hormiga:c.hormigaThisWeek}, ...pastWeeksForStats.map(w=>({income:w.income, hormiga:w.hormiga}))];
  const avgIncome = allWeeksForAvg.reduce((s,w)=>s+w.income,0)/allWeeksForAvg.length;
  const avgHormiga = allWeeksForAvg.reduce((s,w)=>s+w.hormiga,0)/allWeeksForAvg.length;
  const totalPaidDebts = (data.history.paidDebts||[]).reduce((s,p)=>s+(p.balance||0),0);
  const totalLoansOut = data.loans.filter(l=>!l.returned).reduce((s,l)=>s+(l.amount||0),0);
  const totalSavings = savingsTotal('emergency') + savingsTotal('investments');
  const statRow = (name, val, color, meta) => `<div class="item-row"><div class="item-main"><div class="item-name">${name}</div>${meta?`<div class="item-meta">${meta}</div>`:''}</div><div class="item-amounts"><span class="item-amount" style="${color?'color:'+color+';':''}">${val}</span></div></div>`;
  html += renderSection('stats', 'Estadísticas', '', `<div class="stat-list">
    ${statRow('Ingreso ' + PL().adj + ' promedio', fmtMoney(avgIncome), '', `Últimas ${allWeeksForAvg.length} ${PL().plural} con datos`)}
    ${statRow('Gasto hormiga ' + PL().adj + ' promedio', fmtMoney(avgHormiga))}
    ${statRow('Deuda saldada hasta ahora', fmtMoney(totalPaidDebts), 'var(--good)')}
    ${statRow('Deuda pendiente', fmtMoney(c.totalDebt), 'var(--warn)')}
    ${statRow('Prestado sin devolver', fmtMoney(totalLoansOut))}
    ${statRow('Ahorro total (fondo + inversiones)', fmtMoney(totalSavings), 'var(--good)')}

  // Resumen por rango
  const rangeSummary = computeRangeSummary();
  const rangeCount = rangeSummary ? (rangeSummary.incomes.length + rangeSummary.hormiga.length + rangeSummary.gastos.length + rangeSummary.loans.length + rangeSummary.dueItems.length) : '';
  html += renderSection('range', 'Resumen por rango de fechas', rangeCount, `
    <div class="field-row" style="padding-top:4px;margin-bottom:8px;">
      <div class="field"><label>Desde</label><input type="date" value="${rangeStart||''}" onchange="setRangeStart(this.value)"></div>
      <div class="field"><label>Hasta</label><input type="date" value="${rangeEnd||''}" onchange="setRangeEnd(this.value)"></div>
    </div>
    ${renderRangeSummary(rangeSummary)}`);

  // Historial: meses anteriores + semanas + deudas saldadas
  const cur = currentMonthKey();
  const months = monthKeysWithData().filter(mk => mk !== cur);
  const pastWeeks = pastWeeksHistory(12);
  const paidDebts = (data.history && data.history.paidDebts) || [];
  const fmtRange = (s,e) => `${s.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${e.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}`;
  html += `<div id="history-anchor"></div>` + renderSection('history', 'Historial', months.length + pastWeeks.length + paidDebts.length, `
    <p class="sub-head" style="margin-top:0;">Meses anteriores</p>
    ${months.length ? months.map(mk => {
      const ms = monthSummary(mk);
      const open = isMonthOpen('hist-months', mk, false);
      return `<div class="month-header" style="border-top:1px solid var(--line);padding-top:10px;" onclick="toggleMonth('hist-months','${mk}')">
          <span>${ms.label}</span>
          <span class="amt" style="color:${ms.net<0?'var(--warn)':'var(--good)'};">${fmtMoney(ms.net)} <span class="chevron ${open?'open':''}">›</span></span>
        </div>
        ${open ? `
          <div class="item-row" style="border-top:none;"><div class="item-main"><div class="item-name">Ingresos</div></div><span class="item-amount in">${fmtMoney(ms.income)}</span></div>
          ${ms.sources.map(s => `<div class="item-row" style="padding:6px 0 6px 12px;"><div class="item-main"><div class="item-meta" style="margin:0;">${escapeAttr(s.name)}</div></div><span class="item-meta" style="margin:0;font-family:var(--mono);">${fmtMoney(s.total)}</span></div>`).join('')}
          <div class="item-row"><div class="item-main"><div class="item-name">Gastos</div></div><span class="item-amount">${fmtMoney(ms.totalOut)}</span></div>
          ${SPEND_CATS.filter(k => ms.spend[k] > 0).map(k => `<div class="item-row" style="padding:6px 0 6px 12px;"><div class="item-main"><div class="item-meta" style="margin:0;">${BANK_CATS[k].label}</div></div><span class="item-meta" style="margin:0;font-family:var(--mono);">${fmtMoney(ms.spend[k])}</span></div>`).join('')}
          ${ms.merchants.length ? `<p class="item-meta" style="margin:8px 0 10px 0;">Donde más gastaste: ${ms.merchants.map(m => escapeAttr(niceName(m.key)) + ' ' + fmtMoney(m.total)).join(' · ')}</p>` : ''}
          ${ms.trading && ms.trading.any ? `<p class="item-meta" style="margin:0 0 10px 0;">Trading (aparte): depositaste ${fmtMoney(ms.trading.dep)}, retiraste ${fmtMoney(ms.trading.wd)} → <b style="color:${ms.trading.net<0?'var(--warn)':'var(--good)'};">${ms.trading.net<0?'-':'+'}${fmtMoney(Math.abs(ms.trading.net))}</b></p>` : ''}

    <p class="sub-head">${capFirst(PL().plural)} anteriores</p>
    ${pastWeeks.length ? pastWeeks.map(w=>`
      <div class="item-row">
        <div class="item-main">
          <div class="item-name">${fmtRange(w.weekStart, w.weekEnd)}</div>
          <div class="item-meta">Entró ${fmtMoney(w.income)} · hormiga ${fmtMoney(w.hormiga)}${w.gasto?` · otros ${fmtMoney(w.gasto)}`:''}</div>
        </div>
        <div class="item-amounts"><span class="item-amount" style="${w.net<0?'color:var(--warn);':'color:var(--good);'}">${fmtMoney(w.net)}</span></div>
      </div>`).join('') : `<div class="empty-note" style="padding-top:0;">Sin ${PL().plural} anteriores registrad${PL().noun === 'mes' ? 'os' : 'as'} todavía.</div>`}
    <p class="sub-head">Deudas saldadas</p>
    ${paidDebts.length ? paidDebts.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p=>`
      <div class="item-row">
        <div class="item-main">
          <div class="item-name">${escapeAttr(p.name)} ✓</div>
          <div class="item-meta">Saldada el ${new Date(p.date+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}</div>
        </div>
        <div class="item-amounts"><span class="item-amount" style="color:var(--good);">${fmtMoney(p.balance)}</span></div>
      </div>`).join('') : '<div class="empty-note" style="padding-top:0;">Ninguna deuda saldada todavía.</div>'}`);

  // Mis apps
  html += `<div class="card">
    <div class="card-head"><div><p class="card-title">Mis apps</p><p class="card-sub">Todo en un solo lugar</p></div></div>
    ${renderAppsRow()}
    <p class="item-meta" style="margin-top:4px;line-height:1.6;">Las ventanas flotantes del Rotador y del Bot se activan desde dentro de cada una, igual que antes. También puedes poner el widget "Control Financiero · Semana" en tu pantalla de inicio.</p>
  </div>`;

  // Exportar resumen
  html += `<div class="card" data-tour="export">
    <div class="card-head"><div><p class="card-title">Exportar resumen para Claude</p><p class="card-sub">Últimos 3 meses + todos los movimientos</p></div></div>
    <p class="item-meta" style="margin:0 0 12px 0;line-height:1.6;">Genera un archivo con tu situación, ingresos por fuente, gastos por categoría, cobros repetidos y movimientos. Súbeselo a Claude en el chat para que lo analice y te diga cómo mejorar.</p>
    <button class="btn btn-solid btn-block" onclick="exportSummary()">Exportar resumen</button>
  </div>`;

  // Ajustes y ayuda
  html += `<div class="card">
    <div class="card-head"><div><p class="card-title">Ajustes y ayuda</p><p class="card-sub">Nombre, colores, letra, pagos, moneda, tutorial</p></div></div>
    <div class="btn-row"><button class="btn btn-solid" style="flex:1;" onclick="openSettings()">⚙ Ajustes</button><button class="btn" style="flex:1;" onclick="openHelp()">❓ Ayuda</button></div>
  </div>`;
  html += renderFxCard();

  // Respaldo
  html += `<div class="card" data-tour="backup">
    <div class="card-head"><p class="card-title">Respaldo de tus datos</p></div>
    <div class="backup-row">
      <button class="btn backup-btn" onclick="toggleBackupBox()">📋 Copiar respaldo</button>
      <button class="btn backup-btn" onclick="downloadBackup()">⬇ Guardar archivo</button>
      <button class="btn backup-btn" onclick="toggleRestoreBox()">⬆ Restaurar</button>
    </div>
    ${renderBackupBox()}
    ${renderRestoreDialogs()}
  </div>`;

  html += `<p class="footnote">Tus datos se guardan solo en este teléfono (no dependen de internet). La meta ${PL().adj} reparte cada pago mensual entre los periodos de pago del mes. "Te falta" usa el mayor entre esa meta y lo que vence en ${PL().art}, para que nunca te agarre corto. Los gastos hormiga y los otros gastos del banco se restan de lo que entra antes de calcular lo que falta. Los pagos de gastos fijos y deudas no se restan otra vez, porque ya están en la meta.</p>`;
  return html;
}

function renderUpcomingRow(u){
  const when = u.days < 0 ? `venció hace ${-u.days} día${u.days===-1?'':'s'}` : u.days===0 ? 'hoy' : u.days===1 ? 'mañana' : 'en '+u.days+' días';
  const uj = escapeAttr(JSON.stringify({ key:u.key, kind:u.kind, refId:u.refId, name:u.name, amount:u.amount, date: dayISO(u.date) }));
  return `<div class="upcoming-row ${u.days<=7?'soon':''}" style="align-items:center;flex-wrap:wrap;">
    <span style="min-width:0;flex:1;">${escapeAttr(u.name)} <span class="days">${when}${u.shifted?' · movido':''}</span>
      ${u.paid > 0 ? `<span class="days" style="display:block;margin:2px 0 0 0;">pagado ${fmtMoney(u.paid)} de ${fmtMoney(u.full)}</span>` : ''}</span>
    <span class="amt">${fmtMoney(u.amount)}</span>
    <span class="up-btns">
      <button class="mini-btn good" onclick='openMarkPaid(${uj})'>Ya lo pagué</button>
      <button class="mini-btn" onclick="sheet={type:'shift', key:'${u.key}', baseIso:'${u.baseIso}', date:'${dayISO(u.date)}', name:${escapeAttr(JSON.stringify(u.name))}};render()">Mover</button>
    </span>
  </div>`;
}

function catChips(gk, dir, current){
  return `<div class="q-cats">${Object.keys(BANK_CATS).filter(k => BANK_CATS[k].dir === dir || BANK_CATS[k].dir === 'both')
    .map(k => `<button class="chip ${k===current?'active':''}" onclick="setGroupCategory('${gk}','${k}')">${BANK_CATS[k].label}</button>`).join('')}</div>`;
}
function renderQuestionsCard(){
  const qs = pendingQuestions();
  if(!qs.length) return '';
  const q = qs[0];
  const foot = (gk, extra) => `<div class="q-foot">${extra||''}
      <button class="card-link" onclick="dismissGroup('${gk}')">Descartar</button>
      <button class="card-link" style="color:var(--ink-dim);" onclick="snoozeGroup('${gk}')">Después</button></div>`;
  let body;
  if(q.kind === 'dupe'){
    const d = q.dupe;
    body = `<p class="q-ask" style="margin-top:0;">¿"${escapeAttr(d.a.name)}" y "${escapeAttr(d.b.name)}" son el mismo pago?</p>
      <p class="q-text">Tienes un ${itemDesc(d.a)} y un${d.b.type==='debt'?'a':''} ${itemDesc(d.b)}. Si son lo mismo, se está contando dos veces y te pide más plata de la que es.</p>
      <div class="q-btns" style="margin-top:10px;">
        <button class="btn btn-solid" onclick="mergeItems('${d.aRef}','${d.bRef}')">Sí, es el mismo</button>
        <button class="btn" onclick="ignoreDupe('${d.aRef}','${d.bRef}')">No, son distintos</button>
      </div>
      <p class="item-meta" style="margin-top:8px;">Con "Sí" se queda "${escapeAttr(d.b.name)}" y los pagos de "${escapeAttr(d.a.name)}" pasan ahí.</p>${foot(q.gk)}`;
  } else {
    const t = q.t, gk = q.gk;
    const more = q.txs && q.txs.length > 1 ? ` <span class="item-meta" style="display:inline;">· y ${q.txs.length-1} más igual${q.txs.length>2?'es':''}</span>` : '';
    const what = `<p class="q-text">${t.dir==='in'?'Entrada':'Pago'} de <b style="color:var(--ink);">${fmtMoney(t.amount)}</b> · ${fmtShortDate(t.date)}${more}<br>
      <span style="color:var(--ink);">${escapeAttr(displayName(t))}</span> <span class="item-meta" style="display:inline;">· ${escapeAttr(t.desc)}</span></p>`;
    const otherCats = questionCats === gk ? catChips(gk, t.dir, t.category) : '';
    const otherBtn = `<button class="card-link" onclick="toggleQuestionCats('${gk}')">${questionCats === gk ? 'Ocultar categorías' : 'Otra categoría…'}</button>`;
    if(questionRename === gk){
      body = `${what}<p class="q-text" style="margin-top:8px;">¿Qué es? Escríbele un nombre:</p>
        <div class="field-row"><input type="text" id="q-rename" placeholder="Ej: Star Snacks, Renta, Wash Hounds…">
        <button class="btn btn-primary" onclick="saveQuestionRename('${gk}')">Guardar</button></div>${foot(gk)}`;
    } else if(q.kind === 'name'){
      body = `${what}<p class="q-ask">¿Es <b>${escapeAttr(q.sug.name)}</b>?</p>
        <div class="q-btns"><button class="btn btn-solid" onclick="answerName('${gk}', true)">Sí</button>
        <button class="btn" onclick="answerName('${gk}', false)">No</button></div>${otherCats}${foot(gk, otherBtn)}`;
    } else if(q.kind === 'link'){
      const label = t.category === 'debt' ? 'deuda' : 'gasto fijo';
      body = `${what}${q.target ? `<p class="q-ask">¿Es para <b>${escapeAttr(q.target.name)}</b>?</p>
          <div class="q-btns"><button class="btn btn-solid" onclick="answerLink('${gk}', true)">Sí</button>
          <button class="btn" onclick="answerLink('${gk}', false)">No, es otro</button></div>`
        : `<p class="q-ask">Está como <b>${BANK_CATS[t.category].label}</b>. ¿A qué ${label} va?</p>
          <div class="q-btns"><button class="btn btn-solid" onclick="openLinkSheet('${t.id}', '${t.category==='debt'?'debt':'expense'}')">Elegir ${label}</button></div>`}
        <p class="item-meta" style="margin:10px 0 4px 0;">¿No es ${label}? Ponlo donde va:</p>${catChips(gk, t.dir, t.category)}${foot(gk)}`;
    } else if(q.kind === 'loanback'){
      body = `${what}<p class="q-ask">¿Es <b>${escapeAttr(q.loan.person)}</b> devolviéndote el préstamo?</p>
        <p class="q-text">Le prestaste ${fmtMoney(q.loan.amount)} el ${fmtShortDate(q.loan.date)}${loanRepaid(q.loan) ? `; ya te devolvió ${fmtMoney(loanRepaid(q.loan))}` : ''}.</p>
        <div class="q-btns" style="margin-top:10px;"><button class="btn btn-solid" onclick="answerLoanBack('${t.id}','${q.loan.id}', true)">Sí</button>
        <button class="btn" onclick="answerLoanBack('${t.id}','${q.loan.id}', false)">No</button></div>${otherCats}${foot(gk, otherBtn)}`;
    } else if(q.kind === 'loanpick'){
      body = `${what}<p class="q-ask">¿Quién te devolvió el préstamo?</p>
        <div class="q-btns"><button class="btn btn-solid" onclick="sheet={type:'loanPick', txId:'${t.id}'};render()">Elegir préstamo</button></div>${foot(gk)}`;
    } else if(q.kind === 'conflict'){
      body = `${what}<p class="q-ask">Este lo pusiste en ${q.options.length} lugares distintos. ¿Cuál es?</p>
        <p class="q-text">Si son lo mismo, elige uno para que no se cuente doble.</p>
        <div style="margin-top:8px;">${q.options.map(o => `<button class="pick" onclick="resolveConflict('${gk}','${o.id}')"><span>Todo es ${escapeAttr(o.label)}</span><span class="item-meta" style="margin:0;">${o.n} mov.</span></button>`).join('')}</div>
        <button class="btn btn-block" onclick="keepConflict('${gk}')">Son cosas distintas, déjalo así</button>${foot(gk)}`;
    } else {
      const sure = q.last ? `<p class="q-ask">La vez pasada lo pusiste como <b>${BANK_CATS[q.last] ? BANK_CATS[q.last].label : q.last}</b>. ¿Es lo mismo?</p>
          <div class="q-btns"><button class="btn btn-solid" onclick="setGroupCategory('${gk}','${q.last}')">Sí</button>
          <button class="btn" onclick="toggleQuestionCats('${gk}')">No</button></div>${questionCats === gk ? catChips(gk, t.dir, null) : ''}`
        : `<p class="q-ask">¿Qué es? <span class="item-meta" style="display:inline;">La app cree que es ${BANK_CATS[t.category] ? BANK_CATS[t.category].label : t.category}</span></p>
          ${catChips(gk, t.dir, t.category)}
          <div class="q-btns" style="margin-top:6px;"><button class="btn btn-solid" onclick="setGroupCategory('${gk}','${t.category}')">Sí, eso es</button></div>`;
      body = `${what}${sure}${foot(gk)}`;
    }
  }
  return `<div class="card q-card" data-tour="questions">
    <div class="card-head" style="margin-bottom:8px;"><p class="card-title" style="font-size:15px;">Revisar movimientos</p><span class="section-count">${qs.length} pendiente${qs.length===1?'':'s'}</span></div>
    ${body}
  </div>`;
}

function renderTradingCard(){
  const b = monthBounds(0);
  const t = tradingSummary(b.s, b.e);
  if(!t.any) return '';
  return `<div class="card">
    <div class="card-head"><div><p class="card-title">Trading</p><p class="card-sub">${b.label} · aparte de ingresos y gastos</p></div></div>
    <div class="item-row list-first"><div class="item-main"><div class="item-name">Depositaste en la plataforma</div></div><span class="item-amount">${fmtMoney(t.dep)}</span></div>
    <div class="item-row"><div class="item-main"><div class="item-name">Retiraste a tu banco</div></div><span class="item-amount">${fmtMoney(t.wd)}</span></div>
    <div class="item-row"><div class="item-main"><div class="item-name"><b>Resultado del mes</b></div></div><span class="item-amount" style="color:${t.net<0?'var(--warn)':'var(--good)'};">${t.net<0?'-':'+'}${fmtMoney(Math.abs(t.net))}</span></div>
  </div>`;
}

function renderSheet(c){
  if(!sheet) return '';
  let title = '', body = '';
  if(sheet.type === 'link'){
    const t = bankList().find(x => x.id === sheet.txId);
    if(!t){ sheet = null; return ''; }
    const isDebt = sheet.kind === 'debt';
    title = isDebt ? '¿A qué deuda va este pago?' : '¿Qué gasto fijo es?';
    const list = (isDebt ? data.debts : data.expenses).slice().sort((a,b) => Math.abs((isDebt?a.monthlyPayment:a.amount) - t.amount) - Math.abs((isDebt?b.monthlyPayment:b.amount) - t.amount));
    body = `<p class="item-meta" style="margin:0 0 10px 0;">${escapeAttr(displayName(t))} · ${fmtShortDate(t.date)} · <b style="color:var(--ink);">${fmtMoney(t.amount)}</b></p>
      ${list.length ? list.map(x => `<button class="pick" onclick="chooseLink('${t.id}','${isDebt?'debt':'expense'}','${x.id}')">
          <span>${escapeAttr(x.name)}</span><span class="item-meta" style="margin:0;">${isDebt ? 'debes '+fmtMoney(Math.max(0,x.balance||0)) : fmtMoney(x.amount)+' · '+expenseWhen(x).toLowerCase()}</span></button>`).join('')
        : `<p class="item-meta">No tienes ${isDebt?'deudas':'gastos fijos'} registrados todavía. Crea uno aquí abajo.</p>`}
      <p class="sub-head">¿No está en la lista? Crea ${isDebt?'una deuda nueva':'un gasto fijo nuevo'}</p>
      <p class="item-meta" style="margin:-2px 0 8px 0;">Revisa bien la lista de arriba antes de crear uno nuevo, para que no quede repetido.</p>
      <div class="field"><input type="text" id="nl-name" placeholder="${isDebt?'Ej: Carlos Mendez, Child Support':'Ej: Ethan, Renta'}"></div>
      <div class="field-row" style="margin-top:8px;">
        <input type="text" inputmode="decimal" id="nl-amount" placeholder="${isDebt?'Cuánto debes (antes de este pago)':'Monto'}">
        ${isDebt ? `<input type="text" inputmode="decimal" id="nl-pay" placeholder="Pago mensual (opcional)">` : `<select id="nl-freq"><option value="month">Cada mes</option><option value="week">Cada semana</option></select>`}
      </div>
      <button class="btn btn-solid btn-block" style="margin-top:10px;" onclick="createAndLink('${t.id}','${isDebt?'debt':'expense'}')">Crear y conectar</button>
      ${t.link ? `<button class="btn btn-block" style="margin-top:8px;" onclick="unlinkFromSheet('${t.id}')">Quitar conexión</button>` : `<button class="card-link" style="margin-top:8px;" onclick="unlinkFromSheet('${t.id}')">No conectar este pago</button>`}`;
  } else if(sheet.type === 'shift'){
    title = 'Mover este pago';
    body = `<p class="item-meta" style="margin:0 0 12px 0;">${escapeAttr(sheet.name)} · ahora el ${fmtShortDate(sheet.date)}${sheet.date!==sheet.baseIso?` (original: ${fmtShortDate(sheet.baseIso)})`:''}</p>
      <div class="btn-row">
        <button class="btn" style="flex:1;" onclick="shiftBy('${sheet.key}','${sheet.date}',1)">+1 día</button>
        <button class="btn" style="flex:1;" onclick="shiftBy('${sheet.key}','${sheet.date}',3)">+3 días</button>
        <button class="btn" style="flex:1;" onclick="shiftBy('${sheet.key}','${sheet.date}',7)">+1 semana</button>
      </div>
      <p class="sub-head">O elige la fecha</p>
      <div class="field-row"><input type="date" id="shift-date" value="${sheet.date}"><button class="btn btn-primary" onclick="shiftPayment('${sheet.key}', document.getElementById('shift-date').value)">Mover</button></div>
      ${sheet.date !== sheet.baseIso ? `<button class="btn btn-block" style="margin-top:10px;" onclick="shiftPayment('${sheet.key}', null)">Volver a la fecha original</button>` : ''}
      <p class="item-meta" style="margin-top:10px;">Solo cambia este pago. El próximo vuelve a su fecha normal. Para cambiarla siempre, edita el gasto o la deuda.</p>`;
  } else if(sheet.type === 'week'){
    const w = c.weeksAhead[sheet.idx];
    if(!w){ sheet = null; return ''; }
    title = `${capFirst(PL().noun)} del ${fmtShortDate(dayISO(w.weekStart))} al ${fmtShortDate(dayISO(w.weekEnd))}`;
    const items = w.items.slice().sort((a,b)=>a.date-b.date);
    body = `${items.length ? items.map(o => `<div class="mini-row"><span>${fmtShortDate(dayISO(o.date))} · ${escapeAttr(o.name)}${o.shifted?' <span class="item-meta" style="display:inline;">(movido)</span>':''}</span><b style="${o.remaining<=0.004?'color:var(--good);':''}">${o.remaining<=0.004?'pagado ✓':fmtMoney(o.remaining)}</b></div>`).join('') : '<p class="item-meta">No vence nada esta semana.</p>'}
      <div class="total-line"><span>Vence en ese periodo</span><b>${fmtMoney(w.due)}</b></div>
      <div class="total-line" style="border-top:none;margin-top:0;"><span>Conviene ganar</span><b style="color:var(--warn);">${fmtMoney(w.need)}</b></div>
      <p class="item-meta" style="margin-top:8px;">"Conviene ganar" es el mayor entre lo que vence en ese periodo y tu meta promedio (${fmtMoney(c.weeklyTarget)}), para ir guardando para los pagos grandes.</p>`;
  } else if(sheet.type === 'source'){
    const name = sheet.name;
    const b = monthBounds(0);
    const all = incomeBySource(monthBounds(-6).s, b.e);
    const me = all.find(x => x.name === name) || { members: [] };
    const others = all.filter(x => x.name !== name);
    title = name;
    body = `${me.members.length ? `<p class="sub-head" style="margin-top:0;">Unidos aquí</p>${me.members.map(m => `<div class="mini-row"><span>${escapeAttr(m)}</span><button class="btn" style="padding:6px 10px;font-size:12px;" onclick="unmergeSource(${escapeAttr(JSON.stringify(m))})">Separar</button></div>`).join('')}` : ''}
      <p class="sub-head" ${me.members.length?'':'style="margin-top:0;"'}>¿"${escapeAttr(name)}" es la misma que…?</p>
      ${others.length ? others.map(o => `<button class="pick" onclick="mergeSource(${escapeAttr(JSON.stringify(name))}, ${escapeAttr(JSON.stringify(o.name))})"><span>${escapeAttr(o.name)}</span><span class="item-meta" style="margin:0;">unir</span></button>`).join('') : '<p class="item-meta">No hay otras fuentes para unir.</p>'}
      ${(data.merges||{})[name.toLowerCase()] ? '' : ''}`;
  } else if(sheet.type === 'mergeInto'){
    const me = refItem(sheet.ref);
    if(!me){ sheet = null; return ''; }
    title = `Unir "${escapeAttr(me.name)}" con…`;
    const others = data.debts.map(d => 'd:'+d.id).concat(data.expenses.map(e => 'e:'+e.id)).filter(r => r !== sheet.ref).map(refItem).filter(Boolean)
      .sort((a,b) => Math.abs(a.amount - me.amount) - Math.abs(b.amount - me.amount));
    body = `<p class="item-meta" style="margin:0 0 10px 0;">Elige con cuál es el mismo pago. "${escapeAttr(me.name)}" se borra y sus pagos conectados pasan al que elijas.</p>
      ${others.map(o => `<button class="pick" onclick="mergeItems('${sheet.ref}','${o.type==='debt'?'d':'e'}:${o.id}')"><span>${escapeAttr(o.name)}</span><span class="item-meta" style="margin:0;">${o.type==='debt'?'deuda':'gasto fijo'} · ${fmtMoney(o.amount)}</span></button>`).join('') || '<p class="item-meta">No hay otros para unir.</p>'}`;
  } else if(sheet.type === 'markpaid'){
    const u = sheet.u;
    title = `¿Con cuál movimiento pagaste ${escapeAttr(u.name)}?`;
    const cands = markPaidCandidates(u.date, u.amount, sheet.wide);
    const linked = markPaidLinked(u);
    body = `${linked.length ? `<p class="sub-head" style="margin-top:0;">Ya conectado</p>
      ${linked.map(t => `<div class="pick" style="cursor:default;"><span style="min-width:0;"><span style="display:block;">${escapeAttr(displayName(t))}</span><span class="item-meta" style="margin:0;">${fmtShortDate(t.date)}${t.pending ? ' · pendiente' : ''}</span></span><b style="font-family:var(--mono);font-weight:normal;">${fmtMoney(t.amount)}</b></div>`).join('')}
      <p class="item-meta" style="margin:6px 0 10px 0;">Falta ${fmtMoney(u.amount)}. Si con eso ya quedó pagado, ciérralo aquí:</p>` : ''}
      <button class="btn btn-solid btn-block" style="margin-bottom:12px;" onclick="markPaidManual()">${linked.length ? 'Ya quedó pagado' : 'Lo pagué por otro lado (efectivo, otra cuenta)'}</button>
      <p class="item-meta" style="margin:0 0 10px 0;">${linked.length ? 'O elige otro movimiento que lo pagó' : 'O elige el movimiento del banco'}: ${fmtMoney(u.amount)} · ${fmtShortDate(u.date)}. Primero salen los que más se parecen en monto y fecha.</p>
      ${cands.length ? cands.map(t => `<button class="pick" onclick="chooseMarkPaid('${t.id}')"><span style="min-width:0;"><span style="display:block;">${escapeAttr(displayName(t))}</span><span class="item-meta" style="margin:0;">${fmtShortDate(t.date)} · ${escapeAttr(t.desc.slice(0,48))}</span></span><b style="font-family:var(--mono);font-weight:normal;">${fmtMoney(t.amount)}</b></button>`).join('')
        : '<p class="item-meta">No encontré pagos del banco cerca de esa fecha. ¿Ya subiste el extracto de esos días?</p>'}
      ${sheet.wide ? '' : `<button class="card-link" onclick="sheet.wide=true;render()">Ver más movimientos</button>`}
      <p class="item-meta" style="margin-top:10px;">La app recuerda ese comercio: cuando me lo confirmes 2 veces, los próximos se conectan solos.</p>`;
  } else if(sheet.type === 'loanDue'){
    const l = data.loans.find(x => x.id === sheet.loanId);
    if(!l){ sheet = null; return ''; }
    title = `¿Hasta cuándo te paga ${escapeAttr(l.person)}?`;
    const quick = [7, 14, 30].map(n => dayISO(addDays(isoToDate(todayISO()), n)));
    body = `<p class="item-meta" style="margin:0 0 12px 0;">Le prestaste ${fmtMoney(l.amount)} el ${fmtShortDate(l.date)}. Te aviso 2 días antes y ese mismo día.</p>
      <div class="btn-row">${quick.map((d,i) => `<button class="btn" style="flex:1;" onclick="setLoanDue('${l.id}','${d}')">${['1 semana','2 semanas','1 mes'][i]}</button>`).join('')}</div>
      <p class="sub-head">O elige la fecha</p>
      <div class="field-row"><input type="date" id="loan-due-pick" value="${l.due || ''}"><button class="btn btn-primary" onclick="setLoanDue('${l.id}', document.getElementById('loan-due-pick').value)">Guardar</button></div>
      <button class="card-link" style="margin-top:10px;" onclick="setLoanDue('${l.id}','')">Sin fecha por ahora</button>`;
  } else if(sheet.type === 'loanPick'){
    const t = bankList().find(x => x.id === sheet.txId);
    if(!t){ sheet = null; return ''; }
