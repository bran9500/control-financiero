<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Control Financiero</title>
<style>
  :root{
    --bg:#12161C;
    --surface:#1B2129;
    --surface-raised:#232A35;
    --line:#2A313B;
    --ink:#E8E6E0;
    --ink-dim:#8B93A0;
    --ink-faint:#5B6472;
    --good:#6FA98A;
    --warn:#C4693B;
    --accent:#6FA98A;
    /* Colores de categorías para gráficas (validados para fondo oscuro, aptos para daltonismo) */
    --s1:#3987e5; /* hormiga / ingresos */
    --s2:#d95926; /* otros gastos / gastos */
    --s3:#199e70; /* gastos fijos */
    --s4:#c98500; /* pagos de deuda */
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    margin:0;
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 110px 14px;}

  /* ---------- Encabezado ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 16px 2px;gap:10px;}
  .greeting{font-size:13px;color:var(--ink-dim);margin:0 0 2px 0;}
  .page-title{font-family:var(--serif);font-size:26px;margin:0;font-weight:normal;}
  .today{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0 0;}
  .save-status{font-size:12px;min-height:16px;margin:0;color:var(--ink-faint);text-align:right;}
  .save-status.error{color:var(--warn);}
  .save-status.ok{color:var(--good);}

  /* ---------- Tarjetas ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;}
  .card-title{font-family:var(--serif);font-size:17px;margin:0;}
  .card-sub{font-size:12px;color:var(--ink-faint);margin:2px 0 0 0;}
  .card-link{background:none;border:none;color:var(--good);font-size:13px;padding:4px 0;cursor:pointer;text-align:left;font-family:var(--sans);}

  .hero-card{padding:20px 18px;}
  .hero-label{font-size:13px;color:var(--ink-dim);margin:0 0 6px 0;}
  .hero-number{font-family:var(--mono);font-size:42px;font-variant-numeric:tabular-nums;margin:0;line-height:1.1;}
  .hero-number.good{color:var(--good);}
  .hero-number.warn{color:var(--warn);}
  .hero-sub{font-size:12.5px;color:var(--ink-faint);margin-top:8px;line-height:1.5;}
  .progress{height:8px;border-radius:4px;background:var(--surface-raised);margin-top:14px;overflow:hidden;}
  .progress > span{display:block;height:100%;border-radius:4px;background:var(--good);}
  .progress.warn > span{background:var(--warn);}
  .hero-split{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .hero-split .lbl{font-size:12.5px;color:var(--ink-dim);}
  .hero-split .val{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;}

  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0;}
  .mini-label{font-size:12px;color:var(--ink-dim);margin:0 0 6px 0;}
  .mini-value{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-foot{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .mini-input{
    width:100%;background:transparent;border:none;border-bottom:1px dashed var(--ink-faint);border-radius:0;
    padding:0 0 2px 0;font-family:var(--mono);font-size:19px;color:var(--good);
  }
  .mini-input:focus{outline:none;border-bottom-color:var(--good);}

  /* ---------- Gráficas ---------- */
  .month-switch{display:flex;align-items:center;gap:4px;}
  .month-switch button{background:var(--surface-raised);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;}

  .catbar{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:10px;padding:7px 0;}
  .catbar .name{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px;min-width:0;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .catbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative;}
  .catbar .fill{height:12px;border-radius:0 4px 4px 0;min-width:2px;}
  .catbar .amt{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .catbar .pct{font-size:11px;color:var(--ink-faint);margin-left:4px;}
  .total-line{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:13px;color:var(--ink-dim);}
  .total-line b{font-family:var(--mono);font-weight:normal;color:var(--ink);}
  .sub-head{font-size:12px;color:var(--ink-faint);margin:16px 0 6px 0;text-transform:uppercase;letter-spacing:.06em;}
  .merchant{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;gap:10px;}
  .merchant .m-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .merchant .m-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .chart-svg{width:100%;height:auto;display:block;}
  .chart-svg text{font-family:var(--sans);font-size:10px;fill:var(--ink-faint);}
  .chart-tip{display:flex;justify-content:space-between;gap:8px;background:var(--surface-raised);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:12.5px;color:var(--ink-dim);}
  .chart-tip b{font-family:var(--mono);font-weight:normal;color:var(--ink);}
  .empty-chart{font-size:13px;color:var(--ink-faint);padding:6px 0 4px 0;line-height:1.6;}

  /* ---------- Listas ---------- */
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:10px;}
  .item-main{flex:1;min-width:0;}
  .item-main.clickable{cursor:pointer;}
  .item-name{font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;}
  .item-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .item-amounts{text-align:right;flex-shrink:0;}
  .item-amount{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;}
  .item-amount.in{color:var(--good);}
  .item-weekly{font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .item-del{background:none;border:none;color:var(--ink-faint);font-size:20px;cursor:pointer;padding:0 0 0 8px;line-height:1;}
  .item-del:hover{color:var(--warn);}
  .card > .item-row:first-child, .card .list-first{border-top:none;}

  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink-faint);margin-top:3px;cursor:pointer;}
  .badge.returned{border-color:var(--good);color:var(--good);}
  .badge.bank{cursor:default;}

  .month-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0 6px 0;margin-top:2px;border-top:1px solid var(--line);
    font-family:var(--serif);font-size:13.5px;color:var(--ink-dim);cursor:pointer;user-select:none;
  }
  .month-header:first-child{border-top:none;padding-top:0;}
  .month-header .amt{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:6px;}
  .chevron{color:var(--ink-faint);font-size:13px;transition:transform .15s ease;display:inline-block;}
  .chevron.open{transform:rotate(90deg);}

  .add-toggle-btn{
    width:100%;text-align:center;border:1px dashed var(--line);border-radius:12px;
    padding:12px 0;margin-top:10px;background:none;color:var(--good);font-size:14px;cursor:pointer;
  }

  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto;}
  .seg button{
    flex:1;min-width:0;padding:9px 6px;border-radius:9px;border:none;background:none;color:var(--ink-dim);
    font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .seg button.active{background:var(--surface-raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);}

  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;}
  .chip{flex-shrink:0;font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink-dim);cursor:pointer;}
  .chip.active{border-color:var(--good);color:var(--good);}

  .tab-row{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{flex:1;text-align:center;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-raised);color:var(--ink-dim);font-size:13px;cursor:pointer;}
  .tab-btn.active{border-color:var(--good);color:var(--good);}

  .del-confirm{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .item-del-yes, .item-del-no{font-size:12px;padding:6px 9px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--surface-raised);color:var(--ink);white-space:nowrap;}
  .item-del-yes{border-color:var(--warn);color:var(--warn);}
  .item-del-no{color:var(--ink-dim);}

  .empty-note{font-size:13px;color:var(--ink-faint);padding:12px 0;line-height:1.5;}

  /* ---------- Formularios ---------- */
  .add-form{border-top:1px solid var(--line);padding-top:14px;margin-top:8px;display:flex;flex-direction:column;gap:10px;}
  .field-row{display:flex;gap:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
  label{font-size:11.5px;color:var(--ink-dim);}
  input, select{
    background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    padding:10px 11px;font-size:14px;font-family:var(--sans);width:100%;
  }
  input::placeholder{color:var(--ink-faint);}
  input:focus, select:focus{outline:1px solid var(--ink-dim);}
  select.cat-select{width:auto;max-width:132px;padding:6px 8px;font-size:12px;border-radius:8px;}

  .btn{background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);padding:11px 15px;border-radius:12px;font-size:14px;cursor:pointer;align-self:flex-start;}
  .btn:active{background:var(--line);}
  .btn-primary{border-color:var(--good);color:var(--good);}
  .btn-solid{background:var(--good);border-color:var(--good);color:#0E1A14;font-weight:600;}
  .btn-block{width:100%;text-align:center;align-self:stretch;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .stat-list .item-row:first-child{border-top:none;}

  /* ---------- Secciones plegables (pestaña Más) ---------- */
  section.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;padding:0 16px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;padding:15px 0;cursor:pointer;user-select:none;}
  .section-title{font-family:var(--serif);font-size:17px;margin:0;}
  .section-count{font-size:12.5px;color:var(--ink-faint);}
  .section-body{display:none;padding-bottom:14px;}
  .section-body.open{display:block;}

  .hero{padding:14px 0 18px 0;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .balance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .balance-row label{font-size:13px;color:var(--ink-dim);flex:1;}
  .balance-row input{width:110px;text-align:right;font-family:var(--mono);color:var(--good);font-size:15px;}

  .week-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .week-row:first-child{border-top:none;padding-top:0;}
  .week-row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .week-row.current .amt{color:var(--warn);}
  .week-row.total{font-family:var(--serif);font-size:14.5px;}
  .upcoming-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;gap:10px;}
  .upcoming-row:first-child{border-top:none;padding-top:0;}
  .upcoming-row .days{color:var(--ink-faint);font-size:12px;margin-left:6px;}
  .upcoming-row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .soon .amt{color:var(--warn);}

  .footnote{font-size:12px;color:var(--ink-faint);margin:14px 2px 0 2px;line-height:1.6;}

  .backup-row{display:flex;flex-wrap:wrap;gap:8px;}
  .backup-btn{flex:1 1 auto;min-width:100px;font-size:12.5px;padding:10px 8px;text-align:center;}

  .load-fail{border:1px solid var(--warn);border-radius:12px;padding:16px;margin-top:12px;}
  .load-fail-title{font-family:var(--serif);font-size:16px;margin:0 0 8px 0;color:var(--ink);}
  .load-fail-body{font-size:13.5px;color:var(--ink-dim);line-height:1.6;margin:0 0 14px 0;}
  #restore-textarea, #backup-textarea{
    width:100%;min-height:110px;background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:10px;font-size:12px;font-family:var(--mono);resize:vertical;margin-bottom:4px;
  }

  /* ---------- Subir extracto ---------- */
  .upload-zone{
    display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    border:1.5px dashed var(--ink-faint);border-radius:var(--radius);padding:26px 16px;cursor:pointer;
  }
  .upload-zone .ico{width:46px;height:46px;border-radius:50%;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;}
  .upload-zone .big{font-size:15px;color:var(--ink);}
  .upload-zone .small{font-size:12.5px;color:var(--ink-faint);}
  .steps{margin:0;padding-left:18px;font-size:13px;color:var(--ink-dim);line-height:1.7;}
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .sum-box{background:var(--surface-raised);border-radius:12px;padding:10px;text-align:center;}
  .sum-box .n{font-family:var(--mono);font-size:20px;}
  .sum-box .t{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-dim);padding:10px 0;line-height:1.5;}
  .check-row input{width:18px;height:18px;flex-shrink:0;margin-top:1px;accent-color:var(--good);}
  .note-good{font-size:12px;color:var(--good);}
  .error-box{border:1px solid var(--warn);border-radius:12px;padding:12px;font-size:13px;color:var(--warn);margin-top:12px;line-height:1.5;}

  /* ---------- Accesos a las otras apps ---------- */
  .apps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .app-tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 6px;color:var(--ink);font-size:12.5px;cursor:pointer;font-family:var(--sans);}
  .app-ico{width:38px;height:38px;border-radius:12px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;color:var(--good);}
  .app-ico svg{width:21px;height:21px;}
  .card .apps-row{margin-bottom:8px;}
  .card .app-tile{background:var(--surface-raised);}
  .card .app-ico{background:var(--surface);}

  /* ---------- Ventana de abajo (hoja) ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;overscroll-behavior:contain;background:var(--surface);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:10px 16px 26px 16px;max-height:82vh;overflow-y:auto;max-width:560px;margin:0 auto;}
  .sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px auto;}
  .pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface-raised);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font-size:14.5px;cursor:pointer;font-family:var(--sans);}
  .mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-dim);}
  .mini-row b{font-family:var(--mono);font-weight:normal;color:var(--ink);}
  .mini-btn{background:var(--surface-raised);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;padding:5px 9px;font-size:11.5px;cursor:pointer;font-family:var(--sans);}
  .week-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .week-chip{background:var(--surface-raised);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--sans);color:var(--ink);}
  .wc-range{font-size:11px;color:var(--ink-dim);}
  .wc-amt{font-family:var(--mono);font-size:15px;}
  .wc-due{font-size:10.5px;color:var(--ink-faint);}
  .q-card{border-color:var(--s1);}
  .q-text{font-size:13.5px;color:var(--ink-dim);margin:0;line-height:1.5;}
  .q-ask{font-size:16px;margin:10px 0;}
  .q-btns{display:flex;gap:8px;align-items:center;}
  .q-btns .btn{padding:10px 20px;}
  .done-box{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(111,169,138,.12);border:1px solid var(--good);border-radius:12px;padding:10px 12px;margin:0 0 10px 0;font-size:13px;color:var(--good);}
  .debt-detail{background:var(--surface-raised);border-radius:12px;padding:12px;margin:0 0 12px 0;}
  .debt-detail .mini-row:first-of-type{border-top:none;}

  .link-inline{color:var(--good);cursor:pointer;}
  .q-cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px 0;}
  .q-foot{display:flex;gap:16px;align-items:center;margin-top:10px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap;}
  .up-btns{display:flex;gap:6px;width:100%;justify-content:flex-end;margin-top:6px;}
  .mini-btn.good{color:var(--good);border-color:rgba(111,169,138,.5);}
  /* ---------- Barra de pestañas ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(22,27,34,.97);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 4px 8px 4px;
  }
  .tabbar button{
    flex:1;background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;padding:4px 0;cursor:pointer;font-family:var(--sans);
  }
  .tabbar button svg{width:23px;height:23px;}
  .tabbar button.active{color:var(--good);}
  .tabbar button.active .pill{background:rgba(111,169,138,.16);}
  .tabbar .pill{border-radius:999px;padding:3px 14px;display:flex;}

  /* ---------- Aviso flotante ---------- */
  #toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:#2C3440;color:var(--ink);font-size:13px;padding:11px 16px;border-radius:12px;max-width:88%;
    box-shadow:0 6px 20px rgba(0,0,0,.35);transition:all .2s ease;z-index:30;text-align:center;line-height:1.45;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>

<script>
const STORAGE_KEY = 'ledger-data';
function emptyData(){
  return {
    debts: [], expenses: [], incomes: [], hormiga: [], loans: [],
    settings: { hormigaLimit: 50, currentBalance: 0 },
    savings: { emergency: { movements: [] }, investments: { movements: [], rate: 0 } },
    history: { paidDebts: [] },
    bank: { transactions: [], rules: [], imports: [], sourceNames: {}, names: {}, linkMemory: {}, trust: {} },
    allocations: [], shifts: {}, merges: {}
  };
}
function normalizeData(parsed){

      rules: (parsed.bank && parsed.bank.rules) || [],

      sourceNames: (parsed.bank && parsed.bank.sourceNames) || {},
      // nombres que tú le pones a cada comercio/fuente (antes solo existían para ingresos)

const fmtMoney = n => {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
};

function escapeAttr(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Convierte el texto de un campo de monto a número, tratando comas como separador
// de miles (nunca como decimal) para que un teclado en otro idioma/región no
// convierta "12,788" en 12.788. Acepta tanto "12,788.50" como "12788.50".
function parseMoney(v){
  if(v === null || v === undefined) return 0;
  const cleaned = String(v).trim().replace(/,/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function startOfWeek(d){
  const date = new Date(d);
  const day = date.getDay(); // 0 Sun .. 6 Sat
  const diff = (day === 0 ? -6 : 1) - day; // move to Monday
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function nextExpenseDueDate(dueDay, from){
  const d = new Date(from);
  d.setHours(0,0,0,0);
  let candidate = new Date(d.getFullYear(), d.getMonth(), dueDay);
  if(candidate < d) candidate = new Date(d.getFullYear(), d.getMonth()+1, dueDay);
  return candidate;
}

function monthKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return capFirst(d.toLocaleDateString('es-ES', {month:'long', year:'numeric'}));
}
function capFirst(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
function groupByMonth(items, amountFn){
  const map = {};
  const order = [];
  items.forEach(it=>{
    const key = monthKey(it.date);
    if(!map[key]){ map[key] = { key, label: monthLabel(it.date), items: [], total: 0 }; order.push(key); }
    map[key].items.push(it);
    map[key].total += amountFn ? amountFn(it) : (it.amount||0);
  });
  return order.sort((a,b)=>b.localeCompare(a)).map(k=>map[k]);
}

// Limpieza: movimientos leídos por error de la tabla de saldos diarios del PDF (sin letras en la descripción).
function cleanGhostTransactions(){
  const list = (data.bank && data.bank.transactions) || [];
  const bad = list.filter(t => !/[A-Za-z]{2,}/.test(t.desc || ''));
  if(!bad.length) return 0;
  bad.forEach(t => {
    if(typeof unlinkTx === 'function') unlinkTx(t);
    if(t.category === 'loan' && typeof removeLoanFromTx === 'function') removeLoanFromTx(t);
    if(t.category === 'loanback' && typeof removeRepayment === 'function') removeRepayment(t);
  });
  data.bank.transactions = list.filter(t => /[A-Za-z]{2,}/.test(t.desc || ''));
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  return bad.length;
}

// ---- Préstamos ----
// Un préstamo "activo" (no devuelto) descuenta su monto del capital disponible;
// al marcarlo devuelto, borrarlo, o editar su monto, se ajusta el capital para que
// siempre refleje lo que de verdad tienes en la mano.
function applyLoanBalanceEffect(amount, wasActive, isActive){
  const oldContribution = wasActive ? -amount : 0;
  const newContribution = isActive ? -amount : 0;
  data.settings.currentBalance = (data.settings.currentBalance || 0) + (newContribution - oldContribution);
}
function addLoan(person, amount, date, note, due){
  const amt = parseMoney(amount);
  data.loans.push({id:'l'+Date.now(), person, amount:amt, date, note:note||'', returned:false, due: due||''});
  applyLoanBalanceEffect(amt, false, true);
  saveData(); render();
}
function updateLoan(id, person, amount, date, note, returned){
  const idx = data.loans.findIndex(l=>l.id===id);
  if(idx>-1){
    const existing = data.loans[idx];
    const wasActive = !existing.returned;
    const newAmount = parseMoney(amount);
    const isActive = !returned;
    // Revierte el efecto del monto viejo y aplica el del monto nuevo
    if(!existing.fromBank){
      if(wasActive) applyLoanBalanceEffect(existing.amount, true, false);
      if(isActive) applyLoanBalanceEffect(newAmount, false, true);
    }
    data.loans[idx] = {...existing, person, amount:newAmount, date, note:note||'', returned: !!returned, due: arguments[6] !== undefined ? arguments[6] : (existing.due||'')};
  }
  saveData(); render();
}
function toggleLoanReturned(id){
  const l = data.loans.find(x=>x.id===id);
  if(l){
    const wasActive = !l.returned;
    l.returned = !l.returned;
    const isActive = !l.returned;
    if(!l.fromBank) applyLoanBalanceEffect(l.amount, wasActive, isActive);
    saveData(); render();
  }
}
function removeLoan(id){
  const l = data.loans.find(x=>x.id===id);
  if(l){
    const wasActive = !l.returned;
    if(!l.fromBank) applyLoanBalanceEffect(l.amount, wasActive, false);
    if(l.txId){ const t = bankList().find(x => x.id === l.txId); if(t){ delete t.loanId; t.category = 'gasto'; } }
  }
  data.loans = data.loans.filter(x => x.id !== id);
  saveData(); render();
}

let rangeStart = null, rangeEnd = null;
function setRangeStart(v){ rangeStart = v; render(); }
function setRangeEnd(v){ rangeEnd = v; render(); }
function computeRangeSummary(){
  if(!rangeStart || !rangeEnd) return null;
  const rs = new Date(rangeStart+'T00:00:00');
  const re = new Date(rangeEnd+'T23:59:59');
  if(re < rs) return null;
  const incomes = allIncomes().filter(i=>{ const d=new Date(i.date+'T00:00:00'); return d>=rs && d<=re; });
  const hormiga = allHormiga().filter(h=>{ const d=new Date(h.date+'T00:00:00'); return d>=rs && d<=re; });
  const gastos = allOtherSpend().filter(g=>{ const d=new Date(g.date+'T00:00:00'); return d>=rs && d<=re; });
  const loans = data.loans.filter(l=>{ const d=new Date(l.date+'T00:00:00'); return d>=rs && d<=re; });

  const dueItems = occurrencesInRange(rs, re).map(o => ({ name:o.name, amount:o.amount, kind: o.kind==='debt' ? 'Deuda' : 'Gasto fijo', date: dayISO(o.date) }));

  const totalIncome = incomes.reduce((s,i)=>s+(i.amount||0),0);
  const totalHormiga = hormiga.reduce((s,h)=>s+(h.amount||0),0);
  const totalDue = dueItems.reduce((s,x)=>s+(x.amount||0),0);
  const totalLoaned = loans.reduce((s,l)=>s+(l.amount||0),0);
  const totalGasto = gastos.reduce((s,g)=>s+(g.amount||0),0);
  return { incomes, hormiga, gastos, loans, dueItems, totalIncome, totalHormiga, totalGasto, totalDue, totalLoaned };
}
function renderRangeSummary(r){

  r.hormiga.forEach(h=>rows.push({label:(h.desc||'Gasto hormiga'), kind:'Hormiga', amount:h.amount, date:h.date, positive:false}));
  r.gastos.forEach(g=>rows.push({label:(g.desc||'Gasto'), kind:'Otros gastos', amount:g.amount, date:g.date, positive:false}));
  r.loans.forEach(l=>rows.push({label:l.person, kind:'Préstamo', amount:l.amount, date:l.date, positive:false}));
  r.dueItems.forEach(x=>rows.push({label:x.name, kind:x.kind, amount:x.amount, date:x.date, positive:false}));
  rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const net = r.totalIncome - r.totalHormiga - r.totalGasto - r.totalDue - r.totalLoaned;
  return `

    <div class="item-row"><div class="item-main"><div class="item-name">Deudas y gastos fijos que vencen</div></div><div class="item-amounts"><span class="item-amount" style="color:var(--warn);">${fmtMoney(r.totalDue)}</span></div></div>
    <div class="item-row"><div class="item-main"><div class="item-name">Prestado en el período</div></div><div class="item-amounts"><span class="item-amount" style="color:var(--warn);">${fmtMoney(r.totalLoaned)}</span></div></div>
    <div class="item-row" style="border-top:2px solid var(--line);"><div class="item-main"><div class="item-name">Neto del período</div></div><div class="item-amounts"><span class="item-amount" style="${net<0?'color:var(--warn);':'color:var(--good);'}">${fmtMoney(net)}</span></div></div>

        <div class="item-amounts"><span class="item-amount" style="${x.positive?'color:var(--good);':''}">${x.positive?'+':'-'}${fmtMoney(x.amount)}</span></div>
      </div>`).join('') : '<div class="empty-note">Sin movimientos en este rango.</div>'}

}

function computeAll(){
  const today = new Date(); today.setHours(0,0,0,0);
  const weekStart = startOfWeek(today);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6); weekEnd.setHours(23,59,59,999);

  const weeklyEquivDebt = data.debts.map(d => ({...d, weekly: (d.monthlyPayment||0)/4.345}));
  const weeklyEquivExp = data.expenses.map(e => ({...e, weekly: expenseMonthly(e)/4.345}));
  const weeklyTarget = weeklyEquivDebt.reduce((s,d)=>s+d.weekly,0) + weeklyEquivExp.reduce((s,e)=>s+e.weekly,0);
  const monthlyTotal = data.debts.reduce((s,d)=>s+(d.monthlyPayment||0),0) + data.expenses.reduce((s,e)=>s+expenseMonthly(e),0);

  // Esta semana: lo que vence menos lo que ya pagaste ANTES de esta semana (lo de esta semana sale de lo que ganas).
  const occWeek = occurrencesInRange(weekStart, weekEnd, weekStart);
  const dueThisWeek = occWeek.reduce((s,o)=>s+o.remaining,0);

  // Próximos 30 días (incluye lo de esta semana que aún no está pagado)
  const in30 = addDays(today, 30); in30.setHours(23,59,59,999);
  const upcoming = occurrencesInRange(weekStart, in30)
    .filter(o => o.remaining > 0.004 && (o.date >= today || o.date >= weekStart))
    .map(o => ({ name:o.name, amount:o.remaining, full:o.amount, paid:o.paid, days: Math.round((o.date - today)/86400000), date:o.date,
                 key:o.key, baseIso: dayISO(o.baseDate), shifted:o.shifted, kind:o.kind, refId:o.refId }));

  const incomeThisWeek = sumInRange(allIncomes(), weekStart, weekEnd);
  const hormigaThisWeek = sumInRange(allHormiga(), weekStart, weekEnd);
  const gastoThisWeek = sumInRange(allOtherSpend(), weekStart, weekEnd);

  const hormigaLimit = (data.settings && data.settings.hormigaLimit) || 0;
  const hormigaOver = hormigaThisWeek - hormigaLimit;

  const availableThisWeek = incomeThisWeek - hormigaThisWeek - gastoThisWeek;
  const need = Math.max(weeklyTarget, dueThisWeek);
  const shortfall = need - availableThisWeek;

  const currentBalance = (data.settings && data.settings.currentBalance) || 0;
  const totalWithBalance = currentBalance + availableThisWeek;
  const realGap = need - totalWithBalance; // positivo = aún te falta, negativo = te sobra

  const totalDebt = data.debts.reduce((s,d)=>s+Math.max(0, d.balance||0),0);

  // Esta semana y las 4 siguientes: lo que vence (menos lo ya pagado) y lo que conviene ganar.
  const weeksAhead = [];
  for(let w=0; w<5; w++){
    const ws = addDays(weekStart, w*7);
    const we = addDays(ws, 6); we.setHours(23,59,59,999);
    const occ = w === 0 ? occWeek : occurrencesInRange(ws, we);
    const due = occ.reduce((s,o)=>s+o.remaining,0);
    weeksAhead.push({ weekStart: ws, weekEnd: we, due, need: Math.max(weeklyTarget, due), items: occ, isCurrent: w===0 });
  }

  return {weeklyTarget, dueThisWeek, incomeThisWeek, hormigaThisWeek, gastoThisWeek, hormigaLimit, hormigaOver, availableThisWeek, shortfall, totalDebt, monthlyTotal, upcoming, weeklyEquivDebt, weeklyEquivExp, need, weeksAhead, currentBalance, totalWithBalance, realGap};
}

function pastWeeksHistory(limit){
  const today = new Date(); today.setHours(0,0,0,0);
  const curWeekStart = startOfWeek(today);
  const weeks = [];
  for(let w=1; w<=limit; w++){
    const ws = new Date(curWeekStart); ws.setDate(ws.getDate() - w*7);
    const we = new Date(ws); we.setDate(we.getDate()+6); we.setHours(23,59,59,999);
    const income = sumInRange(allIncomes(), ws, we);
    const hormiga = sumInRange(allHormiga(), ws, we);
    const gasto = sumInRange(allOtherSpend(), ws, we);
    if(income === 0 && hormiga === 0 && gasto === 0) continue;
    weeks.push({ weekStart: ws, weekEnd: we, income, hormiga, gasto, net: income - hormiga - gasto });
  }
  return weeks;
}

// ---- Lectura del archivo CSV ----
function parseCSV(text){
  text = String(text).replace(/^﻿/, '');
  // Algunos bancos usan punto y coma; si la primera línea tiene más ";" que ",", se usa ";".
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = [];
  let row = [], cell = '', q = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}

function ymd(y, mo, d){
  if(!(y > 1900) || mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function parseBankDate(s){
  s = String(s || '').trim();
  if(!s) return null;
  const first = s.split(/[ T]/)[0];
  let m;
  if((m = first.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/))) return ymd(+m[1], +m[2], +m[3]);
  if((m = first.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/))){
    let y = +m[3]; if(y < 100) y += 2000;
    return ymd(y, +m[1], +m[2]); // formato de EE.UU.: mes/día/año
  }
  if(!/[a-z]/i.test(s)) return null;
  const d = new Date(s);
  if(isNaN(d)) return null;
  return ymd(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function parseBankAmount(s){
  s = String(s == null ? '' : s).trim();
  if(!s) return null;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1).trim(); }
  if(/-$/.test(s)){ neg = true; s = s.slice(0,-1).trim(); }
  s = s.replace(/USD|US\$|\$|\s|,/gi, '');
  if(s.startsWith('-')){ neg = !neg; s = s.slice(1); }
  if(s.startsWith('+')) s = s.slice(1);
  if(!/^\d*\.?\d+$/.test(s)) return null;
  const n = parseFloat(s);
  return neg ? -n : n;
}

// Encuentra qué columna es la fecha, la descripción y el monto.
function detectColumns(rows){
  for(let h=0; h<Math.min(rows.length, 12); h++){
    const cells = rows[h].map(c => c.toLowerCase());
    if(cells.some(c => parseBankDate(c))) continue; // fila de datos, no de títulos
    const find = (re, not) => cells.findIndex(c => re.test(c) && !(not && not.test(c)));
    const date = find(/date|fecha/);
    if(date < 0) continue;
    const debit = find(/debit|withdraw|retiro|cargo|money out|outflow/, /type|tipo/);
    const credit = find(/credit|deposit|dep[oó]sito|abono|money in|inflow/, /type|tipo/);
    const amount = find(/amount|monto|importe|valor/);
    let desc = find(/description|descripci|payee|memo|details|detalle|concept|narrative/);
    if(desc < 0) desc = find(/name|activity|merchant|comercio/, /type|tipo|date|number|account/);
    const balance = find(/balance|saldo/);
    const type = find(/type|tipo/);
    const hasDC = debit >= 0 && credit >= 0;
    if(hasDC || amount >= 0){
      return { header:h, date, desc, balance, type, debit: hasDC?debit:-1, credit: hasDC?credit:-1, amount: hasDC?-1:amount };
    }
  }
  return guessColumns(rows);
}
// Archivo sin títulos: adivina las columnas mirando el contenido.
function guessColumns(rows){
  const sample = rows.slice(0, 25);
  const width = Math.max(...sample.map(r => r.length));
  let date = -1, bestDate = 0;
  const numeric = [];
  let desc = -1, bestLen = 0;
  for(let c=0; c<width; c++){
    const vals = sample.map(r => r[c] || '');
    const nonEmpty = vals.filter(v => v !== '');
    if(!nonEmpty.length) continue;
    const dates = nonEmpty.filter(v => parseBankDate(v)).length;
    const nums = nonEmpty.filter(v => parseBankAmount(v) !== null).length;
    if(dates / nonEmpty.length > 0.6 && dates > bestDate){ bestDate = dates; date = c; continue; }
    if(nums / nonEmpty.length > 0.8){ numeric.push(c); continue; }
    const avg = nonEmpty.reduce((s,v)=>s+v.length,0) / nonEmpty.length;
    if(avg > bestLen){ bestLen = avg; desc = c; }
  }
  if(date < 0 || !numeric.length) return null;
  const col = { header:-1, date, desc, balance:-1, type:-1, debit:-1, credit:-1, amount:-1 };
  if(numeric.length === 1){ col.amount = numeric[0]; return col; }
  const [a, b] = numeric;
  // Si en cada fila solo una de las dos columnas tiene valor, son débito/crédito.
  const exclusive = sample.every(r => !((r[a]||'') !== '' && (r[b]||'') !== ''));
  if(exclusive){ col.debit = a; col.credit = b; if(numeric[2] !== undefined) col.balance = numeric[2]; }
  else { col.amount = a; col.balance = b; }
  return col;
}

function rowsToTransactions(rows, col){
  const out = [];
  let skipped = 0;
  for(let i=col.header+1; i<rows.length; i++){
    const r = rows[i];
    const date = parseBankDate(r[col.date]);
    if(!date){ skipped++; continue; }
    let amt = null, dir = null;
    if(col.amount >= 0){
      const a = parseBankAmount(r[col.amount]);
      if(a === null || a === 0){ skipped++; continue; }
      dir = a < 0 ? 'out' : 'in';
      amt = Math.abs(a);
      const type = col.type >= 0 ? (r[col.type] || '') : '';
      if(a > 0 && /debit|withdraw|purchase|payment|fee|retiro|cargo|compra/i.test(type) && !/credit|deposit|dep[oó]sito|abono/i.test(type)) dir = 'out';
    } else {
      const d = parseBankAmount(r[col.debit]);
      const c = parseBankAmount(r[col.credit]);
      if(d) { amt = Math.abs(d); dir = 'out'; }
      else if(c){ amt = Math.abs(c); dir = 'in'; }
      else { skipped++; continue; }
    }
    let desc = col.desc >= 0 ? (r[col.desc] || '') : '';
    if(!desc) desc = r.filter((c,j)=> j!==col.date && parseBankAmount(c)===null).join(' ');
    out.push({
      date,
      desc: desc.replace(/\s+/g,' ').trim() || 'Movimiento',
      amount: Math.round(amt*100)/100,
      dir,
      balance: col.balance >= 0 ? parseBankAmount(r[col.balance]) : null
    });
  }
  return { txs: out, skipped };
}

function normDesc(s){ return String(s || '').toUpperCase().replace(/\s+/g,' ').trim(); }
// Huella de un movimiento: misma fecha + mismo monto + misma dirección + misma descripción.
function txFingerprint(t){ return t.date+'|'+t.dir+'|'+Math.round(t.amount*100)+'|'+normDesc(t.desc); }

// Nombre corto del comercio, para agrupar ("VISA DDA PUR 461234 SHELL OIL 5744 JERSEY CITY" → "SHELL OIL").
const DESC_NOISE = /\b(VISA|DDA|PUR|PURCHASE|POS|DEBIT|CREDIT|CARD|CRD|DBT|CHECKCARD|DBCRD|CRCRD|ACH|ELECTRONIC|PMT|WEB|PAYMENT|RECURRING|ONLINE|XFER|AP|AUT|INTL|DES|ID|INDN|CO|PPD|CCD|TO|FROM|THE|SQ|TST|PP|DEPOSIT|DEP|WITHDRAWAL|WDRL)\b/g;
function merchantKey(desc){
  const raw = normDesc(desc);
  // Zelle: separar por persona ("ZELLE CARLOS MENDEZ") en vez de juntar todos como "TD ZELLE".
  if(/\bZELLE\b/.test(raw)){
    const after = raw.slice(raw.lastIndexOf('ZELLE') + 5)
      .replace(/^[^A-Z]*/,'').replace(/^(PAYMENT|PMT|SENT|RECEIVED|TRANSFER)\b\s*/,'').replace(/^(TO|FROM)\b\s*/,'')
      .replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
    const who = after.split(' ').filter(w => w.length > 1).slice(0,2).join(' ');
    return who ? 'ZELLE ' + who : 'ZELLE';
  }
  if(/\bATM\b/.test(raw)) return /DEP/.test(raw) ? 'ATM DEPOSITO' : 'ATM';
  const s = normDesc(desc).replace(/\b([A-Z])-(?=[A-Z])/g,'$1').replace(/[^A-Z ]/g,' ').replace(DESC_NOISE,' ').replace(/\s+/g,' ').trim();
  const words = s.split(' ').filter(w => w.length > 1);
  return words.slice(0,2).join(' ') || normDesc(desc).slice(0,22) || 'MOVIMIENTO';
}
// Nombre que se muestra: el que tú le pusiste a ese comercio/fuente, o uno limpio sacado del banco.
function displayName(t){
  const key = merchantKey(t.desc);
  return (data.bank.names && data.bank.names[key]) || niceName(key);
}
function niceName(key){
  return key.toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase());
}

function nameMatches(desc, name){
  const words = normDesc(name).replace(/[^A-Z0-9 ]/g,' ').split(' ').filter(w => w.length >= 4 && !/^\d+$/.test(w));
  const d = ' ' + normDesc(desc).replace(/[^A-Z0-9 ]/g,' ') + ' ';
  return words.some(w => d.includes(' '+w));
}
function findRule(key, dir){
  return (data.bank.rules || []).find(r => r.key === key && r.dir === dir);
}
function guessCategory(t){
  const rule = findRule(merchantKey(t.desc), t.dir);
  if(rule && BANK_CATS[rule.category]) return { category: rule.category, auto:'rule' };
  if(TRADING_RE.test(t.desc)) return { category:'trading', auto:'default' };
  const named = (data.bank.names || {})[merchantKey(t.desc)];
  if(named && /trading/i.test(named)) return { category:'trading', auto:'name' };
  if(t.dir === 'out' && OWN_RE.test(t.desc)) return { category:'own', auto:'default' };
  if(t.dir === 'in') return { category:'income', auto:'default' };
  if(data.expenses.some(e => nameMatches(t.desc, e.name))) return { category:'fixed', auto:'name' };
  if(data.debts.some(d => nameMatches(t.desc, d.name))) return { category:'debt', auto:'name' };
  if(t.amount <= HORMIGA_AUTO_MAX) return { category:'hormiga', auto:'default' };
  return { category:'gasto', auto:'default' };
}
// ¿Ya lo anotaste a mano? (mismo monto, hasta 3 días de diferencia) → no se cuenta dos veces.
function findManualMatch(t, used){
  const list = t.dir === 'in' ? data.incomes : data.hormiga;
  const td = new Date(t.date+'T00:00:00');
  return list.find(m => !used.has(m.id)
    && Math.abs((m.amount||0) - t.amount) < 0.005
    && Math.abs((new Date(m.date+'T00:00:00') - td) / 86400000) <= 3);
}

// ---- Vista previa antes de guardar ----
let importPreview = null;
let importError = null;

function readFileText(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => rej(new Error('no se pudo abrir ' + f.name));
    r.readAsText(f);
  });
}

// Se pueden elegir varios extractos a la vez (por ejemplo los últimos 3 meses).
let importBusy = false;
async function handleStatementFiles(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  importError = null;
  importBusy = true; render();
  try{
    const parsed = [];
    for(const f of files){
      const isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
      if(isPdf){
        let lines;
        try{ lines = await pdfToLines(await readFileBuffer(f)); }
        catch(e){ parsed.push({ name: f.name, error: 'no pude abrir el PDF (' + (e && e.message ? e.message : 'error') + ')' }); continue; }
        if(!lines.length){ parsed.push({ name: f.name, error: 'el PDF no tiene texto (parece una foto escaneada)' }); continue; }
        const r = parsePdfStatementLines(lines);
        parsed.push({ name: f.name, pdf: r });
      } else {
        parsed.push({ name: f.name, text: await readFileText(f) });
      }
    }
    buildImportPreview(parsed);
  }catch(err){
    importPreview = null;
    importError = 'No pude leer los archivos. Revisa que sean extractos de TD Bank (PDF o CSV) y vuelve a intentarlo.' + (err && err.message ? ' (' + err.message + ')' : '');
  }
  importBusy = false;
  input.value = '';
  render();
  window.scrollTo(0,0);
}

function parseStatement(text){
  if(/^\s*%PDF/.test(text)) throw new Error('es un PDF, no un CSV');
  const rows = parseCSV(text);
  if(!rows.length) throw new Error('el archivo está vacío');
  const col = detectColumns(rows);
  if(!col || col.date < 0) throw new Error('no encontré las columnas de fecha y monto');
  const r = rowsToTransactions(rows, col);
  if(!r.txs.length) throw new Error('no encontré movimientos');
  return r;
}

function buildImportPreview(files){
  const perFile = [];
  const warnings = [];
  let skipped = 0;
  files.forEach(f => {
    try{
      if(f.error) throw new Error(f.error);
      let r;
      if(f.pdf){
        if(!f.pdf.txs.length) throw new Error('no encontré movimientos en el PDF');
        r = f.pdf;
      } else r = parseStatement(f.text);
      r.txs.forEach(t => { t.fp = txFingerprint(t); });
      perFile.push({ name: f.name, txs: r.txs, endBalance: f.pdf ? f.pdf.endBalance : null, endDate: f.pdf ? f.pdf.endDate : null });
      skipped += r.skipped;
    }catch(e){ warnings.push(f.name + ': ' + e.message); }
  });
  if(!perFile.length) throw new Error(warnings.join(' · '));

  // Si dos extractos se pisan (mismas fechas), el mismo movimiento aparece en ambos:
  // por cada huella se toma el archivo donde más veces aparece, nunca la suma.
  const maxCount = {}, fromFile = {};
  perFile.forEach((pf, fi) => {
    const cnt = {};
    pf.txs.forEach(t => { cnt[t.fp] = (cnt[t.fp] || 0) + 1; });
    Object.keys(cnt).forEach(fp => {
      if(!(fp in maxCount) || cnt[fp] > maxCount[fp]){ maxCount[fp] = cnt[fp]; fromFile[fp] = fi; }
    });
  });
  const stored = {};
  bankList().forEach(t => { stored[t.fp] = (stored[t.fp] || 0) + 1; });

  const candidates = [];
  const taken = {};
  let dup = 0, total = 0;
  perFile.forEach((pf, fi) => pf.txs.forEach(t => {
    total++;
    if(fromFile[t.fp] !== fi){ dup++; return; }          // repetido en otro extracto
    taken[t.fp] = (taken[t.fp] || 0) + 1;
    if(taken[t.fp] <= (stored[t.fp] || 0)){ dup++; return; } // ya estaba guardado
    candidates.push(t);
  }));

  candidates.sort((a,b) => b.date.localeCompare(a.date));
  const used = new Set(bankList().filter(t => t.manualId).map(t => t.manualId));
  let manualDup = 0;
  const stamp = Date.now().toString(36);
  candidates.forEach((t, i) => {
    const g = guessCategory(t);
    t.category = g.category;
    t.auto = g.auto;
    const m = findManualMatch(t, used);
    if(m){ used.add(m.id); t.manualId = m.id; t.category = 'ignore'; t.auto = 'manual'; manualDup++; }
    t.id = 'b' + stamp + '_' + i;
  });

  // Saldo final: el del extracto más reciente (si el archivo trae columna de saldo).
  let lastBalance = null, lastBalanceDate = null;
  perFile.forEach(pf => {
    if(pf.endBalance !== null && pf.endBalance !== undefined && pf.endDate){
      if(lastBalanceDate === null || pf.endDate > lastBalanceDate){ lastBalance = pf.endBalance; lastBalanceDate = pf.endDate; }
      return;
    }
    const withBal = pf.txs.filter(t => t.balance !== null && !isNaN(t.balance));
    if(!withBal.length) return;
    const newestFirst = pf.txs[0].date >= pf.txs[pf.txs.length-1].date;
    const b = newestFirst ? withBal[0] : withBal[withBal.length-1];
    if(lastBalanceDate === null || b.date > lastBalanceDate){ lastBalance = b.balance; lastBalanceDate = b.date; }
  });
  const all = perFile.flatMap(pf => pf.txs.map(t => t.date)).sort();
  const daysOld = lastBalanceDate ? Math.round((new Date(todayISO()+'T00:00:00') - new Date(lastBalanceDate+'T00:00:00')) / 86400000) : null;
  importPreview = {
    fileName: perFile.map(pf => pf.name).join(', '),
    fileCount: perFile.length,
    fresh: candidates, dup, manualDup, skipped, total, warnings,
    from: all[0], to: all[all.length-1],
    lastBalance, lastBalanceDate,
    updateBalance: lastBalance !== null && daysOld !== null && daysOld <= 7
  };
}

function setPreviewCategory(i, cat){
  if(!importPreview || !importPreview.fresh[i]) return;
  const t = importPreview.fresh[i];
  t.category = cat;
  t.auto = 'manual-set';
  // Lo mismo para los demás del mismo comercio en este extracto.
  const key = merchantKey(t.desc);
  importPreview.fresh.forEach(o => {
    if(o !== t && o.dir === t.dir && o.auto !== 'manual-set' && o.auto !== 'manual' && merchantKey(o.desc) === key) o.category = cat;
  });
  upsertRule(key, t.dir, cat);
  render();
}
// Por si el PDF puso un movimiento al revés (entrada/salida).
function flipPreviewDir(i){
  if(!importPreview || !importPreview.fresh[i]) return;
  const t = importPreview.fresh[i];
  t.dir = t.dir === 'in' ? 'out' : 'in';
  t.fp = txFingerprint(t);
  const g = guessCategory(t);
  t.category = g.category; t.auto = g.auto;
  render();
}
function toggleUpdateBalance(v){ if(importPreview){ importPreview.updateBalance = !!v; } }

function confirmImport(){
  if(!importPreview) return;
  const p = importPreview;
  const imp = { id:'imp'+Date.now(), date: todayISO(), fileName: p.fileName, files: p.fileCount, added: p.fresh.length, dup: p.dup, from: p.from, to: p.to };
  p.fresh.forEach(t => { t.importId = imp.id; data.bank.transactions.push(t); });
  data.bank.imports.push(imp);
  const autoLinked = autoLinkNew(p.fresh);
  let msg = p.fresh.length ? `Listo: ${p.fresh.length} movimiento${p.fresh.length===1?'':'s'} nuevo${p.fresh.length===1?'':'s'} guardado${p.fresh.length===1?'':'s'}` : 'No había movimientos nuevos en ese extracto';
  if(p.updateBalance && p.lastBalance !== null){
    data.settings.currentBalance = p.lastBalance;
    msg += ` · saldo actualizado a ${fmtMoney(p.lastBalance)}`;
  }
  if(autoLinked) msg += ` · ${autoLinked} pago${autoLinked===1?'':'s'} se conectaron solos`;
  importPreview = null;
  saveData();
  activeTab = 'home';
  render();
  window.scrollTo(0,0);
  showToast(msg);
}
function cancelImport(){ importPreview = null; render(); }

function undoImport(id){
  const imp = data.bank.imports.find(x => x.id === id);
  if(!imp) return;
  const before = data.bank.transactions.length;
  data.bank.transactions.forEach(t => { if(t.importId === id) unlinkTx(t); });
  data.bank.transactions = data.bank.transactions.filter(t => t.importId !== id);
  data.bank.imports = data.bank.imports.filter(x => x.id !== id);
  confirmingDeleteId = null;
  saveData(); render();
  showToast(`Extracto deshecho: se quitaron ${before - data.bank.transactions.length} movimientos`);
}

// ---- Reglas automáticas ----
// Cada vez que confirmas la misma categoría para un comercio, sube la confianza. Con 2, la app lo hace sola.
function upsertRule(key, dir, cat){
  const r = findRule(key, dir);
  if(r){ r.count = r.category === cat ? (r.count || 1) + 1 : 1; r.category = cat; }
  else data.bank.rules.push({ key, dir, category: cat, count: 1 });
}
function ruleTrusted(r){ return !!r && (r.count || 1) >= 2; }
function setBankCategory(id, cat){
  const t = bankList().find(x => x.id === id);
  if(!t || !BANK_CATS[cat]) return;
  if(t.link && !((cat === 'debt' && t.link.type === 'debt') || (cat === 'fixed' && t.link.type === 'expense'))) unlinkTx(t);
  if(t.category === 'loan' && cat !== 'loan') removeLoanFromTx(t);
  if(t.category === 'loanback' && cat !== 'loanback') removeRepayment(t);
  t.category = cat;
  t.reviewed = true;
  t.auto = 'manual-set';
  const key = merchantKey(t.desc);
  upsertRule(key, t.dir, cat);
  let n = 0;
  bankList().forEach(o => {
    if(o !== t && o.dir === t.dir && o.auto !== 'manual-set' && o.auto !== 'manual' && !o.link && merchantKey(o.desc) === key && o.category !== cat){
      o.category = cat; o.auto = 'rule'; n++;
    }
  });
  saveData();
  // Pago de deuda o gasto fijo: preguntar a cuál va. Préstamo: preguntar hasta cuándo.
  if((cat === 'debt' || cat === 'fixed') && !t.link){ openLinkSheet(t.id, cat === 'debt' ? 'debt' : 'expense'); return; }
  if(cat === 'loan'){ createLoanFromTx(t); saveData(); sheet = { type:'loanDue', loanId: t.loanId }; render(); return; }
  if(cat === 'loanback' && !t.loanId){ sheet = { type:'loanPick', txId: t.id }; render(); return; }
  render();
  showToast(`"${displayName(t)}" ahora es ${BANK_CATS[cat].label}` + (n ? ` (y ${n} más)` : '') + '. Los próximos extractos lo harán solos.');
}
function removeRule(key, dir){
  data.bank.rules = data.bank.rules.filter(r => !(r.key === key && r.dir === dir));
  saveData(); render();
}

function monthBounds(offset){
  const now = new Date();
  const s = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const e = new Date(now.getFullYear(), now.getMonth() + offset + 1, 0, 23, 59, 59, 999);
  return { s, e, label: capFirst(s.toLocaleDateString('es-ES', {month:'long', year:'numeric'})) };
}
function spendingByCategory(s, e){
  const res = {};
  SPEND_CATS.forEach(c => res[c] = 0);
  res.hormiga += sumInRange(data.hormiga, s, e);
  bankList().forEach(t => {
    if(t.dir !== 'out' || !(t.category in res)) return;
    const d = new Date(t.date+'T00:00:00');
    if(d >= s && d <= e) res[t.category] += t.amount;
  });
  return res;
}
function topMerchants(s, e, n){
  const map = {};
  bankList().forEach(t => {
    if(t.dir !== 'out' || t.category === 'ignore' || t.category === 'own' || t.category === 'trading') return;
    const d = new Date(t.date+'T00:00:00');
    if(d < s || d > e) return;
    const k = merchantKey(t.desc);
    if(!map[k]) map[k] = { key:k, total:0, count:0, category:t.category };
    map[k].total += t.amount; map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total).slice(0, n);
}
function weeklySeries(nWeeks){
  const today = new Date(); today.setHours(0,0,0,0);
  const cur = startOfWeek(today);
  const out = [];
  for(let w = nWeeks-1; w >= 0; w--){
    const ws = new Date(cur); ws.setDate(ws.getDate() - w*7);
    const we = new Date(ws); we.setDate(we.getDate()+6); we.setHours(23,59,59,999);
    out.push({
      ws, we,
      income: sumInRange(allIncomes(), ws, we),
      spend: sumInRange(allHormiga(), ws, we) + sumInRange(allOtherSpend(), ws, we)
    });
  }
  return out;
}
function niceMax(v){
  if(v <= 0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}
function shortMoney(n){
  if(n >= 1000) return '$' + (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k';
  return '$' + Math.round(n);
}

let pdfLibPromise = null;
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('no se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}
// pdf.js se carga solo la primera vez que subes un PDF (pesa un poco y no hace falta antes).
function loadPdfLib(){
  if(!pdfLibPromise){
    pdfLibPromise = loadScript('pdfjs/pdf.worker.min.js')     // corre en el mismo hilo (sin Worker)
      .then(() => loadScript('pdfjs/pdf.min.js'))
      .then(() => {
        const lib = window.pdfjsLib;
        if(!lib) throw new Error('lector de PDF no disponible');
        lib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
        return lib;
      })
      .catch(e => { pdfLibPromise = null; throw e; });
  }
  return pdfLibPromise;
}
function readFileBuffer(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('no se pudo abrir ' + f.name));
    r.readAsArrayBuffer(f);
  });
}
// Convierte cada página en renglones de texto, respetando la posición de las palabras.
async function pdfToLines(buffer){
  const lib = await loadPdfLib();
  const doc = await lib.getDocument({ data: new Uint8Array(buffer), isEvalSupported: false }).promise;
  const lines = [];
  for(let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if(!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find(r => Math.abs(r.y - y) < 2.5);
      if(!row){ row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, w: it.width || 0, s: it.str });
    });
    rows.sort((a,b) => b.y - a.y);
    rows.forEach(r => {
      r.items.sort((a,b) => a.x - b.x);
      let txt = '', end = null;
      r.items.forEach(it => {
        if(end !== null && it.x - end > 1.5 && !/\s$/.test(txt)) txt += ' ';
        txt += it.s; end = it.x + it.w;
      });
      txt = txt.replace(/\s+/g, ' ').trim();
      if(txt) lines.push(txt);
    });
  }
  return lines;
}

const MONTHS_EN = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
                   ene:1,abr:4,ago:8,dic:12};
function statementPeriod(lines){
  const joined = lines.slice(0, 80).join(' ');
  let m = joined.match(/statement period:?\s*([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})\s*[-–to]+\s*([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/i);
  if(m){
    const m1 = MONTHS_EN[m[1].toLowerCase()], m2 = MONTHS_EN[m[4].toLowerCase()];
    if(m1 && m2) return { start: ymd(+m[3], m1, +m[2]), end: ymd(+m[6], m2, +m[5]) };
  }
  m = joined.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*(?:-|–|to|through|thru)\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i);
  if(m){
    const y1 = +m[3] < 100 ? +m[3] + 2000 : +m[3], y2 = +m[6] < 100 ? +m[6] + 2000 : +m[6];
    return { start: ymd(y1, +m[1], +m[2]), end: ymd(y2, +m[4], +m[5]) };
  }
  m = joined.match(/\b(20\d\d)\b/);
  return m ? { start: null, end: null, year: +m[1] } : null;
}

const PDF_IN_HEAD  = /^(electronic deposits|deposits|other credits|credits|deposits (and|&) (other )?(additions|credits)|interest (paid|earned)|incoming)/i;
const PDF_OUT_HEAD = /^(electronic payments|other withdrawals|withdrawals|checks paid|checks|service charges|fees|atm|point of sale|debit card|card purchases|purchases|withdrawals (and|&) (other )?(subtractions|debits))/i;
const PDF_STOP     = /^(daily balance summary|daily balance|balance summary|date\s+balance|how to balance|call 1-|for consumer accounts|in case of errors|your account balance)/i;
const PDF_SKIP     = /^(subtotal|total|beginning balance|ending balance|posting date|date description|description amount|page \d|continued)/i;

// Lee un extracto en PDF y devuelve los movimientos en el mismo formato que los CSV.
function parsePdfStatementLines(lines){
  const period = statementPeriod(lines);
  const endYear = period && period.end ? +period.end.slice(0,4) : (period && period.year) || new Date().getFullYear();
  const endMonth = period && period.end ? +period.end.slice(5,7) : 12;
  const toDate = (mo, d, y) => {
    if(y) return ymd(+y < 100 ? +y + 2000 : +y, +mo, +d);
    return ymd(+mo > endMonth ? endYear - 1 : endYear, +mo, +d); // extractos de diciembre–enero
  };
  const lineRe = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+(.*?)\s+(-?\(?\$?\s?[\d,]*\d\.\d{2}\)?-?)(?:\s+(-?\$?[\d,]*\d\.\d{2}-?))?$/;

  const txs = [];
  let section = null;     // 'in' | 'out' | null
  let inActivity = false; // ya pasamos el resumen de la cuenta
  let last = null, contLines = 0, skipped = 0;
  let endBalance = null;

  lines.forEach(raw => {
    const line = raw.trim();
    const bal = line.match(/^ending balance\s+(-?\$?[\d,]*\d\.\d{2})/i);
    if(bal && endBalance === null) endBalance = parseBankAmount(bal[1]);
    if(/daily account activity|account activity|transaction (history|detail)/i.test(line)){ inActivity = true; section = null; last = null; return; }
    if(PDF_STOP.test(line)){ section = null; last = null; return; }
    const headIn = PDF_IN_HEAD.test(line), headOut = PDF_OUT_HEAD.test(line);
    const m = line.match(lineRe);
    if(!m && (headIn || headOut)){ section = headIn ? 'in' : 'out'; last = null; return; }
    if(PDF_SKIP.test(line)){ last = null; return; }
    if(m){
      const date = toDate(m[1], m[2], m[3]);
      const a = parseBankAmount(m[5]);
      const desc = m[4].replace(/\s+/g, ' ').trim();
      // Una fila sin letras (solo números y fechas) es de la tabla de saldos diarios, no un movimiento.
      if(!date || a === null || a === 0 || !desc || !/[A-Za-z]{2,}/.test(desc)){ skipped++; last = null; return; }
      let dir = section;
      if(a < 0) dir = 'out';
      if(!dir) dir = /deposit|credit|refund|payroll|zelle.*from|transfer from|interest|reversal/i.test(desc) ? 'in' : 'out';
      last = { date, desc, amount: Math.round(Math.abs(a)*100)/100, dir, balance: null, fromPdf: true };
      txs.push(last);
      contLines = 0;
      return;
    }
    // Renglón que continúa la descripción del movimiento anterior.
    if(last && contLines < 2 && line.length < 90 && !/\d\.\d{2}$/.test(line)){
      last.desc = (last.desc + ' ' + line).replace(/\s+/g, ' ').trim();
      contLines++;
      return;
    }
    last = null;
  });
  return { txs, skipped, endBalance, endDate: period && period.end ? period.end : null, inActivity };
}

// =====================================================================
//  NOMBRES QUE LA APP APRENDE + FUENTES DE INGRESO (con fusiones)
// =====================================================================
let editingSourceTx = null; // id del movimiento que se está renombrando

// Fusiones: "star" → "Starsnack". Se siguen en cadena por si se unieron varias.
function resolveSource(name){
  let n = String(name || '').trim(), guard = 0;
  const m = data.merges || {};
  while(m[n.toLowerCase()] && guard++ < 8) n = m[n.toLowerCase()];
  return n;
}
function rawSourceName(i){
  if(i.bank) return i.name || niceName(merchantKey(i.source));
  const s = String(i.source || '').trim();
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : 'Sin fuente';
}
function incomeSourceName(i){ return resolveSource(rawSourceName(i)); }
function incomeBySource(s, e){
  const map = {};
  allIncomes().forEach(i => {
    const d = new Date(i.date+'T00:00:00');
    if(d < s || d > e) return;
    const raw = rawSourceName(i);
    const name = resolveSource(raw);
    const k = name.toLowerCase();
    if(!map[k]) map[k] = { name, total:0, count:0, members: new Set() };
    map[k].total += i.amount || 0;
    map[k].count++;
    if(raw.toLowerCase() !== k) map[k].members.add(raw);
  });
  return Object.values(map).map(x => ({ ...x, members: Array.from(x.members) })).sort((a,b) => b.total - a.total);
}
function mergeSource(from, into){
  if(!from || !into || from.toLowerCase() === into.toLowerCase()) return;
  if(!data.merges) data.merges = {};
  data.merges[from.toLowerCase()] = into;
  sheet = null;
  saveData(); render();
  showToast(`"${from}" ahora cuenta como "${into}"`);
}
function unmergeSource(name){
  if(!data.merges) return;
  delete data.merges[String(name).toLowerCase()];
  sheet = null;
  saveData(); render();
  showToast(`"${name}" volvió a ir por separado`);
}

// Renombrar cualquier movimiento del banco (entrada o salida). El nombre queda para ese comercio/fuente.
function startSourceEdit(id){ editingSourceTx = id; render(); setTimeout(() => { const el = document.getElementById('src-input-'+id); if(el) el.focus(); }, 50); }
function cancelSourceEdit(){ editingSourceTx = null; render(); }
function saveSourceName(id){

  const name = el.value.trim();

  } else delete data.bank.names[key];

  if(name) showToast(`Listo: "${niceName(key)}" ahora se llama "${name}". Si llega algo parecido, te pregunto.`);
}

// =====================================================================
//  REVISAR MOVIMIENTOS (tarjeta en Inicio)
//  Agrupa por comercio/persona: lo que contestas se aplica a todos los de ese comercio.
// =====================================================================
const NOISE_ONE = new RegExp(DESC_NOISE.source);
// Palabras del banco que no dicen nada del comercio: no sirven para comparar.
const GENERIC_WORDS = new Set(['JERSEY','CITY','BAYONNE','NEWARK','YORK','STORE','MARKET','PAYMENT','PAYMENTS','DEPOSIT','INC','LLC','COMPANY',
  'SERVICE','SERVICES','SVC','ONLINE','BILL','TRANSFER','ZELLE','SENT','RECEIVED','ELECTRONIC','PURCHASE','DEBIT','CREDIT','CARD','AUTOPAY',
  'RECURRING','WITHDRAWAL','CHECK','FUNDS','DIRECT','PAYROLL','INTERNET','MOBILE','BANK','CORP','STORES','SUPERCENTER','CENTER','WWW']);
const REVIEW_DAYS = 45;     // solo se pregunta por movimientos recientes
const SNOOZE_DAYS = 3;      // "Después" lo esconde estos días; a la segunda vez se descarta

function sigWords(s){
  return normDesc(s).replace(/[^A-Z ]/g,' ').split(' ').filter(w => w.length >= 4 && !GENERIC_WORDS.has(w) && !NOISE_ONE.test(' '+w+' '));
}
// Dirección (entrada/salida) de un comercio ya nombrado, según sus movimientos.
function keyDir(key){
  const t = bankList().find(x => merchantKey(x.desc) === key);
  return t ? t.dir : null;
}
// Sugerencia de nombre: mismo comercio ya nombrado, o uno que comparte una palabra propia (nunca mezcla entradas con salidas).
function suggestName(t){
  const names = data.bank.names || {};
  const key = merchantKey(t.desc);
  if(names[key]) return { name: names[key], exact: true, key };
  const words = sigWords(key);
  if(!words.length) return null;
  for(const k of Object.keys(names)){
    if(keyDir(k) !== t.dir) continue;
    const kw = sigWords(k);
    if(kw.some(w => words.includes(w)) || sameCompact(words, kw)) return { name: names[k], exact: false, key: k };
  }
  return null;
}

// "STAR SNACKS" y "STARSNACKS" son lo mismo: se comparan pegados.
function sameCompact(a, b){
  const ca = a.join(''), cb = b.join('');
  if(ca.length < 5 || cb.length < 5) return false;
  return ca.includes(cb) || cb.includes(ca) || b.some(w => w.length >= 5 && ca.includes(w)) || a.some(w => w.length >= 5 && cb.includes(w));
}
let questionRename = null;   // grupo al que le dijiste "No" y estás escribiendo qué es
let questionCats = null;     // grupo en el que abriste "Otra categoría"
function groupKeyOf(t){ return t.dir + '|' + merchantKey(t.desc); }
function groupTxs(gk){
  const since = addDays(new Date(), -REVIEW_DAYS);
  return bankList().filter(t => groupKeyOf(t) === gk && isoToDate(t.date) >= since && !t.qDismissed);
}
function pendingLoanFor(t){
  const k = merchantKey(t.desc);
  return data.loans.find(l => l.fromBank && !l.returned && l.personKey === k);
}

function pendingQuestions(){
  const today = todayISO();
  const since = addDays(new Date(), -REVIEW_DAYS);
  const groups = {};
  bankList().forEach(t => {
    if(t.qDismissed || isoToDate(t.date) < since) return;
    if(t.qSnooze && t.qSnooze > today) return;
    (groups[groupKeyOf(t)] = groups[groupKeyOf(t)] || []).push(t);
  });
  const qs = [];
  // Pagos repetidos: una deuda y un gasto fijo con casi el mismo monto
  detectDupes().forEach(d => qs.push({ kind:'dupe', gk: d.gk, dupe:d, date:'9999' }));
  Object.keys(groups).forEach(gk => {
    const txs = groups[gk].sort((a,b) => b.date.localeCompare(a.date));
    const t = txs[0];
    const key = merchantKey(t.desc);
    const base = { gk, txs, t, date: t.date };
    // 0) El mismo comercio quedó en dos cosas distintas: preguntar para que no se duplique
    const conf = groupConflict(gk);
    if(conf){ qs.push({ ...base, kind:'conflict', options: conf }); return; }
    // 1) Alguien te devuelve un préstamo
    const loan = t.dir === 'in' ? pendingLoanFor(t) : null;
    const loanTx = txs.find(x => x.dir === 'in' && x.category !== 'loanback' && !x.reviewed && pendingLoanFor(x));
    if(loan && loanTx){ qs.push({ ...base, t: loanTx, kind:'loanback', loan }); return; }
    // 2) Pagos de deuda / gasto fijo sin conectar
    const unlinked = txs.filter(x => (x.category === 'debt' || x.category === 'fixed') && !x.link && !x.linkAsked && x.dir === 'out');
    if(unlinked.length){
      const mem = (data.bank.linkMemory || {})[gk];
      const target = mem && (mem.type === 'debt' ? data.debts.find(d => d.id === mem.id) : data.expenses.find(e => e.id === mem.id));
      qs.push({ ...base, t: unlinked[0], txs: unlinked, kind:'link', target: target ? { type: mem.type, id: mem.id, name: target.name } : null });
      return;
    }
    // 3) Te devolvieron un préstamo pero falta decir cuál
    const lb = txs.find(x => x.category === 'loanback' && !x.loanId);
    if(lb){ qs.push({ ...base, t: lb, kind:'loanpick' }); return; }
    // 4) Nombre parecido a uno que ya pusiste
    if(!(data.bank.trust[key] >= 2) && txs.some(x => !x.nameOk) && t.category !== 'own' && t.category !== 'ignore'){
      const sug = suggestName(t);
      if(sug){ qs.push({ ...base, kind:'name', sug }); return; }
    }
    // 5) Comercio nuevo (o confirmado solo 1 vez): preguntar en qué categoría va
    const rule = findRule(key, t.dir);
    const unrev = txs.filter(x => !x.reviewed && x.auto !== 'manual-set' && x.auto !== 'manual' && !x.link);
    if(unrev.length && !ruleTrusted(rule)){
      qs.push({ ...base, t: unrev[0], txs: unrev, kind:'cat', last: rule ? rule.category : null });
    }
  });
  return qs.sort((a,b) => (b.date||'').localeCompare(a.date||''));
}

function setGroupCategory(gk, cat){
  const txs = groupTxs(gk);
  if(!txs.length || !BANK_CATS[cat]) return;
  const t = txs[0];
  const key = merchantKey(t.desc);
  txs.forEach(x => {
    if(x.category !== cat){
      if(x.link) unlinkTx(x);
      if(x.category === 'loan') removeLoanFromTx(x);
      if(x.category === 'loanback') removeRepayment(x);
    }
    x.category = cat; x.auto = 'manual-set'; x.reviewed = true;
  });
  upsertRule(key, t.dir, cat);
  questionCats = null;
  saveData();
  if(cat === 'debt' || cat === 'fixed'){ openLinkSheet(t.id, cat === 'debt' ? 'debt' : 'expense'); return; }
  if(cat === 'loan'){ txs.forEach(x => createLoanFromTx(x)); saveData(); sheet = { type:'loanDue', loanId: t.loanId }; render(); return; }
  if(cat === 'loanback'){ sheet = { type:'loanPick', txId: t.id }; render(); return; }
  render();
  showToast(`"${displayName(t)}" → ${BANK_CATS[cat].label}` + (txs.length > 1 ? ` (${txs.length} movimientos)` : '') + '. Lo recordaré.');
}
function dismissGroup(gk){
  if(gk.startsWith('dupe|')){ const [, a, b] = gk.split('|'); ignoreDupe(a, b); return; }
  groupTxs(gk).forEach(x => { x.qDismissed = true; x.reviewed = true; });
  questionRename = null; questionCats = null;
  saveData(); render();
  showToast('Descartado: no vuelve a aparecer');
}
function snoozeGroup(gk){
  if(gk.startsWith('dupe|')){ skippedDupes.add(gk); render(); return; }
  let dismissed = false;
  const until = dayISO(addDays(new Date(), SNOOZE_DAYS));
  groupTxs(gk).forEach(x => {
    x.qSnoozes = (x.qSnoozes || 0) + 1;
    if(x.qSnoozes >= 2){ x.qDismissed = true; dismissed = true; } else x.qSnooze = until;
  });
  questionRename = null; questionCats = null;
  saveData(); render();
  showToast(dismissed ? 'Ya lo habías dejado para después: lo descarté para que no se acumule' : `Te lo vuelvo a preguntar en ${SNOOZE_DAYS} días`);
}
function answerName(gk, yes){
  const txs = groupTxs(gk);
  if(!txs.length) return;
  const t = txs[0];
  const sug = suggestName(t);
  if(yes && sug){
    const key = merchantKey(t.desc);
    if(!sug.exact) data.bank.names[key] = sug.name;
    data.bank.trust[key] = (data.bank.trust[key] || 0) + 1;
    txs.forEach(x => { x.nameOk = true; });
    // Si el comercio parecido ya tenía categoría, se usa la misma
    const simRule = (data.bank.rules || []).find(r => r.key === sug.key && r.dir === t.dir);
    if(simRule && !findRule(key, t.dir)){ upsertRule(key, t.dir, simRule.category); txs.forEach(x => { if(!x.link){ x.category = simRule.category; x.reviewed = true; } }); }
    saveData(); render();
    showToast(`Listo: "${sug.name}"` + (txs.length > 1 ? ` (${txs.length} movimientos)` : ''));
  } else {
    questionRename = gk;
    render();
    setTimeout(() => { const el = document.getElementById('q-rename'); if(el) el.focus(); }, 50);
  }
}
function saveQuestionRename(gk){
  const txs = groupTxs(gk);
  const el = document.getElementById('q-rename');
  if(!txs.length || !el) return;
  const name = el.value.trim();
