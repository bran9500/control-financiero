// ================================================================ CAPTURAS DEL BANCO
// Subir un screenshot de los movimientos recientes (app de TD Bank, Zelle, etc.):
// el teléfono lee el texto (ML Kit, sin internet), aquí se arman los movimientos,
// se revisan/corrigen y se guardan. Cuando después llega el extracto con esos mismos
// movimientos, se reconocen y no se duplican.

const SHOT_IN_RE = /\b(DEPOSIT|DEP\b|PAYROLL|DIRECT DEP|ZELLE (FROM|PAYMENT FROM)|RECEIVED|RECIBID|REFUND|REEMBOLSO|CREDIT\b|INTEREST|MOBILE DEPOSIT|CASH APP.*FROM|TRANSFER FROM|FROM\b.*ZELLE)/i;
const SHOT_SKIP_RE = /^(search|buscar|transactions?|activity|actividad|movimientos|filter|filtrar|accounts?|cuentas?|see all|ver todo|view all|details?|detalles|statements?|home|inicio|pay|deposit|transfer|menu|more|más|help|ayuda|back|atr[aá]s|done|listo|all|todos|posted|pending|pendientes?|\d{1,2}:\d{2}.*|[\d%\s.]+)$/i;
const SHOT_BAL_RE = /(available|current|ledger|account)?\s*balance|saldo|disponible/i;
const MONTHS_ES = {ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};

let shotBusy = false;
let ocrSeq = 0;
const ocrWaiters = {};
window.onOcrResult = function(id, json){
  const w = ocrWaiters[id]; if(!w) return;
  delete ocrWaiters[id];
  try{ w.res(typeof json === 'string' ? JSON.parse(json) : json); }catch(e){ w.rej(e); }
};
window.onOcrError = function(id, msg){ const w = ocrWaiters[id]; if(!w) return; delete ocrWaiters[id]; w.rej(new Error(msg || 'no se pudo leer la imagen')); };

function canOcr(){ return !!(window.__ocrMock || (window.Android && typeof Android.ocrImage === 'function')); }

function imageToJpegB64(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      // Ancho máximo 1280 px: suficiente para leer y no satura el puente con Android.
      const sc = Math.min(1, 1280 / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.92).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('no es una imagen')); };
    img.src = url;
  });
}
function ocrFile(file){
  if(window.__ocrMock) return Promise.resolve(window.__ocrMock(file));
  return imageToJpegB64(file).then(b64 => new Promise((res, rej) => {
    const id = 'o' + (++ocrSeq);
    ocrWaiters[id] = { res, rej };
    setTimeout(() => { if(ocrWaiters[id]){ delete ocrWaiters[id]; rej(new Error('se demoró demasiado')); } }, 45000);
    Android.ocrImage(id, b64);
  }));
}

async function handleShotFiles(input){
  const files = Array.from(input.files || []);
  input.value = '';
  if(!files.length) return;
  if(!canOcr()){ importError = 'Leer capturas funciona dentro de la app del teléfono.'; render(); return; }
  importError = null; shotBusy = true; render();
  const all = [], warnings = []; let balance = null;
  for(const f of files){
    try{
      const ocr = await ocrFile(f);
      const r = parseShotOcr(ocr);
      if(!r.txs.length) warnings.push((f.name || 'captura') + ': no encontré movimientos con monto');
      all.push(...r.txs);
      if(r.balance !== null && balance === null) balance = r.balance;
    }catch(e){ warnings.push((f.name || 'captura') + ': ' + (e && e.message ? e.message : 'error')); }
  }
  shotBusy = false;
  if(!all.length){ importError = 'No pude sacar movimientos de la captura. ' + warnings.join(' · '); render(); return; }
  buildShotPreview(all, balance, files.length, warnings);
  render(); window.scrollTo(0,0);
}

// ---- leer la captura: cada monto es un movimiento; las líneas de texto de la izquierda
//      se juntan con el monto más cercano (en TD el nombre ocupa varias líneas) ----
const AMT_ONLY_RE = /^([-−–+]?)\s*\(?\s*\$\s?(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})\)?\s*(-|CR|DR)?$/i;
const AMT_RE = /([-−–+]?)\s*\(?\s*\$\s?(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})\)?/;
const SHOT_NOISE_RE = /^(deposit|zelle®?|transfer|accounts?|pay\s*&\s*transfer|products|more|info\s*&\s*manage|statements?|account activity|account\s*&\s*routing numbers|pending|posted|search|filter|see all|view all|td simple checking|td .*checking|.*savings|x\d{3,5}|cuentas?|movimientos|actividad|pendientes?)$/i;
const SHOT_SECTION_RE = /^(account activity|pending|actividad|movimientos|transactions|activity)$/i;

function shotLines(ocr){
  const H = ocr.h || 2400;
  return (ocr.lines || []).filter(l => l && l.t && String(l.t).trim())
    .map(l => ({ t:String(l.t).trim().replace(/^[^A-Za-z0-9$(+\-−–]+\s*/,'').replace(/^[£€¥@©®]\S*\s+/,'').replace(/\s*[>›»❯〉→]+$/,'').replace(/^(?=\S{1,3}\s)[^A-Za-z\s]*[)\]}|©®@£€¥]\S*\s+/,''), x:l.x, y:l.y, w:l.w, h:l.h, cy:l.y + l.h/2, r:l.x + l.w }))
    .filter(l => l.t)
    .filter(l => l.cy > H * 0.035)
    .flatMap(l => {
      const m = l.t.match(/^(.*[A-Za-z].*?)\s+([-−–+]?\s?\$\s?[\d,]+[.,]\d{2})$/);
      if(!m) return [l];
      const cw = l.w / l.t.length, w2 = Math.round(m[2].length * cw);
      return [{ ...l, t:m[1].trim(), w:l.w - w2, r:l.x + l.w - w2 }, { ...l, t:m[2], x:l.r - w2, w:w2 }];
    })
    .sort((a,b) => a.cy - b.cy || a.x - b.x);
}
function parseAmt(t){
  const mm = String(t).replace(/\s+/g,'').replace(/[,.;:]+$/,'').match(AMT_ONLY_RE);
  if(!mm) return null;
  return { v: parseFloat(mm[2].replace(/,/g,'') + '.' + mm[3]), sign: (/[-−–]/.test(mm[1]||'') || mm[4] === '-' || /DR/i.test(mm[4]||'') || /^\(/.test(String(t).trim())) ? -1 : (mm[1] === '+' || /CR/i.test(mm[4]||'')) ? 1 : 0 };
}
function parseShotDate(s){
  const t = String(s || '').trim().toLowerCase().replace(/\./g,'');
  const today = todayISO();
  if(/^(today|hoy)\b/.test(t)) return today;
  if(/^(yesterday|ayer)\b/.test(t)){ const d = new Date(today + 'T00:00:00'); d.setDate(d.getDate() - 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  let m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  let y, mo, d;
  if(m){ mo = +m[1]; d = +m[2]; y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
  else {
    m = t.match(/\b([a-záéíóú]{3,10})\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?\b/);
    if(m && (MONTHS_EN[m[1].slice(0,3)] || MONTHS_ES[m[1].slice(0,3)])){ mo = MONTHS_EN[m[1].slice(0,3)] || MONTHS_ES[m[1].slice(0,3)]; d = +m[2]; y = m[3] ? +m[3] : null; }
    else {
      m = t.match(/\b(\d{1,2})\s+(?:de\s+)?([a-záéíóú]{3,10})(?:\s+(?:de\s+)?(\d{4}))?\b/);
      if(m && (MONTHS_ES[m[2].slice(0,3)] || MONTHS_EN[m[2].slice(0,3)])){ d = +m[1]; mo = MONTHS_ES[m[2].slice(0,3)] || MONTHS_EN[m[2].slice(0,3)]; y = m[3] ? +m[3] : null; }
      else return null;
    }
  }
  if(!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
  if(!y){ y = +today.slice(0,4); if(ymd(y, mo, d) > today) y--; }
  return ymd(y, mo, d);
}
function isDateHeader(l){ return !!parseShotDate(l.t) && l.t.replace(/[^a-z]/gi,'').length <= 14 && !AMT_RE.test(l.t); }
function descOk(t){
  const letters = t.replace(/[^a-záéíóúñ]/gi,'');
  return letters.length >= 2 && (/[aeiouáéíóú]/i.test(letters) || letters.length >= 4);
}

function parseShotOcr(ocr){
  const W = ocr.w || 1080;
  const lines = shotLines(ocr);
  let balance = null;
  // 1) saldo disponible y fin de la parte de arriba (todo lo de arriba de "Account Activity"/"Pending" no son movimientos)
  let activityTop = -1;
  lines.forEach((l, k) => {
    if(/available balance|saldo disponible/i.test(l.t) && balance === null){
      const inl = l.t.match(AMT_RE);
      if(inl) balance = parseFloat(inl[2].replace(/,/g,'') + '.' + inl[3]);
      else { const nx = lines.slice(k+1, k+4).find(o => parseAmt(o.t)); if(nx) balance = parseAmt(nx.t).v; }
    }
    if(SHOT_SECTION_RE.test(l.t) && activityTop < 0 && (balance !== null || /account activity|actividad/i.test(l.t))) activityTop = l.y;
  });
  // En TD el saldo disponible sale arriba en letra grande y sin etiqueta: el monto más grande antes de "Account Activity".
  if(balance === null && activityTop >= 0){
    const big = lines.filter(l => l.cy < activityTop && parseAmt(l.t)).sort((a,b) => b.h - a.h)[0];
    if(big && lines.filter(l => l.cy < activityTop && parseAmt(l.t)).every(o => o === big || o.h < big.h * 0.7)) balance = parseAmt(big.t).v;
  }
  const isSummary = l => lines.some(o => o !== l && Math.abs(o.cy - l.cy) < Math.max(o.h, l.h) * 0.6 && /balance|total|saldo|disponible|numbers/i.test(o.t));
  // 2) montos: principales y saldos corridos (el número gris debajo del monto)
  const amts = [];
  lines.forEach(l => {
    const a = parseAmt(l.t);
    if(!a || l.x < W * 0.4) return;
    if(activityTop >= 0 && l.cy < activityTop) return;
    if(isSummary(l)) return;
    const prev = amts[amts.length - 1];
    if(prev && !prev.sub && l.cy - prev.l.cy < Math.max(prev.l.h, l.h) * 1.7 && (Math.abs(l.r - prev.l.r) < W * 0.1 || (l.h < prev.l.h * 0.8 && l.x >= prev.l.x - W * 0.05))){
      prev.sub = l; return;                                   // saldo después del movimiento: no es un movimiento
    }
    amts.push({ l, a, desc: [] });
  });
  if(!amts.length) return { txs: [], balance };
  // 3) secciones por fecha
  const headers = lines.filter(isDateHeader).map(l => ({ cy: l.cy, d: parseShotDate(l.t) }));
  const pendingTops = lines.filter(l => /^(pending|pendientes?)$/i.test(l.t.replace(/[^a-z]/gi,''))).map(l => l.cy);
  const sectionOf = cy => { let h = null; headers.forEach(x => { if(x.cy < cy) h = x; }); return h; };
  // 4) texto de la izquierda → al monto más cercano dentro de la misma sección
  lines.forEach(l => {
    if(l.x > W * 0.6 || parseAmt(l.t) || isDateHeader(l) || SHOT_NOISE_RE.test(l.t) || !descOk(l.t)) return;
    if(activityTop >= 0 && l.cy < activityTop) return;
    const sec = sectionOf(l.cy);
    let best = null, bd = 1e9;
    amts.forEach(m => { if(sectionOf(m.l.cy) !== sec) return; const d = Math.abs(m.l.cy - l.cy); if(d < bd){ bd = d; best = m; } });
    if(best && bd < Math.max(best.l.h, l.h) * 3.6) best.desc.push(l);
  });
  // 5) armar movimientos
  const anyMinus = amts.some(m => m.a.sign < 0);
  const txs = amts.map(m => {
    const desc = m.desc.sort((a,b) => a.cy - b.cy).map(l => l.t).join(' ')
      .replace(/[…]|\.\.\.$/g,'').replace(/\s+/g,' ').trim() || 'MOVIMIENTO';
    const sec = sectionOf(m.l.cy);
    const pending = !sec || pendingTops.some(p => p < m.l.cy && (!sec || p > sec.cy));
    const dir = m.a.sign < 0 ? 'out' : m.a.sign > 0 ? 'in' : (anyMinus ? 'in' : (SHOT_IN_RE.test(desc) ? 'in' : 'out'));
    return { date: sec ? sec.d : todayISO(), desc: desc.toUpperCase(), amount: m.a.v, dir, balance: null, fromPdf: true, src: 'shot', pending: pending && !sec };
  });
  return { txs, balance };
}

function shotWords(d){ return new Set(String(d).toUpperCase().split(/[^A-Z0-9']+/).filter(w => w.length >= 4 && !/^(DEBIT|CARD|AUTHORIZATION|PURCHASE|PAYMENT|TEMP|AUTH|RECEIVED|SENT)$/.test(w))); }
function sameShotTx(a, b){
  if(a.date !== b.date || a.dir !== b.dir || Math.round(a.amount*100) !== Math.round(b.amount*100)) return false;
  if(merchantKey(a.desc) === merchantKey(b.desc)) return true;
  const wa = shotWords(a.desc), wb = shotWords(b.desc);
  for(const w of wa) if(wb.has(w)) return true;
  return false;
}

// ¿Es el mismo movimiento? Mismo sentido y monto, fechas a 5 días o menos
// (en la app sale la fecha de la compra y en el extracto la del cobro).
function sameMove(a, b){
  if(a.dir !== b.dir || Math.round(a.amount*100) !== Math.round(b.amount*100)) return false;
  const da = new Date(a.date + 'T00:00:00'), db = new Date(b.date + 'T00:00:00');
  return Math.abs(da - db) <= 5 * 86400000;
}

function buildShotPreview(txs, balance, nFiles, warnings){
  // repetidos entre capturas que se pisan
  const uniq = [];
  txs.forEach(t => { const u = uniq.find(u => sameShotTx(u, t)); if(!u) uniq.push(t); else if(t.desc.length > u.desc.length) u.desc = t.desc; });
  const usedStored = new Set();
  const fresh = []; let dup = 0;
  uniq.forEach(t => {
    const hit = bankList().find(s => !usedStored.has(s.id) && sameMove(s, t));
    if(hit){ usedStored.add(hit.id); dup++; return; }
    fresh.push(t);
  });
  fresh.sort((a,b) => b.date.localeCompare(a.date));
  const used = new Set(bankList().filter(t => t.manualId).map(t => t.manualId));
  let manualDup = 0;
  const stamp = Date.now().toString(36);
  fresh.forEach((t, i) => {
    t.fp = txFingerprint(t);
    const g = guessCategory(t); t.category = g.category; t.auto = g.auto;
    const m = findManualMatch(t, used);
    if(m){ used.add(m.id); t.manualId = m.id; t.category = 'ignore'; t.auto = 'manual'; manualDup++; }
    t.id = 's' + stamp + '_' + i;
  });
  const dates = uniq.map(t => t.date).sort();
  importPreview = {
    shot: true,
    fileName: nFiles === 1 ? 'Captura' : nFiles + ' capturas', fileCount: nFiles,
    fresh, dup, manualDup, skipped: 0, total: uniq.length, warnings,
    from: dates[0], to: dates[dates.length-1],
    lastBalance: balance, lastBalanceDate: balance !== null ? todayISO() : null,
    updateBalance: balance !== null, shotUpgrades: []
  };
}

let shotEditIdx = null;
function editShotRow(i){ shotEditIdx = shotEditIdx === i ? null : i; render(); }
function saveShotRow(i){

  if(t.auto !== 'manual-set'){ const g = guessCategory(t); t.category = g.category; t.auto = g.auto; }
  shotEditIdx = null; render();
}
function removeShotRow(i){
  if(!importPreview) return;
  importPreview.fresh.splice(i, 1); shotEditIdx = null; render();
}
function addShotRow(){
  if(!importPreview) return;
  importPreview.fresh.unshift({ date: todayISO(), desc: 'MOVIMIENTO', amount: 0, dir: 'out', balance: null, fromPdf: true, src: 'shot', category: 'gasto', auto: 'manual-set', id: 's' + Date.now().toString(36) + '_n' });
  shotEditIdx = 0; render();
}

const PAY_FREQS = {
  semanal:  { label:'Cada semana',     noun:'semana',   art:'esta semana',   plural:'semanas',   adj:'semanal',  por:'por semana' },
  biweekly: { label:'Cada 2 semanas',  noun:'quincena', art:'esta quincena', plural:'quincenas', adj:'quincenal', por:'por quincena' },
  quincenal:{ label:'Quincenal (15 y fin de mes)', noun:'quincena', art:'esta quincena', plural:'quincenas', adj:'quincenal', por:'por quincena' },
  mensual:  { label:'Cada mes',        noun:'mes',      art:'este mes',      plural:'meses',     adj:'mensual',  por:'por mes' }
};
function payFreq(){ return (typeof prefs !== 'undefined' && prefs && PAY_FREQS[prefs.payFreq]) ? prefs.payFreq : 'semanal'; }
function PL(){ return PAY_FREQS[payFreq()]; }
function periodsPerMonth(){ return { semanal:4.345, biweekly:26/12, quincenal:2, mensual:1 }[payFreq()]; }
function startOfUserWeek(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  const ws = (typeof prefs !== 'undefined' && prefs && prefs.weekStart != null) ? prefs.weekStart : 1;
  date.setDate(date.getDate() - ((date.getDay() - ws + 7) % 7));
  return date;
}
function periodBounds(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const f = payFreq();
  let s, e;
  if(f === 'quincenal'){
    if(x.getDate() <= 15){ s = new Date(x.getFullYear(), x.getMonth(), 1); e = new Date(x.getFullYear(), x.getMonth(), 15); }
    else { s = new Date(x.getFullYear(), x.getMonth(), 16); e = new Date(x.getFullYear(), x.getMonth() + 1, 0); }
  } else if(f === 'mensual'){
    const pd = Math.min(Math.max(1, +prefs.payDay || 1), 28);
    s = x.getDate() >= pd ? new Date(x.getFullYear(), x.getMonth(), pd) : new Date(x.getFullYear(), x.getMonth() - 1, pd);
    e = new Date(s.getFullYear(), s.getMonth() + 1, pd - 1);
  } else if(f === 'biweekly'){
    let a = prefs.payAnchor ? new Date(prefs.payAnchor + 'T00:00:00') : startOfUserWeek(new Date(2026, 0, 5));
    const days = Math.floor((x - a) / 86400000);
    s = new Date(a.getFullYear(), a.getMonth(), a.getDate() + Math.floor(days / 14) * 14);
    e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 13);
  } else {
    s = startOfUserWeek(x); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
  }
  e.setHours(23,59,59,999);
  return { s, e };
}

function currencyInfo(){
  const k = (typeof prefs !== 'undefined' && prefs && CURRENCIES[prefs.currency]) ? prefs.currency : 'USD';
  const c = Object.assign({ code:k }, CURRENCIES[k]);
  try{ c.dotThousands = (1.5).toLocaleString(c.locale).includes(','); }catch(e){ c.dotThousands = false; }
  return c;

function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function applyPrefs(){
  const r = document.documentElement.style;
  const ac = ACCENTS[prefs.accent] || ACCENTS.verde, bg = BACKGROUNDS[prefs.bg] || BACKGROUNDS.grafito, f = FONTS[prefs.font] || FONTS.clasica;
  r.setProperty('--accent', ac.c); r.setProperty('--on-accent', ac.on);
  r.setProperty('--accent-soft', hexA(ac.c, .16)); r.setProperty('--accent-line', hexA(ac.c, .5));
  r.setProperty('--bg', bg.bg); r.setProperty('--surface', bg.s); r.setProperty('--surface-raised', bg.r); r.setProperty('--line', bg.l);
  r.setProperty('--serif', f.title); r.setProperty('--sans', f.body);
  document.body && (document.body.style.zoom = (SIZES[prefs.size] || SIZES.normal).z);
  const meta = document.querySelector('meta[name=theme-color]'); if(meta) meta.content = bg.bg;
}
function setPref(k, v){ prefs[k] = v; savePrefs(); applyPrefs(); render(); }

function firstName(){ return (prefs.name || '').trim().split(/\s+/)[0] || ''; }
function greetingLine(){
  const n = firstName();
  const h = new Date().getHours();
  const part = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const who = n ? `<b class="greet-name">${escapeAttr(n)}</b>` : '';
  if(prefs.greet === 'parce'){
    const day = Math.floor(Date.now() / 86400000);
    const opts = h >= 19 || h < 5
      ? ['Buenas noches', '¿Cómo te fue hoy', '¿Qué más pues']
      : ['¿Qué más', 'Buenas', '¿Cómo va todo', '¿Qué hubo'];
    const o = opts[day % opts.length];
    const q = o.startsWith('¿');
    return n ? `${o}, ${who}${q ? '?' : ''}` : `${o}${q ? '?' : ''}`;
  }
  const icon = prefs.greet === 'emoji' ? (h < 12 ? '☀️ ' : h < 19 ? '🌤️ ' : '🌙 ') : '';
  return `${icon}${part}${n ? ', ' + who : ''}`;
}

function obFinish(){ prefs.onboarded = true; savePrefs(); obStep = 0; activeTab = 'home'; render(); window.scrollTo(0,0); if(!prefs.toured) setTimeout(() => startTour(), 350); else showToast(firstName() ? `¡Listo, ${firstName()}! Todo quedó guardado` : '¡Listo! Todo quedó guardado'); }
function reopenOnboarding(){ prefs.onboarded = false; savePrefs(); obGo(1); }
function obRestoreFile(input){
  const f = input.files && input.files[0]; input.value = '';
  if(!f) return;
  if(previewMode){ obError = 'En la vista previa no se restaura nada. Sal de la vista previa primero.'; render(); return; }
  readFileText(f).then(txt => {
    let parsed; try{ parsed = JSON.parse(txt); }catch(e){ obError = 'Ese archivo no es un respaldo de la app.'; render(); return; }
    if(!parsed || typeof parsed !== 'object' || !(parsed.debts || parsed.bank || parsed.incomes || parsed.ledger)){ obError = 'Ese archivo no parece un respaldo de Control Financiero.'; render(); return; }
    restoreAnyBackup(parsed);
    obGo(1); showToast('Respaldo restaurado ✓');
  }).catch(() => { obError = 'No pude abrir el archivo.'; render(); });
}
// Acepta el respaldo viejo (solo finanzas) y el completo (finanzas + subapps + preferencias).
function restoreAnyBackup(parsed){
  if(parsed.ledger){
    Object.keys(parsed.extra || {}).forEach(k => { try{ localStorage.setItem(k, typeof parsed.extra[k] === 'string' ? parsed.extra[k] : JSON.stringify(parsed.extra[k])); }catch(e){} });
    if(parsed.prefs){ prefs = Object.assign(defaultPrefs(), parsed.prefs, { onboarded: prefs.onboarded }); savePrefs(); applyPrefs(); }
    parsed = parsed.ledger;
  }
  data = normalizeData(parsed); saveBlocked = false; loadState = 'ok'; saveData();
}

function fullBackupObject(){
  const extra = {};
  ['ingles-data','interes-data','notas-data','notes-data','rotador-data'].forEach(k => { try{ const v = localStorage.getItem(k); if(v) extra[k] = v; }catch(e){} });
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k !== STORAGE_KEY && k !== PREFS_KEY && !(k in extra)) extra[k] = localStorage.getItem(k); } }catch(e){}
  return { app:'control-financiero', version:2, date: todayISO(), ledger: data, prefs, extra };
}

function normTxt(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/<[^>]+>/g, ' '); }
function helpScore(hay, q){
  const words = normTxt(q).split(/\s+/).filter(w => w.length >= 2);
  if(!words.length) return 0;
  const h = normTxt(hay); let sc = 0;
  for(const w of words){ const stem = w.length > 4 ? w.slice(0, w.length - 1) : w; if(h.includes(w)) sc += 3; else if(h.includes(stem)) sc += 2; else return 0; }
  return sc;
}
function setHelpQ(v){ helpQ = v; helpOpenIdx = -1; const el = document.getElementById('help-results'); if(el) el.innerHTML = renderHelpResults(); }
function pickSuggest(s){ helpQ = s; helpOpenIdx = -1; render(); }

  const open = helpOpenIdx === i;
  return `<div class="faq ${open?'open':''}"><button class="faq-q" onclick="toggleFaq(${i})"><span>${f.q}</span><span class="chevron ${open?'open':''}">›</span></button>${open ? `<div class="faq-a">${f.a}</div>` : ''}</div>`;
}
function renderHelpResults(){
  const q = helpQ.trim();
  if(!q){
    const cats = [...new Set(FAQ.map(f => f.c))];
    return cats.map(c => `<p class="ob-label">${c}</p>` + FAQ.map((f,i) => [f,i]).filter(([f]) => f.c === c).map(([f,i]) => faqItem(f, i)).join('')).join('');
  }
  const goes = HELP_GO.map(g => ({ g, s: helpScore(g.t + ' ' + g.k, q) })).filter(x => x.s).sort((a,b) => b.s - a.s).slice(0, 4);
  const faqs = FAQ.map((f,i) => ({ f, i, s: helpScore(f.q + ' ' + f.a + ' ' + f.c, q) + helpScore(f.q, q) })).filter(x => x.s).sort((a,b) => b.s - a.s);
  if(!goes.length && !faqs.length) return `<p class="empty-note">No encontré nada con "${escapeAttr(q)}". Prueba con otra palabra, por ejemplo: ${HELP_SUGGEST.slice(0,3).join(', ')}.</p>`;
  return (goes.length ? `<p class="ob-label">Ir a</p><div class="help-go">${goes.map(x => `<button onclick="${x.g.go}">${x.g.t}<span>›</span></button>`).join('')}</div>` : '')
    + (faqs.length ? `<p class="ob-label">Preguntas</p>` + faqs.map(x => faqItem(x.f, x.i)).join('') : '');
}

// ================================================================ CAMBIO DE MONEDA
// Convertidor (por ejemplo dólares → pesos colombianos para mandar plata).
// Usa tasas guardadas en la app y las actualiza solas cuando hay internet.
const FX_KEY = 'fx-rates';
let fxLastTry = 0;
let fxState = { from: null, to: null, amount: '' , busy:false, err:'' };
function fxRates(){
  try{ const c = JSON.parse(localStorage.getItem(FX_KEY) || 'null'); if(c && c.rates && c.date >= FX_SNAPSHOT.date) return c; }catch(e){}
  return FX_SNAPSHOT;
}
function fxConvert(amount, from, to){
  const r = fxRates().rates, a = r[from.toLowerCase()], b = r[to.toLowerCase()];
  if(!a || !b) return null;
  return amount / a * b;            // tasas con base en dólar
}
function fmtIn(code, n, precise){
  const c = CURRENCIES[code]; if(!c) return n.toFixed(2);
  const small = precise && Math.abs(n) < 10;
  const s = Math.abs(n).toLocaleString(c.locale, small ? { minimumFractionDigits: 2, maximumSignificantDigits: 4 } : { minimumFractionDigits: c.dec, maximumFractionDigits: c.dec });
  return (n < 0 ? '-' : '') + (c.after ? s + ' ' + c.sym : c.sym + s);
}
async function fxRefresh(manual){
  if(fxState.busy) return;
  const age = Date.now() - (fxRates().fetched || 0);
  if(!manual && (age < 6 * 3600 * 1000 || Date.now() - fxLastTry < 10 * 60 * 1000)) return;   // no insistir sin internet
  fxLastTry = Date.now();
  fxState.busy = true; fxState.err = ''; if(manual) render();
  const urls = ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
                'https://latest.currency-api.pages.dev/v1/currencies/usd.json'];
  let ok = false;
  for(const u of urls){
    try{
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
      const res = await fetch(u, { signal: ctl.signal }); clearTimeout(t);
      const d = await res.json();
      if(d && d.usd && d.usd.cop){
        localStorage.setItem(FX_KEY, JSON.stringify({ date: String(d.date).replace(/\./g,'-'), rates: d.usd, fetched: Date.now() }));
        ok = true; break;
      }
    }catch(e){}
  }
  if(!ok){
    // respaldo: otra fuente con distinto formato
    try{ const res = await fetch('https://open.er-api.com/v6/latest/USD'); const d = await res.json();
      if(d && d.rates && d.rates.COP){ const r = {}; Object.keys(d.rates).forEach(k => r[k.toLowerCase()] = d.rates[k]);
        localStorage.setItem(FX_KEY, JSON.stringify({ date: new Date((d.time_last_update_unix||0)*1000 || Date.now()).toISOString().slice(0,10), rates: r, fetched: Date.now() })); ok = true; } }catch(e){}
  }
  fxState.busy = false;
  if(!ok && manual) fxState.err = 'Sin internet ahora: uso las últimas tasas guardadas.';
  if(ok && (activeTab === 'more' || activeTab === 'fx')) render();
  else if(manual) render();
  if(ok && manual) showToast('Tasas actualizadas ✓');
}
function fxSet(k, v){ fxState[k] = v; const el = document.getElementById('fx-out'); if(k === 'amount' && el){ el.innerHTML = fxResult(); return; } render(); }
function fxSwap(){ const f = fxState.from; fxState.from = fxState.to; fxState.to = f; render(); }
function fxResult(){
  const from = fxState.from || currencyInfo().code, to = fxState.to || (from === 'USD' ? 'COP' : 'USD');
  const amt = parseFloat(String(fxState.amount).replace(/[^\d.]/g,'')) || 0;
  const v = fxConvert(amt || 1, from, to);
  if(v === null) return `<p class="item-meta">No tengo la tasa de esa moneda.</p>`;
  return `<div class="fx-big">${amt ? fmtIn(to, v) : '—'}</div>
    <p class="item-meta">1 ${from} = ${fmtIn(to, fxConvert(1, from, to), true)} · 1 ${to} = ${fmtIn(from, fxConvert(1, to, from), true)}</p>`;
}
function renderFxCard(){
  setTimeout(() => fxRefresh(false), 50);
  const from = fxState.from || currencyInfo().code, to = fxState.to || (from === 'USD' ? 'COP' : 'USD');
  const d = fxRates().date;
  return `<div class="card" data-tour="fx">
    <div class="card-head"><div><p class="card-title">Cambio de moneda</p><p class="card-sub">Tasas del ${fmtShortDate(d)}${fxState.busy ? ' · actualizando…' : ''}</p></div>
      <button class="card-link" onclick="fxRefresh(true)">↻ Actualizar</button></div>
    <div class="fx-row">
      <input type="text" inputmode="decimal" class="fx-amt" placeholder="Monto" value="${escapeAttr(fxState.amount)}" oninput="fxSet('amount', this.value)">
      ${currencySelect('fx-from', from, "fxSet('from', this.value)").replace('cur-select','cur-select fx-sel')}
    </div>
    <div style="text-align:center;margin:6px 0;"><button class="mini-btn" onclick="fxSwap()">⇅ Invertir</button></div>
    ${currencySelect('fx-to', to, "fxSet('to', this.value)").replace('cur-select','cur-select fx-sel')}
    <div id="fx-out" style="margin-top:12px;">${fxResult()}</div>
    ${fxState.err ? `<p class="item-meta" style="color:var(--warn);margin-top:6px;">${fxState.err}</p>` : ''}
    <p class="item-meta" style="margin-top:8px;">Es la tasa del mercado; las remesadoras y los bancos cobran un poco más.</p>
  </div>`;
}

let tourIdx = -1, tourAuto = null;
function tourFill(s){ return String(s).replace(/\{noun\}/g, PL().noun).replace(/\{art\}/g, PL().art); }
function tourActive(){ return tourIdx >= 0; }
function startTour(auto){
  tourIdx = 0; tourAuto = auto || null;
  document.body.classList.add('touring');
  tourSavedZoom = document.body.style.zoom; document.body.style.zoom = 1;
  tourShow();
}
let tourSavedZoom = '';
function tourEnd(){
  tourIdx = -1; clearTimeout(tourAuto && tourAuto.t);
  document.body.classList.remove('touring');
  document.body.style.zoom = tourSavedZoom || '';
  const r = document.getElementById('tour-root'); if(r) r.innerHTML = '';
  prefs.toured = true; savePrefs();
  activeTab = 'home'; render(); window.scrollTo(0,0);
}
function tourNext(){ if(tourIdx < TOUR.length - 1){ tourIdx++; tourShow(); } else tourEnd(); }
function tourPrev(){ if(tourIdx > 0){ tourIdx--; tourShow(); } }
function tourEl(st){
  if(!st.sel) return null;
  const els = Array.from(document.querySelectorAll(`[data-tour="${st.sel}"]`));
  return els.find(e => e.offsetParent !== null || e.getClientRects().length) || null;
}
function tourShow(){
  let st = TOUR[tourIdx];
  if(st.tab && activeTab !== st.tab){ activeTab = st.tab; if(st.tab === 'mov') movSeg = 'incomes'; if(st.tab === 'debts') debtSeg = 'debts'; }
  if(st.sel && st.sel.startsWith('sec-')){ /* abre la sección para que se vea */ }
  render();
  let root = document.getElementById('tour-root');
  if(!root){ root = document.createElement('div'); root.id = 'tour-root'; document.body.appendChild(root); }
  let el = tourEl(st);
  // si esa parte no existe todavía (por ejemplo no hay preguntas), se salta
  if(st.sel && !el){ if(tourIdx < TOUR.length - 1){ tourIdx++; return tourShow(); } }
  if(el){
    const fixed = getComputedStyle(el).position === 'fixed' || el.closest('.tabbar');
    if(!fixed){ const r0 = el.getBoundingClientRect(); window.scrollTo(0, Math.max(0, window.scrollY + r0.top - Math.max(90, (window.innerHeight - Math.min(r0.height, window.innerHeight * .5)) / 2 - 60))); }
  } else window.scrollTo(0,0);
  setTimeout(() => tourDraw(el, st), 60);
}
function tourDraw(el, st){
  const root = document.getElementById('tour-root'); if(!root || tourIdx < 0) return;
  const vw = window.innerWidth, vh = window.innerHeight, pad = 8;
  let hole = '', tipPos;
  const n = TOUR.length;
  if(el){
    const r = el.getBoundingClientRect();
    const top = Math.max(6, r.top - pad), left = Math.max(6, r.left - pad);
    const w = Math.min(vw - 12, r.width + pad*2), h = Math.min(vh - 12, r.height + pad*2);
    hole = `<div class="tour-hole" style="top:${top}px;left:${left}px;width:${w}px;height:${h}px;"></div>`;
    const below = vh - (top + h), above = top;
    tipPos = below >= 210 || below > above ? `top:${Math.min(vh - 200, top + h + 12)}px;` : `bottom:${Math.min(vh - 200, vh - top + 12)}px;`;
  } else {
    hole = `<div class="tour-dim"></div>`;
    tipPos = `top:${Math.round(vh * .32)}px;`;
  }
  root.innerHTML = `${hole}
    <div class="tour-tip" style="${tipPos}">
      <div class="tour-count">${tourIdx + 1} de ${n}</div>
      <p class="tour-title">${tourFill(st.title)}</p>
      <p class="tour-text">${tourFill(st.text)}</p>
      <div class="tour-btns">
        <button class="card-link" onclick="tourEnd()" style="color:var(--ink-faint);">Saltar</button>
        <span style="flex:1;"></span>
        ${tourIdx > 0 ? `<button class="btn" onclick="tourPrev()">Atrás</button>` : ''}
        <button class="btn btn-solid" onclick="tourNext()">${tourIdx === n - 1 ? 'Terminar' : 'Siguiente'}</button>
      </div>
    </div>`;
  if(tourAuto){ clearTimeout(tourAuto.t); tourAuto.t = setTimeout(tourNext, tourAuto.ms || 4200); }
}
window.addEventListener('resize', () => { if(tourActive()) tourDraw(tourEl(TOUR[tourIdx]), TOUR[tourIdx]); });

// ---- video tutorial ----
let showVideo = false;
function openVideo(){
  let root = document.getElementById('tour-root');
  if(!root){ root = document.createElement('div'); root.id = 'tour-root'; document.body.appendChild(root); }
  root.innerHTML = `<div class="video-wrap" onclick="if(event.target===this)closeVideo()">
    <div class="video-box">
      <video src="tutorial.mp4" controls autoplay playsinline preload="auto" style="width:100%;border-radius:12px;background:#000;display:block;max-height:78vh;object-fit:contain;"></video>
      <div class="btn-row" style="margin-top:10px;"><button class="btn" style="flex:1;" onclick="closeVideo()">Cerrar</button><button class="btn btn-solid" style="flex:1;" onclick="closeVideo();startTour()">Hacer el recorrido</button></div>
    </div></div>`;
}
function closeVideo(){ const r = document.getElementById('tour-root'); if(r) r.innerHTML = ''; }

loadData();
